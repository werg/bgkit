[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bgkit"
version = "0.1.0"
description = "Background Knowledge Interaction Transformer"
readme = "docs/01_overview.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "transformers>=5.5",
    "safetensors>=0.7",
    "datasets>=4.0",
    "tokenizers>=0.22",
    "gitpython",
    "pygit2>=1.19",
    "hydra-core>=1.3",
    "omegaconf",
    "wandb>=0.24",
    "numpy>=2.0",
    "tqdm",
    "rich",
    "structlog",
    "httpx>=0.28",
    "python-dotenv>=1.1",
]

[project.optional-dependencies]
gpu = [
    "accelerate>=1.12",
    "peft>=0.18",
    "bitsandbytes>=0.49",
    "einops>=0.8",
    "flash-attn-4[cu13]>=4.0.0b9",
    "flash-linear-attention>=0.4.2",
    "liger-kernel>=0.7",
]
dev = [
    "pytest>=9.0",
    "pytest-cov",
    "ruff>=0.15",
    "mypy>=1.19",
    "pre-commit",
    "jupyterlab",
    "matplotlib",
]
data = [
    "aiosqlite>=0.20",
    "tree-sitter-language-pack>=0.6",
]
eval = [
    "sentence-transformers>=2.7",
    "faiss-cpu",
    "rouge-score>=0.1.2",
    "tree-sitter-language-pack>=0.6",
]

[dependency-groups]
torch = ["torch>=2.10"]

[project.scripts]
bgkit-data = "bgkit.data.cli:main"
bgkit-ckpt = "bgkit.training.checkpoint_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bgkit"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N812"]  # Allow `import torch.nn.functional as F` (PyTorch convention)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "E402"]  # Allow unused imports and late imports after pytest.importorskip
"scripts/**" = ["E402"]  # Allow late imports after sys.path setup for standalone execution

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests requiring GPU",
    "integration: integration tests",
    "smoke: smoke tests (1-step training)",
]
