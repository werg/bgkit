[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bgkit"
version = "0.1.0"
description = "Background Knowledge Interaction Transformer"
readme = "docs/01_overview.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    # Custom decoder/backbone integrations depend on 5.5 internals. Keep the
    # tested minor series bounded so an upstream refactor cannot silently alter
    # training behavior on the next environment sync.
    "transformers>=5.5,<5.6",
    "safetensors>=0.7",
    "datasets>=4.0",
    "tokenizers>=0.22",
    "gitpython",
    "pygit2>=1.19",
    "hydra-core>=1.3",
    "omegaconf",
    "wandb>=0.24",
    "numpy>=2.0",
    "tqdm",
    "rich",
    "structlog",
    "httpx>=0.28",
    "python-dotenv>=1.1",
]

[project.optional-dependencies]
gpu = [
    "accelerate>=1.12",
    "peft>=0.18",
    "bitsandbytes>=0.49",
    "einops>=0.8",
    "flash-attn-4[cu13]>=4.0.0b9",
    # Pinned to fla main commit 1d4d88ff (2026-04-21) for post-0.4.2
    # improvements: GDN backward kernel optimization (PR #849/#823),
    # varlen cu_seqlens path fixes (#839, #842, #844), fused_recurrent
    # gate-activation fusion (#848). chunk_gated_delta_rule signature
    # is unchanged from 0.4.2, so our deltanet_patch.py still works.
    "flash-linear-attention @ git+https://github.com/fla-org/flash-linear-attention.git@1d4d88ff2dd3f6df3560d502a0ad3a34472f1ee5",
    "liger-kernel>=0.7",
    # Apple Cut Cross Entropy is the default decoder LM loss on GB10. Pinned
    # to the tested revision from the 2026-05-07 training-step benchmarks.
    "cut-cross-entropy @ git+https://github.com/apple/ml-cross-entropy.git@b7a02791b234e187b524fb1dba6a812d521b203a",
]
dev = [
    "pytest>=9.0",
    "pytest-cov",
    "ruff>=0.15",
    "mypy>=1.19",
    "pre-commit",
    "jupyterlab",
    "matplotlib",
]
data = [
    "aiosqlite>=0.20",
    "tree-sitter-language-pack>=0.6",
]
eval = [
    "sentence-transformers>=2.7",
    "faiss-cpu",
    "rouge-score>=0.1.2",
    "tree-sitter-language-pack>=0.6",
]

[dependency-groups]
torch = ["torch>=2.10"]

[project.scripts]
bgkit-data = "bgkit.data.cli:main"
bgkit-ckpt = "bgkit.training.checkpoint_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bgkit"]

# Allow git+https direct references in dependencies (e.g. the fla pin
# to a specific upstream commit for GDN backward kernel optimizations).
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N812"]  # Allow `import torch.nn.functional as F` (PyTorch convention)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "E402"]  # Allow unused imports and late imports after pytest.importorskip
"scripts/**" = ["E402"]  # Allow late imports after sys.path setup for standalone execution

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests requiring GPU",
    "integration: integration tests",
    "smoke: smoke tests (1-step training)",
]
