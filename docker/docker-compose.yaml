    restart: "no"
    command: ["scripts/train.py", "+experiment=bgkit2_p24_open_decoder"]

  train-bgkit2-p26:
    <<: *gpu-common
    restart: "no"
    # NOTE: do NOT add an `environment:` key here — it REPLACES the gpu-common
    # anchor's list instead of extending it, and the container then starts
    # without PYTHONPATH / FLASH_ATTENTION_* / BGKIT_* and dies in entrypoint.sh
    # ("FLASH_ATTENTION_SM12X_USE_EXTENSION: unbound variable", 2026-09-15).
    # Per-run allocator changes go in .env (BGKIT_CUDA_MEM_FRACTION).
    command: ["scripts/train.py", "+experiment=bgkit2_p26_agentic_distill"]

  train-bgkit2-m1:
    <<: *gpu-common
    restart: "no"
    # Stage A of the multi-level encoder: pre-warm encoder.repro alone.
    # No `environment:` key here — it would REPLACE the gpu-common anchor's
    # list and the container dies in entrypoint.sh (see train-bgkit2-p26).
    # Pinned to P26's image: the Dockerfile is unchanged, and a new service name
    # otherwise triggers a cold rebuild under its own tag (a 30-minute network
    # pull, and drift from the image the measured runs actually used).
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_m1_repro_prewarm"]

  train-bgkit2-m2:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_m2_bridge_distill"]

  train-bgkit2-m2b:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_m2b_bridge_distill_grouped"]

  train-bgkit2-m3:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_m3_tree_nav"]

  train-bgkit2-m3-nobridge:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_m3_tree_nav_nobridge"]

  train-bgkit2-p28:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_p28_stage_d"]

  train-bgkit2-p29:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_p29_stage_d_unfrozen"]

  train-bgkit2-p30:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_p30_stage_d_whole_repo"]

  train-bgkit2-m4:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_m4_tree_nav_whole_repo"]

  train-bgkit2-p31:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_p31_stage_d_whole_repo_bigq"]

  train-bgkit2-p32:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_p32_agentic_overview"]

  train-bgkit2-p33:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_p33_agentic_browse"]

  train-bgkit2-p34:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_p34_browse_overview_dropout"]

  train-bgkit2-w3:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_w3_prompted_readout"]

  train-bgkit2-w3b:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_w3b_prompted_readout_tight"]

  train-bgkit2-s1:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_s1_showcase"]

  # S1b: S1 with the encoder adapter (optim.encoder_mode adapter). NOT launched
  # by default -- fill resume_checkpoint / init_* in the experiment first.
  train-bgkit2-s1b:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_s1b_showcase_encoder"]

  # S2 showcase (2026-09-23): S1b recipe + agentic (LFM trajectories with overview), web research,
  # two-stage memory; initialised from S1b's final checkpoint (configs/experiment/bgkit2_s2_showcase.yaml).
  train-bgkit2-s2:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_s2_showcase"]

  # 8B-A (decoder scale-up, plans/decoder_scaleup_8b_2026_09_25.md): LFM2.5-8B-A1B decoder, frozen S2 encoder.
  train-bgkit2-8b-a:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_8b_a"]

  # S1b memory probe: a few training steps on the largest rows (guarded).
  probe-bgkit2-s1b-memory:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/bgkit2_probe_s1b_memory.py", "--experiment", "bgkit2_s1b_showcase_encoder"]

  train-bgkit2-w1:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_w1_path_walk"]

  train-bgkit2-w2:
    <<: *gpu-common
    restart: "no"
    image: docker-train-bgkit2-p26:latest
    command: ["scripts/train.py", "+experiment=bgkit2_w2_path_walk_all_repos"]

  train-bgkit2-p27:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=bgkit2_p27_agentic_distill"]

  train-bgkit2-p19a2:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=bgkit2_p19a2_backbone_align"]

  train-bgkit2-p19a3:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=bgkit2_p19a3_lastblock_projblock"]

  train-bgkit2-p19a4:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=bgkit2_p19a4_input_skip"]

  train-bgkit2-p19a5:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=bgkit2_p19a5_rms_interface"]

  train-bgkit2-p19a6:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=bgkit2_p19a6_frozen_mlp_rms"]

  # BenchPress evaluation of a bgkit2 checkpoint (their data/templates/metrics).
  # Override the command's args with `docker compose run --rm eval-bgkit2-benchpress
  # scripts/bgkit2_eval_benchpress.py --checkpoint ... --out ...`.
  eval-bgkit2-benchpress:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/bgkit2_eval_benchpress.py", "--help"]

  # Student model server for the agent harness (scripts/bgkit2_eval_agent.py):
  #   CK=eval_keep/<ckpt> EXP=bgkit2_p24_open_decoder docker compose -f docker/docker-compose.yaml up -d serve-bgkit2-student
  serve-bgkit2-student:
    <<: *gpu-common
    restart: "no"
    mem_limit: 40g
    memswap_limit: 40g
    ports:
      - "8097:8097"
    command: ["scripts/bgkit2_student_server.py", "--checkpoint", "/workspace/checkpoints/${CK:-eval_keep/missing}", "--experiment", "${EXP:-bgkit2_p24_open_decoder}", "--port", "8097", "--tree-root-cache", "${TREE_ROOT_CACHE:-}"]

  # P2 rung 1: LoRA on the decoder's lower layers + top-4 encoder layers,
  # all five task stores. Launch only after P1 is stopped.
  train-bgkit2-p2:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=bgkit2_p2_rung1"]

  # P3 anti-collapse: P2 + anchor floor + decorrelation penalty + faster
  # interface EMA. Launch only after P2 is stopped.
  train-bgkit2-p3:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=bgkit2_p3_anticollapse"]

  # P4 rung 0 warm, full encoder trainable, frozen decoder.
  train-bgkit2-p4:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=bgkit2_p4_rung0_fullenc"]

  # P5 rung 1 + KD from the full-text teacher.
  train-bgkit2-p5:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=bgkit2_p5_rung1_kd"]

  # P6: frozen encoder backbone + decoder LoRA + KD (the decoder isolated).
  train-bgkit2-p6:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=bgkit2_p6_frozenenc_lora_kd"]

  # P7: encoder LoRA (all layers) + frozen decoder + KD from the full-text teacher.
  train-bgkit2-p7:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=bgkit2_p7_enclora_frozendec_kd"]

  # P7b: P7 + hard row-norm interface + LoRA 5e-5 + non-finite skip.
  train-bgkit2-p7b:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=bgkit2_p7b_enclora_rownorm"]

  # P7c: P7b + within-document diversity penalty + anchor floor 0.5.
  train-bgkit2-p7c:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=bgkit2_p7c_diversity"]

  smoke-bgkit2-p1:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=bgkit2_p1_prompted",
              "run_name=bgkit2_p1_smoke", "training.max_steps=20",
              "training.warmup_steps=5", "training.eval_every=20",
              "training.save_every=20", "training.bgkit2.data.eval_samples=24",
              "training.bgkit2.data.gen_samples=8",
              "training.bgkit2.data.task_eval_samples=16",
              "training.bgkit2.data.task_gen_samples=8", "wandb.enabled=false"]

  train-phase2-kb-widenet-v12-xref:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=phase2_kb_widenet_v12_xref"]

  # Long-prose semantic fact recall (babilong_style) alongside the code
  # wide-net datasets; the zero-shot BABILong arm scored 0.00 on every cell
  # (2026-08-25), teacher-forced and free-running alike.
  train-phase2-kb-babilong-v1:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=phase2_kb_babilong_v1"]

  # Family-A blob compaction SFT (lean trainer over SWE-Zero trajectories;
  # capability-packaging §4, built 2026-08-24).
  train-blob-sft-v1:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=blob_sft_v1"]

  # 8-step wall-time / memory SMOKE of the per-repo full-backprop trainer (the
  # review's M1/M2 check) on the worst-case-inclusive git_commit_repro_smoke
  # subset. restart: "no" so the probe runs once and exits (not a real run).
  train-phase2-kb-git-repro-smoke:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=phase2_kb_git_repro_smoke"]

  # The real git-commit-repro full-backprop curriculum run. Wide-open config
  # (max_file_samples_per_repo null + live-tunable via control.json; both
  # dynamic-ckpt safeguards wired; round-robin decoders). restart: "no" so an
  # early crash stays crashed (informative for babysitting); flip to
  # on-failure once the run is stable past the first big windows.
  train-phase2-kb-git-repro-fullbackprop:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/train.py", "+experiment=phase2_kb_git_repro_fullbackprop"]

  # Recursive-L1 (L1->L1) bridge distillation. Clone of train-phase2-kb-stage-a
  # (gpu-common) with the command overridden. Trains ONLY encoder.l1l1_bridge;
  # decoder-agnostic (no decoder loaded).
  train-phase2-kb-l1l1-distill:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase2_kb_l1l1_distill"]

  train-phase2-kb-stage-a-falcon:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase2_kb_stage_a_falcon"]

  train-phase2-kb-stage-b-falcon:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase2_kb_stage_b_falcon"]

  # Packed-attention memory profiler for Phase 1 Step 3. Hard memory cap
  # prevents the unified-memory OOM from cascading to the host (DGX Spark
  # shares 128 GB between CPU + GPU). Previous unbounded profiler run
  # (2026-04-20) crashed the harness; cap is NON-negotiable.
  # Invoke via:
  #   docker compose -f docker/docker-compose.yaml run --rm profile-phase1-step3
  profile-phase1-step3:
    <<: *gpu-common
    mem_limit: 80g
    memswap_limit: 80g
    command: [
      "scripts/profile_packed_memory.py",
      "+experiment=phase1_step3",
    ]

  profile-phase1-step5:
    <<: *gpu-common
    mem_limit: 80g
    memswap_limit: 80g
    command: [
      "scripts/profile_packed_memory.py",
      "+experiment=phase1_step5",
    ]

  profile-phase1-step6:
    <<: *gpu-common
    mem_limit: 80g
    memswap_limit: 80g
    command: [
      "scripts/profile_packed_memory.py",
      "+experiment=phase1_step6",
    ]

  # Phase 2 KB-scale memory profiler.  Hard memory cap (80g) prevents
  # unified-memory OOM from cascading to the host, same as Phase 1.
  # Invoke via:
  #   docker compose -f docker/docker-compose.yaml run --rm profile-phase2-kb-stage-a
  profile-phase2-kb-stage-a:
    <<: *gpu-common
    mem_limit: 80g
    memswap_limit: 80g
    command: [
      "scripts/profile_packed_memory_phase2.py",
      "+experiment=phase2_kb_stage_a",
    ]

  profile-phase2-kb-stage-b:
    <<: *gpu-common
    mem_limit: 80g
    memswap_limit: 80g
    command: [
      "scripts/profile_packed_memory_phase2.py",
      "+experiment=phase2_kb_stage_b",
    ]

  # Interactive GPU shell with FlashQLA/FLA/FA4 on PYTHONPATH. FlashQLA is
  # still edited from the host checkout; the mount is read-only here so ad hoc
  # container commands cannot dirty kernel sources by accident.
  shell-flashqla:
    <<: *gpu-common
    mem_limit: 40g
    memswap_limit: 40g
    restart: "no"
    stdin_open: true
    tty: true
    environment:
      - HOME=/workspace
      - HYDRA_FULL_ERROR=1
      - TORCHINDUCTOR_CACHE_DIR=/workspace/.cache/torchinductor
      - TRITON_CACHE_DIR=/workspace/checkpoints/.triton-cache
      - FLA_CACHE_MODE=${FLA_CACHE_MODE:-full}
      - FLA_GDR_SAVE_INTERMEDIATES=${FLA_GDR_SAVE_INTERMEDIATES:-0}
      - FLA_GDR_SAVE_LOCAL_ATTENTION=${FLA_GDR_SAVE_LOCAL_ATTENTION:-1}
      - FLA_GDR_RECOMPUTE_WY_DW=${FLA_GDR_RECOMPUTE_WY_DW:-1}
      - FLA_GDR_FUSE_WY_DG_CUMSUM=${FLA_GDR_FUSE_WY_DG_CUMSUM:-1}
      - FLA_GDR_FUSE_DQKG_WY=${FLA_GDR_FUSE_DQKG_WY:-1}
      - FLA_GDR_FUSE_GATE_BWD=${FLA_GDR_FUSE_GATE_BWD:-1}
      - TILELANG_CACHE_DIR=/workspace/.cache/tilelang
      - TVM_CACHE_DIR=/workspace/.cache/tvm
      - PYTHONPATH=/workspace/flashqla:/workspace/fla:/workspace/flash-attention:/workspace/bgkit/src:/usr/local/lib/python3.12/dist-packages/nvidia_cutlass_dsl/python_packages
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,garbage_collection_threshold:0.8,max_split_size_mb:512
      - TORCHINDUCTOR_DISABLE_CUDAGRAPHS=1
      - TORCH_COMPILE_DISABLE=1
      - FLA_USE_TMA=1
      - BGKIT_BOOTSTRAP_FLASH_ATTN_NATIVE=0
      - BGKIT_ALLOW_PEER_CUDA=${BGKIT_ALLOW_PEER_CUDA:-0}
      - BGKIT_CUDA_MEM_FRACTION=${BGKIT_CUDA_MEM_FRACTION:-0.20}
      - BGKIT_GDN_BACKEND=${BGKIT_GDN_BACKEND:-fla}
      - BGKIT_DECODER_CE_IMPL=${BGKIT_DECODER_CE_IMPL:-cce}
    command: ["bash"]

  # Environment smoke test for the FlashQLA toolchain. This does not run the
  # kernels; it reports CUDA/TileLang/FLA/FlashQLA import status and classifies
  # the known Hopper-only import gate separately from missing dependencies.
  smoke-flashqla:
    <<: *gpu-common
    mem_limit: 20g
    memswap_limit: 20g
    restart: "no"
    environment:
      - HOME=/workspace
      - HYDRA_FULL_ERROR=1
      - TORCHINDUCTOR_CACHE_DIR=/workspace/.cache/torchinductor
      - TRITON_CACHE_DIR=/workspace/checkpoints/.triton-cache
      - FLA_CACHE_MODE=${FLA_CACHE_MODE:-full}
      - FLA_GDR_SAVE_INTERMEDIATES=${FLA_GDR_SAVE_INTERMEDIATES:-0}
      - FLA_GDR_SAVE_LOCAL_ATTENTION=${FLA_GDR_SAVE_LOCAL_ATTENTION:-1}
      - FLA_GDR_RECOMPUTE_WY_DW=${FLA_GDR_RECOMPUTE_WY_DW:-1}
      - FLA_GDR_FUSE_WY_DG_CUMSUM=${FLA_GDR_FUSE_WY_DG_CUMSUM:-1}
      - FLA_GDR_FUSE_DQKG_WY=${FLA_GDR_FUSE_DQKG_WY:-1}
      - FLA_GDR_FUSE_GATE_BWD=${FLA_GDR_FUSE_GATE_BWD:-1}
      - TILELANG_CACHE_DIR=/workspace/.cache/tilelang
      - TVM_CACHE_DIR=/workspace/.cache/tvm
      - PYTHONPATH=/workspace/flashqla:/workspace/fla:/workspace/flash-attention:/workspace/bgkit/src:/usr/local/lib/python3.12/dist-packages/nvidia_cutlass_dsl/python_packages
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,garbage_collection_threshold:0.8,max_split_size_mb:512
      - TORCHINDUCTOR_DISABLE_CUDAGRAPHS=1
      - TORCH_COMPILE_DISABLE=1
      - FLA_USE_TMA=1
      - BGKIT_BOOTSTRAP_FLASH_ATTN_NATIVE=0
      - BGKIT_ALLOW_PEER_CUDA=${BGKIT_ALLOW_PEER_CUDA:-0}
      - BGKIT_CUDA_MEM_FRACTION=${BGKIT_CUDA_MEM_FRACTION:-0.10}
      - BGKIT_GDN_BACKEND=${BGKIT_GDN_BACKEND:-fla}
      - BGKIT_DECODER_CE_IMPL=${BGKIT_DECODER_CE_IMPL:-cce}
    command: ["scripts/flashqla_env_smoke.py"]

  # Build/import smoke test for the optional Luce Qwen3.5 megakernel backend.
  # This enables only the Luce bootstrap and skips FlashAttention bootstrap so
  # the service is focused on extension build/import health.
  smoke-luce-megakernel:
    <<: *gpu-common
    mem_limit: 40g
    memswap_limit: 40g
    restart: "no"
    environment:
      - HOME=/workspace
      - HYDRA_FULL_ERROR=1
      - TORCHINDUCTOR_CACHE_DIR=/workspace/.cache/torchinductor
      - TRITON_CACHE_DIR=/workspace/checkpoints/.triton-cache
      - TILELANG_CACHE_DIR=/workspace/.cache/tilelang
      - TVM_CACHE_DIR=/workspace/.cache/tvm
      - PYTHONPATH=/workspace/flashqla:/workspace/fla:/workspace/flash-attention:/workspace/bgkit/src:/usr/local/lib/python3.12/dist-packages/nvidia_cutlass_dsl/python_packages
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,garbage_collection_threshold:0.8,max_split_size_mb:512
      - TORCHINDUCTOR_DISABLE_CUDAGRAPHS=1
      - TORCH_COMPILE_DISABLE=1
      - FLA_USE_TMA=1
      - BGKIT_BOOTSTRAP_FLASH_ATTN_NATIVE=0
      - BGKIT_BOOTSTRAP_LUCE_MEGAKERNEL=1
      - BGKIT_ALLOW_PEER_CUDA=${BGKIT_ALLOW_PEER_CUDA:-0}
      - BGKIT_CUDA_MEM_FRACTION=${BGKIT_CUDA_MEM_FRACTION:-0.20}
      - BGKIT_GDN_BACKEND=${BGKIT_GDN_BACKEND:-fla}
      - BGKIT_DECODER_CE_IMPL=${BGKIT_DECODER_CE_IMPL:-cce}
      - MAX_JOBS=${MAX_JOBS:-2}
      - NVCC_THREADS=${NVCC_THREADS:-1}
    command: ["scripts/luce_megakernel_env_smoke.py"]

  # Forward parity for the BgKIT-adapted Luce megakernel. Loads Qwen3.5 once,
  # packs the same state dict into Luce, and compares token embedding prefill
  # plus short survivor-splice generation against ReconstructionDecoder.
  parity-luce-megakernel:
    <<: *gpu-common
    mem_limit: 70g
    memswap_limit: 70g
    restart: "no"
    environment:
      - HOME=/workspace
      - HYDRA_FULL_ERROR=1
      - TORCHINDUCTOR_CACHE_DIR=/workspace/.cache/torchinductor
      - TRITON_CACHE_DIR=/workspace/checkpoints/.triton-cache
      - TILELANG_CACHE_DIR=/workspace/.cache/tilelang
      - TVM_CACHE_DIR=/workspace/.cache/tvm
      - PYTHONPATH=/workspace/flashqla:/workspace/fla:/workspace/flash-attention:/workspace/bgkit/src:/usr/local/lib/python3.12/dist-packages/nvidia_cutlass_dsl/python_packages
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,garbage_collection_threshold:0.8,max_split_size_mb:512
      - TORCHINDUCTOR_DISABLE_CUDAGRAPHS=1
      - TORCH_COMPILE_DISABLE=1
      - FLA_USE_TMA=1
      - BGKIT_BOOTSTRAP_FLASH_ATTN_NATIVE=1
      - BGKIT_BOOTSTRAP_LUCE_MEGAKERNEL=1
      - BGKIT_ALLOW_PEER_CUDA=${BGKIT_ALLOW_PEER_CUDA:-0}
      - BGKIT_CUDA_MEM_FRACTION=${BGKIT_CUDA_MEM_FRACTION:-0.45}
      - BGKIT_GDN_BACKEND=${BGKIT_GDN_BACKEND:-fla}
      - BGKIT_DECODER_CE_IMPL=${BGKIT_DECODER_CE_IMPL:-cce}
      - MAX_JOBS=${MAX_JOBS:-2}
      - NVCC_THREADS=${NVCC_THREADS:-1}
    command:
      [
        "scripts/test_luce_megakernel_parity.py",
        "--mode",
        "all",
        "--quiet",
        "--decode-steps",
        "4",
        "--max-new-tokens",
        "2",
      ]

  # FlashQLA parity smoke test. Runs scripts/test_flashqla_parity.py inside
  # the training image with the baked TileLang toolchain and FlashQLA/FLA bind
  # mounts. Hard memory cap (40g) so a runaway JIT compile cannot OOM the host.
  parity-flashqla:
    <<: *gpu-common
    mem_limit: 40g
    memswap_limit: 40g
    restart: "no"
    environment:
      - HOME=/workspace
      - HYDRA_FULL_ERROR=1
      - TORCHINDUCTOR_CACHE_DIR=/workspace/.cache/torchinductor
      - TRITON_CACHE_DIR=/workspace/checkpoints/.triton-cache
      - FLA_CACHE_MODE=${FLA_CACHE_MODE:-full}
      - FLA_GDR_SAVE_INTERMEDIATES=${FLA_GDR_SAVE_INTERMEDIATES:-0}
      - FLA_GDR_SAVE_LOCAL_ATTENTION=${FLA_GDR_SAVE_LOCAL_ATTENTION:-1}
      - FLA_GDR_RECOMPUTE_WY_DW=${FLA_GDR_RECOMPUTE_WY_DW:-1}
      - FLA_GDR_FUSE_WY_DG_CUMSUM=${FLA_GDR_FUSE_WY_DG_CUMSUM:-1}
      - FLA_GDR_FUSE_DQKG_WY=${FLA_GDR_FUSE_DQKG_WY:-1}
      - FLA_GDR_FUSE_GATE_BWD=${FLA_GDR_FUSE_GATE_BWD:-1}
      - TILELANG_CACHE_DIR=/workspace/.cache/tilelang
      - TVM_CACHE_DIR=/workspace/.cache/tvm
      - PYTHONPATH=/workspace/flashqla:/workspace/fla:/workspace/flash-attention:/workspace/bgkit/src:/usr/local/lib/python3.12/dist-packages/nvidia_cutlass_dsl/python_packages
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,garbage_collection_threshold:0.8,max_split_size_mb:512
      - TORCHINDUCTOR_DISABLE_CUDAGRAPHS=1
      - TORCH_COMPILE_DISABLE=1
      - FLA_USE_TMA=1
      - BGKIT_BOOTSTRAP_FLASH_ATTN_NATIVE=0
      - BGKIT_ALLOW_PEER_CUDA=${BGKIT_ALLOW_PEER_CUDA:-0}
      - BGKIT_CUDA_MEM_FRACTION=${BGKIT_CUDA_MEM_FRACTION:-0.20}
      - BGKIT_GDN_BACKEND=${BGKIT_GDN_BACKEND:-fla}
      - BGKIT_DECODER_CE_IMPL=${BGKIT_DECODER_CE_IMPL:-cce}
    command: ["scripts/test_flashqla_parity.py"]

  # Lightweight backend timing harness for FLA vs FlashQLA after the sm_121
  # kernels exist. Until then it fails with the same classified FlashQLA import
  # or launch error as the parity service.
  profile-flashqla:
    <<: *gpu-common
    mem_limit: 40g
    memswap_limit: 40g
    restart: "no"
    environment:
      - HOME=/workspace
      - HYDRA_FULL_ERROR=1
      - TORCHINDUCTOR_CACHE_DIR=/workspace/.cache/torchinductor
      - TRITON_CACHE_DIR=/workspace/checkpoints/.triton-cache
      - FLA_CACHE_MODE=${FLA_CACHE_MODE:-full}
      - FLA_GDR_SAVE_INTERMEDIATES=${FLA_GDR_SAVE_INTERMEDIATES:-0}
      - FLA_GDR_SAVE_LOCAL_ATTENTION=${FLA_GDR_SAVE_LOCAL_ATTENTION:-1}
      - FLA_GDR_RECOMPUTE_WY_DW=${FLA_GDR_RECOMPUTE_WY_DW:-1}
      - FLA_GDR_FUSE_WY_DG_CUMSUM=${FLA_GDR_FUSE_WY_DG_CUMSUM:-1}
      - FLA_GDR_FUSE_DQKG_WY=${FLA_GDR_FUSE_DQKG_WY:-1}
      - FLA_GDR_FUSE_GATE_BWD=${FLA_GDR_FUSE_GATE_BWD:-1}
      - TILELANG_CACHE_DIR=/workspace/.cache/tilelang
      - TVM_CACHE_DIR=/workspace/.cache/tvm
      - PYTHONPATH=/workspace/flashqla:/workspace/fla:/workspace/flash-attention:/workspace/bgkit/src:/usr/local/lib/python3.12/dist-packages/nvidia_cutlass_dsl/python_packages
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,garbage_collection_threshold:0.8,max_split_size_mb:512
      - TORCHINDUCTOR_DISABLE_CUDAGRAPHS=1
      - TORCH_COMPILE_DISABLE=1
      - FLA_USE_TMA=1
      - BGKIT_BOOTSTRAP_FLASH_ATTN_NATIVE=0
      - BGKIT_ALLOW_PEER_CUDA=${BGKIT_ALLOW_PEER_CUDA:-0}
      - BGKIT_CUDA_MEM_FRACTION=${BGKIT_CUDA_MEM_FRACTION:-0.20}
      - BGKIT_GDN_BACKEND=${BGKIT_GDN_BACKEND:-fla}
      - BGKIT_DECODER_CE_IMPL=${BGKIT_DECODER_CE_IMPL:-cce}
    command: ["scripts/profile_flashqla_backend.py", "--backend", "both"]

  preprocess:
    build:
      context: ..
      dockerfile: docker/Dockerfile.data
    volumes:
      - ${DATA_DIR}:/workspace/data
    command: ["scripts/process_repos.py"]

  llama-large:
    <<: *llama-common
    ports:
      - "${LLAMA_PORT_LARGE:-8080}:8080"
    command: >-
      --model /models/${LLAMA_MODEL_LARGE:-LFM2-8B-A1B-Q4_K_M.gguf}
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLAMA_CTX_LARGE:-32768}
      --n-gpu-layers 999
      --parallel ${LLAMA_PARALLEL_LARGE:-2}
      --flash-attn on --no-mmap --jinja

  llama-small:
    <<: *llama-common
    ports:
      - "${LLAMA_PORT_SMALL:-8081}:8080"
    command: >-
      --model /models/${LLAMA_MODEL_SMALL:-LFM2.5-1.2B-Instruct-Q8_0.gguf}
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLAMA_CTX_SMALL:-65536}
      --n-gpu-layers 999
      --parallel ${LLAMA_PARALLEL_SMALL:-2}
      --flash-attn on --no-mmap --jinja

  llama-tiny:
    <<: *llama-common
    ports:
      - "${LLAMA_PORT_TINY:-8082}:8080"
    command: >-
      --model /models/${LLAMA_MODEL_TINY:-Qwen3-0.6B-Q8_0.gguf}
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLAMA_CTX_TINY:-65536}
      --n-gpu-layers 999
      --parallel ${LLAMA_PARALLEL_TINY:-8}
      --flash-attn on --no-mmap --jinja

  # --- vLLM inference (primary + fast) ---

  vllm-primary:
    <<: *vllm-common
    image: "${VLLM_IMAGE_PRIMARY:-vllm-mxfp4-spark:latest}"
    ports:
      - "${VLLM_PORT_PRIMARY:-8090}:8000"
    environment:
      NVIDIA_DISABLE_REQUIRE: "1"
      TIKTOKEN_ENCODINGS_BASE: /workspace/vllm/tiktoken_encodings
      VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: "1"
    command: >-
      vllm serve ${VLLM_MODEL_PRIMARY:-openai/gpt-oss-20b}
      --quantization mxfp4
      --mxfp4-backend CUTLASS
      --mxfp4-layers moe,qkv,o,lm_head
      --gpu-memory-utilization ${VLLM_GPU_UTIL_PRIMARY:-0.45}
      --max-model-len 32768
      --enable-prefix-caching
      --max-num-batched-tokens 8192
      --kv-cache-dtype fp8
      --attention-backend FLASHINFER
      --load-format fastsafetensors
      --enforce-eager

  vllm-fast:
    <<: *vllm-common
    image: "${VLLM_IMAGE_FAST:-vllm-node:latest}"
    ports:
      - "${VLLM_PORT_FAST:-8091}:8000"
    environment:
      NVIDIA_DISABLE_REQUIRE: "1"
    command: >-
      vllm serve ${VLLM_MODEL_FAST:-Qwen/Qwen3.5-0.8B}
      --gpu-memory-utilization ${VLLM_GPU_UTIL_FAST:-0.10}
      --max-model-len ${VLLM_MAX_MODEL_LEN_FAST:-32768}
      --enable-prefix-caching
      --enable-chunked-prefill

  # --- Atlas inference (single-server, replaces vllm primary+fast) ---
  # Switch model via ATLAS_MODEL env var or by using the named presets below.
  # Uses network_mode: host per Atlas requirements (shared GPU memory access).
  atlas:
    image: "${ATLAS_IMAGE:-avarok/atlas-gb10:latest}"
    network_mode: host
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${ATLAS_PORT:-8888}/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s
    command: >-
      serve ${ATLAS_MODEL:-bg-digitalservices/Gemma-4-26B-A4B-it-NVFP4A16}
      --port ${ATLAS_PORT:-8888}
      --kv-cache-dtype turbo4
      --max-batch-size 8

  # Pure-attention MoE — batching scales linearly; target for description generation.
  atlas-gemma:
    image: "${ATLAS_IMAGE:-avarok/atlas-gb10:latest}"
    network_mode: host
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: "no"
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${ATLAS_PORT:-8888}/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s
    command: >-
      serve bg-digitalservices/Gemma-4-26B-A4B-it-NVFP4A16
      --port ${ATLAS_PORT:-8888}
      --kv-cache-dtype turbo4
      --max-batch-size 8

volumes:
  bgkit-compile-cache:
  bgkit-triton-cache:
  bgkit-tilelang-cache:
  bgkit-tvm-cache:
