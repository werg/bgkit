x-gpu-common: &gpu-common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  volumes:
    - ${DATA_DIR:-../data}:/workspace/data
    - ${HF_HOME:-~/.cache/huggingface}:/workspace/hf_cache
    - ${CHECKPOINT_DIR:-../checkpoints}:/workspace/checkpoints
    - ../configs:/workspace/bgkit/configs:ro
    - ../scripts:/workspace/bgkit/scripts:ro
    # Wandb authenticates via netrc (machine api.wandb.ai).
    # To override, pass -e WANDB_API_KEY=... to docker compose run.
    - ~/.netrc:/root/.netrc:ro

services:
  train:
    <<: *gpu-common
    command: ["scripts/train.py"]

  train-ice:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=ice_train"]

  train-joint-block:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=joint_block_pretrain"]

  train-phase1-step1:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step1"]

  ice-labels:
    <<: *gpu-common
    command: ["scripts/generate_ice_labels.py"]

  preprocess:
    build:
      context: ..
      dockerfile: docker/Dockerfile.data
    volumes:
      - ${DATA_DIR:-../data}:/workspace/data
    command: ["scripts/process_repos.py"]
