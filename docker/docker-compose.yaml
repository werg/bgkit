x-gpu-common: &gpu-common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  # Run as host user so files written to bind mounts (checkpoints, HF cache)
  # are owned by the host user, not root.
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  # Hard memory cap: DGX Spark has 128 GB unified (CPU+GPU share one pool). A
  # runaway CUDA alloc OOM-kills host processes (including the Claude Code
  # harness). The cap bounds the container; anything above this limit gets
  # container-scoped OOM'd rather than taking down the host. 80 GB leaves
  # ~48 GB headroom for the OS, harness, and any concurrent Docker services.
  # Added 2026-04-20 after an unsupervised profiler run crashed the host.
  mem_limit: 80g
  memswap_limit: 80g
  # Stop grace period: the emergency-save handler serializes encoder + decoder
  # + optimizer state on SIGTERM. For a 500M-param Muon-trained model on
  # the external spinning-disk checkpoint dir, that's 20-60 s. Docker
  # Compose's default 10 s is not enough — SIGKILL lands mid-save and the
  # emergency checkpoint is lost. Raised to 180 s on 2026-04-21 after a
  # phase1_step3 stop at step ~4250 lost ~250 steps because the save
  # didn't finish before SIGKILL.
  # 600s (was 180s): a graceful stop triggers an emergency checkpoint save, and
  # checkpointing.save_checkpoint now fsyncs before returning. A large ckpt
  # (summarization: ~15 GB / ~9 GB bf16) fsynced to the slow USB HDD
  # (/mnt/external, ~27 MB/s) can exceed 180s, so docker SIGKILLs mid-fsync and
  # the emergency save is lost (safe — atomic rename → falls back to the last
  # periodic checkpoint — but wasteful). 600s lets it complete.
  stop_grace_period: 600s
  # DataLoader workers hand tensors to the main process through torch's
  # file_descriptor sharing strategy: one open fd per tensor in flight. Docker's
  # default soft nofile (1024) ran out at step ~375 of bgkit2_8b_a (2026-09-25),
  # whose two-tokenizer batches carry one decoder-side id tensor per tool slot.
  ulimits:
    nofile:
      soft: 65536
      hard: 524288
  # Auto-recover on crash: if training exits with a non-zero status (OOM,
  # CUDA error, kernel panic), Docker restarts the container. The trainer
  # always resumes from the latest registered checkpoint via
  # `bgkit_checkpoint: auto`, so a single restart loses at most
  # save_every (500) steps. ``unless-stopped`` (vs ``on-failure``) means
  # the container doesn't restart if WE bring it down deliberately
  # (``compose stop``), only if it crashes.
  restart: unless-stopped
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  environment:
    - HOME=/workspace
    - HYDRA_FULL_ERROR=1
    # Triton autotuner crash on sm_121 is handled by bgkit.utils.triton_patch
    # Persist torch.compile cache across container restarts
    - TORCHINDUCTOR_CACHE_DIR=/workspace/.cache/torchinductor
    # Triton autotune cache. Default is ~/.triton/cache (= /workspace/.triton
    # under HOME=/workspace), which is in the container's writable layer and
    # gets wiped by ``docker compose rm``. Point it at the bind-mounted
    # CHECKPOINT_DIR so the autotune.json files persist across container
    # removal — meaning each (kernel, shape) signature is autotuned ONCE
    # ever, not once per container life. Eliminates the ~50-step JIT-warmup
    # tail after each restart. (PR #798's `fla/configs/` mechanism is the
    # static, ship-with-fork variant; this is the live, grow-during-training
    # variant. They coexist.)
    - TRITON_CACHE_DIR=/workspace/checkpoints/.triton-cache
    # NVMe fast checkpoint dir: trainers write checkpoints here (fast fsync, no
    # spinning-disk dirty-page spike), then async-copy to the HDD archive
    # (${CHECKPOINT_DIR}). Backed by a host bind-mount on NVMe (see volumes), so
    # it survives container restarts and resume can prefer the NVMe copy.
    - BGKIT_FAST_CHECKPOINT_DIR=/workspace/checkpoints_fast
    # Use shipped GB10 FLA configs before falling back to Triton autotune.
    # This keeps the conservative GDR h/dhu BV=16 defaults from adding
    # repeated autotune stalls on future training restarts.
    - FLA_CACHE_MODE=${FLA_CACHE_MODE:-full}
    # Keep Blackwell's fused GDR backward path explicit in every training
    # service. Real Step 5 fixed-batch profiling is faster and lower-peak-memory
    # with saved GDR intermediates off, so default to recompute unless an A/B run
    # explicitly overrides it.
    - FLA_GDR_SAVE_INTERMEDIATES=${FLA_GDR_SAVE_INTERMEDIATES:-0}
    - FLA_GDR_SAVE_LOCAL_ATTENTION=${FLA_GDR_SAVE_LOCAL_ATTENTION:-1}
    - FLA_GDR_RECOMPUTE_WY_DW=${FLA_GDR_RECOMPUTE_WY_DW:-1}
    - FLA_GDR_FUSE_WY_DG_CUMSUM=${FLA_GDR_FUSE_WY_DG_CUMSUM:-1}
    - FLA_GDR_FUSE_DQKG_WY=${FLA_GDR_FUSE_DQKG_WY:-1}
    - FLA_GDR_FUSE_GATE_BWD=${FLA_GDR_FUSE_GATE_BWD:-1}
    # TileLang/TVM caches for FlashQLA JIT kernels. The image provides the
    # toolchain; these dirs keep compiled artifacts out of the container layer.
    - TILELANG_CACHE_DIR=/workspace/.cache/tilelang
    - TVM_CACHE_DIR=/workspace/.cache/tvm
    # FLA is the default GatedDeltaNet backend on sm_121. It carries the
    # local Blackwell compatibility and GDR backward optimizations. Set
    # BGKIT_GDN_BACKEND=flashqla for explicit FlashQLA testing, or =auto to
    # prefer FlashQLA when it becomes faster and falls back cleanly.
    - BGKIT_GDN_BACKEND=${BGKIT_GDN_BACKEND:-fla}
    - BGKIT_MEM_BREAKDOWN=${BGKIT_MEM_BREAKDOWN:-0}
    # Cap the phase2_kb setup-time trajectory coverage scan to a bounded random
    # sample per split (the full O(n) parse is pathological at 1.87M+ samples,
    # e.g. git_commit_repro / Stage B). Only triggers when a split exceeds the
    # cap; smaller datasets still full-scan. Unset/<=0 = full scan.
    - BGKIT_COVERAGE_SCAN_MAX_SAMPLES=${BGKIT_COVERAGE_SCAN_MAX_SAMPLES:-2000}
    # Apple Cut Cross Entropy is the GB10 default for decoder LM loss:
    # measured 2026-05-07 at seq2048 as ~7% lower total step time and
    # ~2.8 GiB lower peak memory than BgKIT chunked CE. Set =chunked for
    # fallback/bisecting; missing CCE package falls back safely.
    - BGKIT_DECODER_CE_IMPL=${BGKIT_DECODER_CE_IMPL:-cce}
    # Local mamba-ssm fork: skip GB10/sm_121 Triton autotune configs that
    # repeatedly exceed the 101 KB shared-memory cap on Falcon-H1 shapes.
    - MAMBA_SM121_SAFE_AUTOTUNE=${MAMBA_SM121_SAFE_AUTOTUNE:-1}
    # Prefer measured Falcon-H1 GB10 configs in the local mamba fork. Set to 0
    # to restore full Triton autotune for A/B runs.
    - MAMBA_SM121_STATIC_CONFIGS=${MAMBA_SM121_STATIC_CONFIGS:-1}
    # BgKIT-owned Falcon-H1 training fast path in the local mamba fork. Skips
    # generic stride guards and pins the teacher-forced Mamba2 contract.
    - MAMBA_FALCON_SM121_FASTPATH=${MAMBA_FALCON_SM121_FASTPATH:-1}
    # Falcon-H1 Tiny trainable decoder defaults. These are the measured-fast
    # real-training settings from the Falcon L0 optimization pass: keep the
    # patch active, use packed QKV and packed gate/up MLP params, use the
    # BgKIT-owned trainable MLP/Mamba backward boundaries, save the Mamba
    # intermediates that avoid slower recompute, and keep rejected attention /
    # wider layer-loop probes off unless an explicit A/B run overrides them.
    - BGKIT_FALCON_H1_PATCH=${BGKIT_FALCON_H1_PATCH:-1}
    - BGKIT_FALCON_H1_PACKED_MAMBA_SEQIDX=${BGKIT_FALCON_H1_PACKED_MAMBA_SEQIDX:-1}
    - BGKIT_FALCON_H1_PACKED_QKV=${BGKIT_FALCON_H1_PACKED_QKV:-1}
    - BGKIT_FALCON_H1_ATTENTION_CAT_QKV=${BGKIT_FALCON_H1_ATTENTION_CAT_QKV:-0}
    - BGKIT_FALCON_H1_DIRECT_FLASH_ATTN=${BGKIT_FALCON_H1_DIRECT_FLASH_ATTN:-0}
    - BGKIT_FALCON_H1_DIRECT_FA4_ATTN=${BGKIT_FALCON_H1_DIRECT_FA4_ATTN:-0}
    - BGKIT_FALCON_H1_DIRECT_HF_FLASH_ATTN=${BGKIT_FALCON_H1_DIRECT_HF_FLASH_ATTN:-0}
    - BGKIT_FALCON_H1_DIRECT_SDPA=${BGKIT_FALCON_H1_DIRECT_SDPA:-0}
    - BGKIT_FALCON_H1_PACKED_MLP=${BGKIT_FALCON_H1_PACKED_MLP:-1}
    - BGKIT_FALCON_H1_MLP_CAT_GATE_UP=${BGKIT_FALCON_H1_MLP_CAT_GATE_UP:-0}
    - BGKIT_FALCON_H1_TRAINABLE_MLP_AUTOGRAD=${BGKIT_FALCON_H1_TRAINABLE_MLP_AUTOGRAD:-1}
    - BGKIT_FALCON_H1_SPECIALIZED_MAMBA=${BGKIT_FALCON_H1_SPECIALIZED_MAMBA:-1}
    - BGKIT_FALCON_H1_MAMBA_INPROJ_AUTOGRAD=${BGKIT_FALCON_H1_MAMBA_INPROJ_AUTOGRAD:-1}
    - BGKIT_FALCON_H1_MAMBA_SAVE_OUT=${BGKIT_FALCON_H1_MAMBA_SAVE_OUT:-1}
    - BGKIT_FALCON_H1_MAMBA_SAVE_CONV=${BGKIT_FALCON_H1_MAMBA_SAVE_CONV:-1}
    - BGKIT_FALCON_H1_MAMBA_SAVE_SCAN=${BGKIT_FALCON_H1_MAMBA_SAVE_SCAN:-1}
    - BGKIT_FALCON_H1_MAMBA_SCAN_CHECKPOINT=${BGKIT_FALCON_H1_MAMBA_SCAN_CHECKPOINT:-0}
    - BGKIT_FALCON_H1_MAMBA_SKIP_D_IN_DX_KERNEL=${BGKIT_FALCON_H1_MAMBA_SKIP_D_IN_DX_KERNEL:-1}
    - BGKIT_FALCON_H1_FUSED_INPUT_PROJ=${BGKIT_FALCON_H1_FUSED_INPUT_PROJ:-0}
    - BGKIT_FALCON_H1_FUSED_LAYER_LOOP=${BGKIT_FALCON_H1_FUSED_LAYER_LOOP:-0}
    # PYTHONPATH override: prepend local kernel forks so ad-hoc Docker runs
    # exercise the same in-situ code we are tuning. The mamba fork is first
    # because Falcon-H1 imports pure-Python/Triton mamba_ssm ops from there;
    # causal-conv1d remains the binary wheel from the image. Must include the
    # Dockerfile's existing entries because compose `environment` replaces,
    # not augments, the image ENV. Entrypoint may further prepend the FA native
    # cache repo.
    - PYTHONPATH=/workspace/mamba-falcon-sm121:/workspace/flashqla:/workspace/fla:/workspace/flash-attention:/workspace/bgkit/src:/usr/local/lib/python3.12/dist-packages/nvidia_cutlass_dsl/python_packages
    # Last-resort host-memory guard, armed in EVERY python process by
    # src/sitecustomize.py: exit 137 when MemAvailable stays under this many GB.
    # CUDA allocations on unified memory are not counted by mem_limit; an
    # unguarded probe took the host into a swap loop on 2026-09-17.
    - BGKIT_HOST_MEM_GUARD_GB=${BGKIT_HOST_MEM_GUARD_GB:-10}
    # Triton kernel dump (off by default; opt-in via host env to capture
    # PTX/SASS for TMA / cp.async.bulk verification on Blackwell sm_121).
    # See plans/ for the perf investigation context.
    - TRITON_KERNEL_DUMP=${TRITON_KERNEL_DUMP:-0}
    - TRITON_DUMP_DIR=${TRITON_DUMP_DIR:-/workspace/.cache/triton-dump}
    # Unified memory tuning for DGX Spark's single 128 GB pool:
    #   - expandable_segments:True  — grow allocations incrementally instead
    #     of pre-reserving huge contiguous blocks (otherwise PyTorch would
    #     push other processes into swap on shared memory).
    #   - garbage_collection_threshold:0.8  — return freed memory to OS
    #     when the caching allocator exceeds 80% of reservations, rather
    #     than hoarding it. Critical on unified memory where hoarded CUDA
    #     blocks directly reduce system RAM for the CPU.
    #   - max_split_size_mb:512  — cap the largest split the allocator
    #     will hand back to a single alloc request. Limits fragmentation
    #     from mixed-size allocations (variable batch shapes in our case).
    # Added 2026-04-18 after Step 3 stalled at step 2351 with 119 GB of
    # unified memory consumed (~45 MB/step accumulated) — likely a mix of
    # genuine leaks and allocator fragmentation on the variable-shape
    # batches from TokenBudgetBatchSampler.
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,garbage_collection_threshold:0.8,max_split_size_mb:512
    # sm_121 stream-capture interaction: load_binary on a new kernel variant
    # inside a captured stream throws CUDA error 800 ("operation not permitted
    # when stream is capturing"). Disable inductor CUDA graphs to prevent
    # captures from being active when fla compiles new kernel variants.
    - TORCHINDUCTOR_DISABLE_CUDAGRAPHS=1
    - TORCH_COMPILE_DISABLE=1
    # TMA on sm_121: re-disabled 2026-06-07. It was re-enabled 2026-04-21
    # for the Blackwell bulk-async speedup on DeltaNet (3 of 4 Qwen3.5
    # layers), but it is the documented trigger the comment warned about:
    # phase1_summarization_round_robin crash-looped because the FLA
    # Gated-DeltaNet forward kernel (chunk_gated_delta_rule_fwd_kernel_h_
    # blockdim64) DEADLOCKS on its first launch after the CUDA caching
    # allocator is flushed (empty_cache at a checkpoint/eval boundary) —
    # 6 of 7 watchdog hard-exits, ~every 6 h. The step watchdog catches it
    # at 300 s and restarts, so it limped forward but lost ~8 min/cycle and
    # left wandb looking dead. TMA-off removes the deadlock surface; the
    # global_scratch allocator (the NullAllocator-deadlock fix, see the
    # fla mount comment below) stays registered with TMA off, so we keep
    # that protection. Perf cost: loses the bulk-async DeltaNet transfer
    # speedup. Re-enable to A/B once the FLA fork handles empty_cache +
    # TMA descriptors safely on sm_121. See docs/fla_fork_review_2026_04_21.md
    # and the 2026-06-07 checkpoint-boundary hang diagnosis.
    - FLA_USE_TMA=0
    # Build FlashAttention's native CUDA backend inside the container when the
    # mounted host checkout doesn't provide a container-compatible binary.
    - BGKIT_BOOTSTRAP_FLASH_ATTN_NATIVE=1
    # BGKIT_ALLOW_PEER_CUDA is deliberately NOT a template default. Unified
    # memory on DGX Spark is shared CPU+GPU (128 GB total); two GPU jobs
    # racing for CUDA can OOM the host without warning. The startup guard
    # refuses to start when peer CUDA usage would push us past the host
    # safety ceiling — enable ``BGKIT_ALLOW_PEER_CUDA=1`` per-invocation
    # (e.g. via shell env or .env) only when you've deliberately chosen to
    # coexist with another GPU job and accept the auto-shrunk fraction.
    # Default 0 (refuse). Same pattern for BGKIT_CUDA_MEM_FRACTION (0.65).
    - BGKIT_ALLOW_PEER_CUDA=${BGKIT_ALLOW_PEER_CUDA:-0}
    - BGKIT_CUDA_MEM_FRACTION=${BGKIT_CUDA_MEM_FRACTION:-0.65}
    # FA4 SM12x extension toggle. Default unset = entrypoint's auto-build
    # logic decides (set to 1 if extension imports cleanly). Override via
    # shell env to 0 to disable (e.g. when the extension's reshape logic
    # mishandles unusual head/kv-head configs in projection_block).
    - FLASH_ATTENTION_SM12X_USE_EXTENSION=${FLASH_ATTENTION_SM12X_USE_EXTENSION:-}
    # Optional Luce Qwen3.5 megakernel bootstrap. Default off because the CUDA
    # extension is experimental for BgKIT and expensive to build; enable for
    # smoke/benchmark runs with BGKIT_BOOTSTRAP_LUCE_MEGAKERNEL=1.
    - BGKIT_BOOTSTRAP_LUCE_MEGAKERNEL=${BGKIT_BOOTSTRAP_LUCE_MEGAKERNEL:-0}
    # FA4 fork rebuild parallelism. entrypoint.sh sets MAX_JOBS=2 inline,
    # but ninja can ignore that under some pip versions and default to
    # nproc — `flash_bwd_hdim*_bf16_sm80.cu` jobs are ~3-5 GB RSS each, so
    # 16 parallel nvccs SIGKILLs on a 115 GB cap. Force here to override.
    - MAX_JOBS=${MAX_JOBS:-2}
    - NVCC_THREADS=${NVCC_THREADS:-1}
    # Step watchdog timeout (seconds). 60s is too tight for first-step JIT
    # compile + autotune after a restart AND for trainers running with
    # ``num_workers=0`` on /mnt/external (spinning disk) where cold mmap
    # page faults on first batches take tens of seconds. 300s still
    # catches real hangs while leaving room for warm-up I/O.
    - BGKIT_STEP_TIMEOUT=${BGKIT_STEP_TIMEOUT:-300.0}
  # DataLoader workers (num_workers > 0) exchange tensors with the main
  # process via shared memory. Docker's default 64 MB /dev/shm fills
  # quickly when batches are large (cached dense_seed batches are ~10 MB
  # of bf16 embeddings each), producing "Resource temporarily unavailable"
  # errors. 8 GB is plenty for any current training service.
  shm_size: "8gb"
  volumes:
    - ${DATA_DIR}:/workspace/data
    # NVMe overlay for FineWeb-Edu hot data (tokens + Falcon companion).
    # The HDD copy in ${DATA_DIR}/fineweb_edu_v1 is the canonical version;
    # this bind mount overlays the tokens/ + tokens_falcon_h1/ subpaths
    # with NVMe-resident copies so dataloader workers don't bottleneck on
    # the spinning disk (~30 MB/s, 165ms IO wait → 0% GPU utilization).
    # Migrated 2026-05-23 when forced_adapt was running at 26.5 s/step on
    # HDD; expected ~3-5 s/step on NVMe.
    - /home/werg/bgkit-data-nvme/fineweb_edu_v1/tokens:/workspace/data/fineweb_edu_v1/tokens
    - /home/werg/bgkit-data-nvme/fineweb_edu_v1/tokens_falcon_h1:/workspace/data/fineweb_edu_v1/tokens_falcon_h1
    # Commit-encoding datasets for Qwen3.5 Steps 4.7 / 5 / 6 (small,
    # ~5.3 GB total). FineWeb-Edu has no commit analog so these stay on
    # the code corpus; NVMe overlay just avoids HDD bottleneck when
    # those stages run.
    - /home/werg/bgkit-data-nvme/processed/commit_encoding:/workspace/data/processed/commit_encoding
    - /home/werg/bgkit-data-nvme/processed/commit_reproduction:/workspace/data/processed/commit_reproduction
    - /home/werg/bgkit-data-nvme/mmap/descriptions:/workspace/data/mmap/descriptions
    # Summarization corpora (multi_news + arxiv) NVMe overlay (2026-06-08).
    # phase1_summarization_round_robin streams these every step with
    # num_workers; on the HDD they bottlenecked the ~37 s/step shared base and
    # contended with the 15 GB checkpoint writes. Canonical copy stays on the
    # HDD ${DATA_DIR}; these overlay only the training subpaths.
    - /home/werg/bgkit-data-nvme/multi_news_v1/processed_qwen_target:/workspace/data/multi_news_v1/processed_qwen_target
    - /home/werg/bgkit-data-nvme/multi_news_v1/processed:/workspace/data/multi_news_v1/processed
    - /home/werg/bgkit-data-nvme/arxiv_v1/processed_qwen_target:/workspace/data/arxiv_v1/processed_qwen_target
    - /home/werg/bgkit-data-nvme/arxiv_v1/processed:/workspace/data/arxiv_v1/processed
    # git_commit_repro recursive-L1 full-backprop hot data NVMe overlay (2026-06-30):
    # the 23 GB paged .arrow + 3.1 GB token store random-paging off the HDD
    # (sda 99% util, ~19 MB/s, GPU starved ~54%) — canonical copies stay on the HDD.
    # (the git_commit_repro.arrow overlay was removed 2026-09-20 with the Phase-2 trajectory data;
    #  a bind mount whose source file is gone makes Docker create a root-owned directory in its place)
    - /home/werg/bgkit-data-nvme/mmap/phase2/git_commit_repro:/workspace/data/mmap/phase2/git_commit_repro
    - /home/werg/bgkit-data-nvme/browse_trees/git_commit_repro.parquet:/workspace/data/browse_trees/git_commit_repro.parquet
    - ${HF_HOME:-~/.cache/huggingface}:/workspace/hf_cache
    - ${CHECKPOINT_DIR}:/workspace/checkpoints
    # NVMe fast-checkpoint staging (host NVMe). Recent checkpoints land here
    # first for fast saves; a background daemon archives them to the HDD
    # (${CHECKPOINT_DIR}) and keeps only the last few here.
    - /home/werg/bgkit-ckpt-fast:/workspace/checkpoints_fast
    # Capability-packaging staging (benchmarks, trajectory corpora, LogHub,
    # base-checkpoint copy) on NVMe — read-only for evals/baselines.
    - /home/werg/bgkit-data-nvme/capability_packaging:/workspace/capability_packaging:ro
    # bgkit2 reset lineage (2026-09-03): LFM2.5 token stores + eval reports.
    - /home/werg/bgkit-data-nvme/bgkit2:/workspace/bgkit2_data
    # Source code — the ONLY way bgkit code enters the container.
    # Image has deps only; no bgkit in dist-packages.
    - ../src:/workspace/bgkit/src:ro
    - ../configs:/workspace/bgkit/configs:ro
    - ../scripts:/workspace/bgkit/scripts:ro
    # Local FlashAttention checkout: mounted read-only and preferred via PYTHONPATH.
    - ../../flash-attention:/workspace/flash-attention:ro
    # Local mamba-ssm fork overlay for Falcon-H1 kernel work. The image still
    # installs mamba-ssm for package metadata and any compiled optional pieces,
    # but Python/Triton sources resolve from this checkout first.
    - ../../mamba-falcon-sm121:/workspace/mamba-falcon-sm121:ro
    # Local flash-linear-attention fork (branch blackwell-sm121-compat):
    # broadens IS_NVIDIA_BLACKWELL gate to capability >= 10 (covers sm_121
    # / DGX Spark) and registers the global_scratch allocator on Blackwell
    # even when FLA_USE_TMA=0, preventing NullAllocator deadlocks on
    # autotuned DeltaNet kernels (3 of 4 Qwen3.5 layers). Cherry-picked
    # from upstream 8b05e2f. Pure-Python — preferred via PYTHONPATH below
    # so it shadows the pip-installed fla 0.4.2 in dist-packages.
    - ../../flash-linear-attention:/workspace/fla:ro
    # Local FlashQLA checkout (QwenLM/FlashQLA):
    # default GDN backend. Mounted read-only for normal runs; kernels are
    # JIT-compiled by TileLang from the training image.
    - ../../FlashQLA:/workspace/flashqla:ro
    # Local Luce megakernel checkout (Luce-Org/lucebox-hub/megakernel):
    # experimental Qwen3.5-0.8B B=1 inference backend. entrypoint.sh copies
    # this read-only mount into a writable checkpoint cache before building.
    - ../../lucebox-hub/megakernel:/workspace/luce_megakernel:ro
    # Wandb authenticates via netrc (machine api.wandb.ai).
    - ~/.netrc:/workspace/.netrc:ro
    # Persist torch.compile (inductor) and Triton kernel caches across restarts
    - bgkit-compile-cache:/workspace/.cache/torchinductor
    - bgkit-triton-cache:/workspace/.triton
    - bgkit-tilelang-cache:/workspace/.cache/tilelang
    - bgkit-tvm-cache:/workspace/.cache/tvm

x-llama-common: &llama-common
  build:
    context: ..
    dockerfile: docker/Dockerfile.llama
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  restart: unless-stopped
  volumes:
    - ${DATA_DIR}/models:/models:ro
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 120s

x-vllm-common: &vllm-common
  ipc: host
  shm_size: "64gb"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  restart: unless-stopped
  volumes:
    - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
    interval: 10s
    timeout: 5s
    retries: 60
    start_period: 300s

services:
  train:
    <<: *gpu-common
    command: ["scripts/train.py"]

  train-joint-block:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=joint_block_pretrain"]

  train-phase1-step1:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step1"]

  train-phase1-step2:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step2"]

  train-phase1-step3:
    <<: *gpu-common
    # Auto-resume to the latest on-disk Step 3 checkpoint via the
    # registry. Compromised pre-2026-04-22 Step 3 checkpoints (trained
    # under a bidirectional decoder due to the FA4 is_causal default
    # bug) are archived under compromised_fa4_causal_bug/ so auto-resume
    # only sees the post-fix step_500+ saves.
    command: ["scripts/train.py", "+experiment=phase1_step3"]

  train-phase1-step4:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step4"]

  # Offline ICE → head_base_l0 distillation. Writes a sidecar checkpoint
  # to $CHECKPOINT_DIR/survivorship_head_base_l0_<ts>/head_base_l0.pt
  # which phase1_step4.yaml references via survivorship_head_sidecar.
  pretrain-survivorship-head:
    <<: *gpu-common
    command: [
      "scripts/pretrain_survivorship_head.py",
      "--step2-checkpoint", "/workspace/checkpoints/phase1_step2_step19500_20260323_113116",
      "--ice-checkpoint", "/workspace/checkpoints/ice_step89999_20260306_213825",
      "--data-dir", "/workspace/data/mmap/structural",
      "--output-dir", "/workspace/checkpoints",
      "--teacher-ratio", "0.10",
      "--max-steps", "3000",
      "--max-batch-tokens", "16384",
      "--lr", "1e-3",
      "--num-workers", "2",
    ]

  train-phase1-step5:
    <<: *gpu-common
    # Bumped 100g -> 115g on 2026-05-07 after long-tail OOM with
    # gradient_checkpointing=false. Leaves ~13g for the host OS + Claude
    # Code harness on 128 GB unified memory; still bounded so a runaway
    # CUDA alloc gets container-OOM'd rather than host-OOM-killing the
    # harness.
    mem_limit: 115g
    memswap_limit: 115g
    command: ["scripts/train.py", "+experiment=phase1_step5"]

  # Phase 1 Step 4.7: bridge distillation. Teacher = frozen Step 4 L0-only
  # encoder; student = full L0->L1 with bridge + last L0 block + first 2 L1
  # blocks + projection_block trainable. See plans/bridge-distill-step.md.
  # The default `BGKIT_GDN_BACKEND=fla` from gpu-common uses the optimized
  # local FLA path on sm_121. Export `BGKIT_GDN_BACKEND=flashqla` in the
  # shell before `docker compose up` only when testing the FlashQLA backend.
  train-phase1-step4p7:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step4p7"]

  # Phase 1 Step 4.7-v2: bridge re-distillation with extended ratio range.
  # Teacher = original phase1_step4p7 (good projection on L0-only path);
  # student = current phase1_step5 latest (preserves decoder LoRA, heads,
  # most backbone training). Used to extend the bridge's training
  # distribution to L0 ratio ~0.20 so Step 5 can operate at tighter
  # compression without the bridge going OOD. Same image + 100g cap as
  # Step 5 (decoder LoRA forward through projection_block needs the
  # extra headroom).
  train-phase1-step4p7-v2:
    <<: *gpu-common
    mem_limit: 100g
    memswap_limit: 100g
    command: ["scripts/train.py", "+experiment=phase1_step4p7_v2"]

  # Phase 1 Step 4.7-v3: extends v2's bridge training to teacher_ratio=0.10
  # (v2 used 0.20). Teacher and student both load from v2's output;
  # student trains its bridge + last L0 block + first 2 L1 blocks +
  # projection_block to handle the new tighter ratio range. Together
  # v2+v3 give the bridge full coverage of Step 5's operating range.
  train-phase1-step4p7-v3:
    <<: *gpu-common
    mem_limit: 100g
    memswap_limit: 100g
    command: ["scripts/train.py", "+experiment=phase1_step4p7_v3"]

  train-phase1-step6:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step6", "++training.reset_wandb=true"]

  # One-time pre-compute of encoder.l0 survivor embeddings for the dense_seed
  # phase. Runs the frozen encoder forward across a subsample of chunks (default
  # 30K, override with --max-chunks N) and writes a static cache to
  # ${DATA_DIR}/processed/falcon_dense_seed_cache/. The downstream
  # train-falcon-dense-seed service consumes this cache and runs projection-only
  # training (no encoder forward in the loop), ~50x faster than the live
  # encoder path. Restart policy is ``no`` because cache build is a one-shot.
  build-falcon-dense-seed-cache:
    <<: *gpu-common
    restart: "no"
    command: ["scripts/build_dense_seed_cache.py"]

  train-falcon-dense-seed:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_falcon_dense_seed"]

  train-falcon-forced-adapt:
    <<: *gpu-common
    # NOTE: do NOT add `environment:` block here — it would shadow
    # gpu-common's entire env (wandb creds, triton cache paths, etc).
    # Override BGKIT_CUDA_MEM_FRACTION via shell env when launching
    # (gpu-common already reads it: `${BGKIT_CUDA_MEM_FRACTION:-0.65}`).
    # FineWeb-Edu forced_adapt benefits from 0.80 + max_batch_tokens=2048
    # + max_sample_length=768.
    command: ["scripts/train.py", "+experiment=phase1_falcon_forced_adapt"]

  # Phase C: end-to-end alignment at no compression. Encoder.l0 + projection
  # + decoder all train; target_ratio=1.0 holds compression off so the
  # decoder learns to reconstruct from the uncompressed projection output
  # before any compression curriculum kicks in.
  train-falcon-l0-align:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_falcon_l0_align"]

  train-falcon-l0:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_falcon_l0"]

  train-falcon-l1:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_falcon_l1"]

  # Qwen3.5-0.8B realignment stage: catches the Qwen decoder up to the
  # encoder state after a long Falcon-only training stretch. Resumes
  # encoder + projection from the latest phase1_falcon_l0 checkpoint;
  # Qwen decoder loads pristine from HF.
  train-qwen-realign:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_qwen_realign"]

  # Diagnostic: same realign trainer + warmstart, OLD data (processed/tokens).
  # If this lands at low loss → realign's plateau is data-shift driven; if
  # also high → trainer itself is broken. See configs/experiment/phase1_qwen_realign_olddata.yaml
  train-qwen-realign-olddata:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_qwen_realign_olddata"]

  # Diagnostic: ORIGINAL Step 6 trainer/config + Step 6 ckpt + NEW FineWeb
  # data. Reveals data-shift cost vs encoder-pairing cost.
  train-step6-diagnostic-fineweb:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step6_diagnostic_fineweb"]

  # Final diagnostic: Step 6 trainer + Step 6 ckpt + OLD processed/tokens.
  # Should reproduce ~0.85 baseline, proving ckpt+trainer aren't broken
  # and the realign plateau on FineWeb is purely data-shift cost.
  train-step6-diagnostic-olddata:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step6_diagnostic_olddata"]

  # Decisive: realign trainer + Step 6's PAIRED encoder+decoder (no
  # warmstart merge) + processed_v2 data. Tests whether the realign
  # plateau at 4.40 is caused by the warmstart's broken encoder/decoder
  # pairing — should descend fast toward Step 6's baseline if so.
  train-qwen-realign-paired-baseline:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_qwen_realign_paired_baseline"]

  train-qwen-projection-warmup:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_qwen_projection_warmup"]

  # Round-robin Qwen+Falcon decoder summarization training.
  # Both decoders loaded simultaneously; encoder + both projection_blocks
  # + both decoders co-evolve under per-microbatch decoder routing.
  # Override gpu-common's 80g mem_limit to 115g — two decoders + two-level
  # encoder + Muon optimizer state pushes past 80g even at small batches.
  # ALSO set BGKIT_CUDA_MEM_FRACTION=0.85 in your shell env (or .env)
  # before launching this service — the gpu-common template defaults to
  # 0.65 (== ~79 GB cap on 121 GB Spark) which is too low here.
  train-summarization-round-robin:
    <<: *gpu-common
    # 111g (was 115g): reserve ~10g of the 121g unified pool for the host so a
    # container memory spike triggers cgroup-local reclaim of its own ~26g of
    # reclaimable mmap page cache instead of a GLOBAL oom that kills user-session
    # processes incl. the Claude harness (2026-06-09). The genuine training
    # working set is only ~45g (16g CPU anon + 29g GPU); the trimmed 4g is
    # reclaimable dataset page cache, so this costs ~0 training perf. NOTE: GPU
    # allocations are only partially cgroup-charged, so this is partial
    # protection — do NOT run a second GPU job in this container concurrently.
    mem_limit: 111g
    memswap_limit: 111g
    # pin_memory=false: page-locked dataloader buffers can't be served from the
    # ~49g reclaimable page cache, so they need truly-free RAM (~9g) and trigger
    # global OOMs that killed the shell/Claude session (memory.events oom_kill,
    # 2026-06-08). Plain pageable buffers let the kernel manage them against the
    # cache. num_workers stays 6 (NVMe throughput); the pin was the culprit.
    command: ["scripts/train.py", "+experiment=phase1_summarization_round_robin", "++compute.num_workers=6", "++compute.pin_memory=false"]

  # Docker-native Falcon-H1 kernel harness. This is the reusable check for
  # mamba-ssm fork overlays and attention fallback guards; override args by
  # passing the script path plus flags to `docker compose run --rm ...`.
  benchmark-falcon-h1-kernels:
    <<: *gpu-common
    restart: "no"
    command:
