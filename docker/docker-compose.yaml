x-gpu-common: &gpu-common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  # Run as host user so files written to bind mounts (checkpoints, HF cache)
  # are owned by the host user, not root.
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  environment:
    - HOME=/workspace
    - HYDRA_FULL_ERROR=1
    # Triton autotuner crash on sm_121 is handled by bgkit.utils.triton_patch
    # Persist torch.compile cache across container restarts
    - TORCHINDUCTOR_CACHE_DIR=/workspace/.cache/torchinductor
    # Unified memory: allocate incrementally instead of large upfront chunks.
    # Without this, PyTorch pre-allocates huge contiguous blocks that push
    # other processes into swap on the DGX Spark's shared 128 GB pool.
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    # sm_121 stream-capture interaction: load_binary on a new kernel variant
    # inside a captured stream throws CUDA error 800 ("operation not permitted
    # when stream is capturing"). Disable inductor CUDA graphs to prevent
    # captures from being active when fla compiles new kernel variants.
    - TORCHINDUCTOR_DISABLE_CUDAGRAPHS=1
    - TORCH_COMPILE_DISABLE=1
    # TMA broken on sm_121 in fla; explicit disable as defensive measure
    - FLA_USE_TMA=0
  volumes:
    - ${DATA_DIR}:/workspace/data
    - ${HF_HOME:-~/.cache/huggingface}:/workspace/hf_cache
    - ${CHECKPOINT_DIR}:/workspace/checkpoints
    # Source code — the ONLY way bgkit code enters the container.
    # Image has deps only; no bgkit in dist-packages.
    - ../src:/workspace/bgkit/src:ro
    - ../configs:/workspace/bgkit/configs:ro
    - ../scripts:/workspace/bgkit/scripts:ro
    # Local FlashAttention checkout: mounted read-only and preferred via PYTHONPATH.
    - ../../flash-attention:/workspace/flash-attention:ro
    # Wandb authenticates via netrc (machine api.wandb.ai).
    - ~/.netrc:/workspace/.netrc:ro
    # Persist torch.compile (inductor) and Triton kernel caches across restarts
    - bgkit-compile-cache:/workspace/.cache/torchinductor
    - bgkit-triton-cache:/workspace/.triton

x-llama-common: &llama-common
  build:
    context: ..
    dockerfile: docker/Dockerfile.llama
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  restart: unless-stopped
  volumes:
    - ${DATA_DIR}/models:/models:ro
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 120s

x-vllm-common: &vllm-common
  ipc: host
  shm_size: "64gb"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  restart: unless-stopped
  volumes:
    - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
    interval: 10s
    timeout: 5s
    retries: 60
    start_period: 300s

services:
  train:
    <<: *gpu-common
    command: ["scripts/train.py"]

  train-joint-block:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=joint_block_pretrain"]

  train-phase1-step1:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step1"]

  train-phase1-step2:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step2"]

  train-phase1-step3:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step3"]

  # Offline ICE → head_base_l0 distillation. Writes a sidecar checkpoint
  # to $CHECKPOINT_DIR/survivorship_head_base_l0_<ts>/head_base_l0.pt
  # which phase1_step3.yaml references via survivorship_head_sidecar.
  pretrain-survivorship-head:
    <<: *gpu-common
    command: [
      "scripts/pretrain_survivorship_head.py",
      "--step2-checkpoint", "/workspace/checkpoints/phase1_step2_step19500_20260323_113116",
      "--ice-checkpoint", "/workspace/checkpoints/ice_step89999_20260306_213825",
      "--data-dir", "/workspace/data/mmap/structural",
      "--output-dir", "/workspace/checkpoints",
      "--teacher-ratio", "0.10",
      "--max-steps", "3000",
      "--max-batch-tokens", "16384",
      "--lr", "1e-3",
      "--num-workers", "2",
    ]

  train-phase1-step4:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step4"]

  train-phase1-step5:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step5", "++training.reset_wandb=true"]

  train-phase2-kb-stage-a:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase2_kb_stage_a"]

  train-phase2-kb-stage-b:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase2_kb_stage_b"]

  preprocess:
    build:
      context: ..
      dockerfile: docker/Dockerfile.data
    volumes:
      - ${DATA_DIR}:/workspace/data
    command: ["scripts/process_repos.py"]

  llama-large:
    <<: *llama-common
    ports:
      - "${LLAMA_PORT_LARGE:-8080}:8080"
    command: >-
      --model /models/${LLAMA_MODEL_LARGE:-LFM2-8B-A1B-Q4_K_M.gguf}
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLAMA_CTX_LARGE:-32768}
      --n-gpu-layers 999
      --parallel ${LLAMA_PARALLEL_LARGE:-2}
      --flash-attn on --no-mmap --jinja

  llama-small:
    <<: *llama-common
    ports:
      - "${LLAMA_PORT_SMALL:-8081}:8080"
    command: >-
      --model /models/${LLAMA_MODEL_SMALL:-LFM2.5-1.2B-Instruct-Q8_0.gguf}
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLAMA_CTX_SMALL:-65536}
      --n-gpu-layers 999
      --parallel ${LLAMA_PARALLEL_SMALL:-2}
      --flash-attn on --no-mmap --jinja

  llama-tiny:
    <<: *llama-common
    ports:
      - "${LLAMA_PORT_TINY:-8082}:8080"
    command: >-
      --model /models/${LLAMA_MODEL_TINY:-Qwen3-0.6B-Q8_0.gguf}
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLAMA_CTX_TINY:-65536}
      --n-gpu-layers 999
      --parallel ${LLAMA_PARALLEL_TINY:-8}
      --flash-attn on --no-mmap --jinja

  # --- vLLM inference (primary + fast) ---

  vllm-primary:
    <<: *vllm-common
    image: "${VLLM_IMAGE_PRIMARY:-vllm-mxfp4-spark:latest}"
    ports:
      - "${VLLM_PORT_PRIMARY:-8090}:8000"
    environment:
      NVIDIA_DISABLE_REQUIRE: "1"
      TIKTOKEN_ENCODINGS_BASE: /workspace/vllm/tiktoken_encodings
      VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: "1"
    command: >-
      vllm serve ${VLLM_MODEL_PRIMARY:-openai/gpt-oss-20b}
      --quantization mxfp4
      --mxfp4-backend CUTLASS
      --mxfp4-layers moe,qkv,o,lm_head
      --gpu-memory-utilization ${VLLM_GPU_UTIL_PRIMARY:-0.45}
      --max-model-len 32768
      --enable-prefix-caching
      --max-num-batched-tokens 8192
      --kv-cache-dtype fp8
      --attention-backend FLASHINFER
      --load-format fastsafetensors
      --enforce-eager

  vllm-fast:
    <<: *vllm-common
    image: "${VLLM_IMAGE_FAST:-vllm-node:latest}"
    ports:
      - "${VLLM_PORT_FAST:-8091}:8000"
    environment:
      NVIDIA_DISABLE_REQUIRE: "1"
    command: >-
      vllm serve ${VLLM_MODEL_FAST:-Qwen/Qwen3.5-0.8B}
      --gpu-memory-utilization ${VLLM_GPU_UTIL_FAST:-0.10}
      --max-model-len 32768
      --enable-prefix-caching
      --enable-chunked-prefill

volumes:
  bgkit-compile-cache:
  bgkit-triton-cache:
