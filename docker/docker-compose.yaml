x-gpu-common: &gpu-common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  # Run as host user so files written to bind mounts (checkpoints, HF cache)
  # are owned by the host user, not root.
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  environment:
    - HOME=/workspace
    - HYDRA_FULL_ERROR=1
    # Triton autotuner crash on sm_121 is handled by bgkit.utils.triton_patch
    # Persist torch.compile cache across container restarts
    - TORCHINDUCTOR_CACHE_DIR=/workspace/.cache/torchinductor
    # Unified memory tuning for DGX Spark's single 128 GB pool:
    #   - expandable_segments:True  — grow allocations incrementally instead
    #     of pre-reserving huge contiguous blocks (otherwise PyTorch would
    #     push other processes into swap on shared memory).
    #   - garbage_collection_threshold:0.8  — return freed memory to OS
    #     when the caching allocator exceeds 80% of reservations, rather
    #     than hoarding it. Critical on unified memory where hoarded CUDA
    #     blocks directly reduce system RAM for the CPU.
    #   - max_split_size_mb:512  — cap the largest split the allocator
    #     will hand back to a single alloc request. Limits fragmentation
    #     from mixed-size allocations (variable batch shapes in our case).
    # Added 2026-04-18 after Step 3 stalled at step 2351 with 119 GB of
    # unified memory consumed (~45 MB/step accumulated) — likely a mix of
    # genuine leaks and allocator fragmentation on the variable-shape
    # batches from TokenBudgetBatchSampler.
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,garbage_collection_threshold:0.8,max_split_size_mb:512
    # sm_121 stream-capture interaction: load_binary on a new kernel variant
    # inside a captured stream throws CUDA error 800 ("operation not permitted
    # when stream is capturing"). Disable inductor CUDA graphs to prevent
    # captures from being active when fla compiles new kernel variants.
    - TORCHINDUCTOR_DISABLE_CUDAGRAPHS=1
    - TORCH_COMPILE_DISABLE=1
    # TMA broken on sm_121 in fla; explicit disable as defensive measure
    - FLA_USE_TMA=0
  volumes:
    - ${DATA_DIR}:/workspace/data
    - ${HF_HOME:-~/.cache/huggingface}:/workspace/hf_cache
    - ${CHECKPOINT_DIR}:/workspace/checkpoints
    # Source code — the ONLY way bgkit code enters the container.
    # Image has deps only; no bgkit in dist-packages.
    - ../src:/workspace/bgkit/src:ro
    - ../configs:/workspace/bgkit/configs:ro
    - ../scripts:/workspace/bgkit/scripts:ro
    # Local FlashAttention checkout: mounted read-only and preferred via PYTHONPATH.
    - ../../flash-attention:/workspace/flash-attention:ro
    # Wandb authenticates via netrc (machine api.wandb.ai).
    - ~/.netrc:/workspace/.netrc:ro
    # Persist torch.compile (inductor) and Triton kernel caches across restarts
    - bgkit-compile-cache:/workspace/.cache/torchinductor
    - bgkit-triton-cache:/workspace/.triton

x-llama-common: &llama-common
  build:
    context: ..
    dockerfile: docker/Dockerfile.llama
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  restart: unless-stopped
  volumes:
    - ${DATA_DIR}/models:/models:ro
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 120s

x-vllm-common: &vllm-common
  ipc: host
  shm_size: "64gb"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  restart: unless-stopped
  volumes:
    - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
    interval: 10s
    timeout: 5s
    retries: 60
    start_period: 300s

services:
  train:
    <<: *gpu-common
    command: ["scripts/train.py"]

  train-joint-block:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=joint_block_pretrain"]

  train-phase1-step1:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step1"]

  train-phase1-step2:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step2"]

  train-phase1-step3:
    <<: *gpu-common
    # FA4 TEMPORARILY DISABLED (2026-04-18): varlen fwd→bwd→fwd on sm_121 crashes
    # with cudaErrorIllegalAddress on the 2nd forward after a backward. Minimal
    # repro: single Qwen3_5 full_attn layer loaded from phase1_step2p5 weights,
    # called 2× with loss.backward() between — "bwd 1 OK, bwd 2 CRASH". Works
    # fine with fresh HF weights (5-layer chain probe 10 FA4 calls pass),
    # works fine with no backward between calls (7 kept-graph forwards pass).
    # Diagnosis deferred; running on SDPA which was the (silent) impl used for
    # Step 2.5 and is numerically equivalent within bf16 tolerance.
    #
    # max_batch_tokens lowered 32768 → 24576 (-25%) on 2026-04-18 alongside the
    # allocator tuning in gpu-common. Paired with the new memory diagnostics
    # logging (mem/* metrics every 50 steps) so we can separate allocator
    # fragmentation (sawtooth) from a real leak (linear slope) in the growth
    # curve. Revert once fragmentation root cause is understood.
    command: [
      "scripts/train.py",
      "+experiment=phase1_step3",
      "++compute.attention_implementation=sdpa",
      # 2026-04-19: ablation comparison of step2000 vs step4000 showed
      # step2000 is marginally better (mean Δ 0.65 vs 0.60; lower WITH
      # loss at positions 8-256). Rolling back to step2000 and
      # restarting from there. The step3000/3500/4000 checkpoints
      # appear to have mildly regressed under the compressed-ratio
      # drift that happened post last-restart.
      "++resume_checkpoint=/workspace/checkpoints/phase1_step3_step2000_20260418_153212",
      # 2026-04-19 evening: halved max_batch_tokens 16384→8192 and
      # doubled grad_accum 4→8 after the random-batch-shuffle fix
      # surfaced the latent memory-per-batch ceiling early — a step
      # 2020 batch of long-content samples at target_ratio=0.92
      # produced ~2800 survivors per sample, which puts 30K+ tokens
      # into the decoder per microbatch and overflows memory. The
      # prior runs hid this by scheduling long batches late in the
      # epoch (length-sorted sampler), which just deferred the
      # crash. Effective batch size per optimizer step is unchanged
      # (8192 * 8 = 65536, same as 16384 * 4).
      "++training.max_batch_tokens=8192",
      "++training.gradient_accumulation_steps=8",
      # Check memory every 10 steps so the safety rail + wandb curve
      # catches a leak early. Default 50 was too coarse — we could
      # grow 7 GB between checks under 2026-04-19's 140 MB/step leak.
      "++training.memory_log_every=10",
      # Abort training (after emergency save) if system memory exceeds
      # 110 GB out of 121 — leaves ~11 GB headroom for the save_checkpoint
      # call itself and for ssh/system. Raised from 100 on 2026-04-20 to
      # let training run longer before tripping while still guarding the
      # host from the all-the-way-to-OOM wedge.
      "++training.memory_abort_system_used_gb=110",
      # Force a fresh wandb run. Intentional break from the prior
      # continuity pattern because (a) we're rolling back to an earlier
      # checkpoint so the prior wandb history would claim later step
      # numbers and hide new incoming logs, and (b) the user explicitly
      # asked for reset.
      "++training.reset_wandb=true",
    ]

  train-phase1-step4:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step4"]

  # Offline ICE → head_base_l0 distillation. Writes a sidecar checkpoint
  # to $CHECKPOINT_DIR/survivorship_head_base_l0_<ts>/head_base_l0.pt
  # which phase1_step4.yaml references via survivorship_head_sidecar.
  pretrain-survivorship-head:
    <<: *gpu-common
    command: [
      "scripts/pretrain_survivorship_head.py",
      "--step2-checkpoint", "/workspace/checkpoints/phase1_step2_step19500_20260323_113116",
      "--ice-checkpoint", "/workspace/checkpoints/ice_step89999_20260306_213825",
      "--data-dir", "/workspace/data/mmap/structural",
      "--output-dir", "/workspace/checkpoints",
      "--teacher-ratio", "0.10",
      "--max-steps", "3000",
      "--max-batch-tokens", "16384",
      "--lr", "1e-3",
      "--num-workers", "2",
    ]

  train-phase1-step5:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step5"]

  train-phase1-step6:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase1_step6", "++training.reset_wandb=true"]

  # Per-token loss analyzer for a Phase 1 Step 3 reconstruction checkpoint.
  # Shares the GPU with an ongoing training container; expect a ~20–30%
  # slowdown while it runs. Pinned to the already-built
  # docker-train-phase1-step3 image so it never triggers a rebuild while
  # training is live. Invoke via:
  #   docker compose --env-file .env -f docker/docker-compose.yaml run --rm analyze-phase1-step3-loss
  # Override checkpoint / output / max_samples via +analyze.* args.
  # NOTE: the hardcoded checkpoint paths below refer to the legacy
  # pre-Step-2.5-repair LoRA-recon run (renamed to phase1_step3_legacy
  # by scripts/migrate_checkpoint_phases.py v4). Override +analyze.checkpoint
  # to point at a new Step 3 checkpoint once training produces one.
  analyze-phase1-step3-loss:
    <<: *gpu-common
    image: docker-train-phase1-step3:latest
    build: !reset null
    command: [
      "scripts/analyze_step3_loss.py",
      "+experiment=phase1_step3",
      "+analyze.checkpoint=/workspace/checkpoints/phase1_step3_legacy_step1500_20260417_042208",
      "+analyze.output_dir=/workspace/data/diagnostics/analyze_step3_step1500_20260417_042208",
      "+analyze.max_samples=500",
      # Use SDPA attention — avoids FA4's CUDA-error concurrency
      # fragility when training is also using FA4 on the same GPU.
      "++compute.attention_implementation=sdpa",
      # Halve per-microbatch tokens so we don't trip the unified-memory
      # allocator while training is live.
      "++training.max_batch_tokens=8192",
    ]

  # Survivor counterfactual + logit-distribution analyzer for Phase 1
  # Step 3. Runs eval twice (min_per_sample=0 vs =1) on the same samples
  # and dumps per-sample logit stats + content for zero-survivor samples.
  analyze-phase1-step3-survivors:
    <<: *gpu-common
    image: docker-train-phase1-step3:latest
    build: !reset null
    command: [
      "scripts/analyze_step3_survivors.py",
      "+experiment=phase1_step3",
      "+analyze.checkpoint=/workspace/checkpoints/phase1_step3_legacy_step1500_20260417_042208",
      "+analyze.output_dir=/workspace/data/diagnostics/survivors_step3_step1500",
      "+analyze.max_samples=500",
      "++compute.attention_implementation=sdpa",
      "++training.max_batch_tokens=8192",
    ]

  # With-vs-without-survivors ablation: same samples, two decoder passes
  # (real survivors vs zeroed). Per-position Δ tells us whether the
  # decoder is using survivor info at depth or just autoregressing.
  analyze-phase1-step3-survivor-ablation:
    <<: *gpu-common
    image: docker-train-phase1-step3:latest
    build: !reset null
    command: [
      "scripts/analyze_step3_survivor_ablation.py",
      "+experiment=phase1_step3",
      "+analyze.checkpoint=/workspace/checkpoints/phase1_step3_legacy_step1500_20260417_042208",
      "+analyze.output_dir=/workspace/data/diagnostics/ablation_step3_step1500",
      "+analyze.max_samples=500",
      "++compute.attention_implementation=sdpa",
      "++training.max_batch_tokens=8192",
    ]

  # Embedding-space deviation diagnostic. At target_ratio=None, how far
  # does the projected output deviate from decoder.embed_tokens of the
  # same content tokens? Geometric metrics (MSE / cosine / norm ratio),
  # top-K NN retrieval against decoder vocab, and reconstruction-CE
  # comparison vs the identity upper bound (decoder.embed_tokens fed as
  # survivors).
  analyze-phase1-step3-embedding-deviation:
    <<: *gpu-common
    image: docker-train-phase1-step3:latest
    build: !reset null
    command: [
      "scripts/analyze_embedding_deviation.py",
      "+experiment=phase1_step3",
      "+analyze.checkpoint=/workspace/checkpoints/phase1_step3_legacy_step2000_20260417_083031",
      "+analyze.output_dir=/workspace/data/diagnostics/embdev_step3_step2000",
      "+analyze.max_samples=200",
      "++compute.attention_implementation=sdpa",
      "++training.max_batch_tokens=8192",
    ]

  # Same diagnostic, pointed at the step2p5 repair checkpoint. Verifies
  # the embed-anchor actually translates to reconstruction improvement.
  # ``training.optimizer=adamw`` override is needed because the step2p5
  # checkpoint was saved under AdamW; the Step 3 base config defaults
  # to Muon, and ``_check_optimizer_type_compat`` would otherwise reject
  # the load. The optimizer is never stepped by the diagnostic, so the
  # override is purely a type-check appeasement.
  analyze-phase1-step2p5-embedding-deviation:
    <<: *gpu-common
    image: docker-train-phase1-step3:latest
    build: !reset null
    command: [
      "scripts/analyze_embedding_deviation.py",
      "+experiment=phase1_step3",
      "+analyze.checkpoint=/workspace/checkpoints/phase1_step2p5_step1200_20260417_173305",
      "+analyze.output_dir=/workspace/data/diagnostics/embdev_step2p5_step1200",
      "+analyze.max_samples=200",
      "++compute.attention_implementation=sdpa",
      "++training.max_batch_tokens=8192",
      "++training.optimizer=adamw",
      # Step 2.5 saves a pre-LoRA decoder (passthrough from Step 2). The
      # Step 3 base config applies LoRA in setup, which rewrites the
      # decoder state_dict key namespace to ``base_model.model.*`` +
      # LoRA adapters. Disabling LoRA here keeps the state_dict
      # structure matching the checkpoint. Geometric metrics (cos, mse,
      # norm-ratio) are LoRA-independent; the reconstruction-CE
      # identity upper bound is not directly comparable to the earlier
      # Step 3 diagnostic but the proj-vs-identity Δ within this run
      # still quantifies the repair's effect.
      "++training.decoder_lora.enabled=false",
    ]

  # Phase 1 Step 2.5: projection-only embed-anchor repair. Loads Step 2
  # checkpoint, freezes compressor + decoder, re-trains only the
  # projection block so its output lands on decoder.embed_tokens
  # manifold. See scripts/analyze_embedding_deviation.py for the
  # motivating diagnostic. Pinned to the phase1-step3 image to avoid
  # triggering a rebuild that would hit the cutlass libcuda import
  # issue; the image is already validated for this pipeline.
  train-phase1-step2p5:
    <<: *gpu-common
    image: docker-train-phase1-step3:latest
    build: !reset null
    command: ["scripts/train.py", "+experiment=phase1_step2p5"]

  train-phase2-kb-stage-a:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase2_kb_stage_a"]

  train-phase2-kb-stage-b:
    <<: *gpu-common
    command: ["scripts/train.py", "+experiment=phase2_kb_stage_b"]

  preprocess:
    build:
      context: ..
      dockerfile: docker/Dockerfile.data
    volumes:
      - ${DATA_DIR}:/workspace/data
    command: ["scripts/process_repos.py"]

  llama-large:
    <<: *llama-common
    ports:
      - "${LLAMA_PORT_LARGE:-8080}:8080"
    command: >-
      --model /models/${LLAMA_MODEL_LARGE:-LFM2-8B-A1B-Q4_K_M.gguf}
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLAMA_CTX_LARGE:-32768}
      --n-gpu-layers 999
      --parallel ${LLAMA_PARALLEL_LARGE:-2}
      --flash-attn on --no-mmap --jinja

  llama-small:
    <<: *llama-common
    ports:
      - "${LLAMA_PORT_SMALL:-8081}:8080"
    command: >-
      --model /models/${LLAMA_MODEL_SMALL:-LFM2.5-1.2B-Instruct-Q8_0.gguf}
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLAMA_CTX_SMALL:-65536}
      --n-gpu-layers 999
      --parallel ${LLAMA_PARALLEL_SMALL:-2}
      --flash-attn on --no-mmap --jinja

  llama-tiny:
    <<: *llama-common
    ports:
      - "${LLAMA_PORT_TINY:-8082}:8080"
    command: >-
      --model /models/${LLAMA_MODEL_TINY:-Qwen3-0.6B-Q8_0.gguf}
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLAMA_CTX_TINY:-65536}
      --n-gpu-layers 999
      --parallel ${LLAMA_PARALLEL_TINY:-8}
      --flash-attn on --no-mmap --jinja

  # --- vLLM inference (primary + fast) ---

  vllm-primary:
    <<: *vllm-common
    image: "${VLLM_IMAGE_PRIMARY:-vllm-mxfp4-spark:latest}"
    ports:
      - "${VLLM_PORT_PRIMARY:-8090}:8000"
    environment:
      NVIDIA_DISABLE_REQUIRE: "1"
      TIKTOKEN_ENCODINGS_BASE: /workspace/vllm/tiktoken_encodings
      VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: "1"
    command: >-
      vllm serve ${VLLM_MODEL_PRIMARY:-openai/gpt-oss-20b}
      --quantization mxfp4
      --mxfp4-backend CUTLASS
      --mxfp4-layers moe,qkv,o,lm_head
      --gpu-memory-utilization ${VLLM_GPU_UTIL_PRIMARY:-0.45}
      --max-model-len 32768
      --enable-prefix-caching
      --max-num-batched-tokens 8192
      --kv-cache-dtype fp8
      --attention-backend FLASHINFER
      --load-format fastsafetensors
      --enforce-eager

  vllm-fast:
    <<: *vllm-common
    image: "${VLLM_IMAGE_FAST:-vllm-node:latest}"
    ports:
      - "${VLLM_PORT_FAST:-8091}:8000"
    environment:
      NVIDIA_DISABLE_REQUIRE: "1"
    command: >-
      vllm serve ${VLLM_MODEL_FAST:-Qwen/Qwen3.5-0.8B}
      --gpu-memory-utilization ${VLLM_GPU_UTIL_FAST:-0.10}
      --max-model-len 32768
      --enable-prefix-caching
      --enable-chunked-prefill

volumes:
  bgkit-compile-cache:
  bgkit-triton-cache:
