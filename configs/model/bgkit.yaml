# BgKIT compressor
# Based on Qwen3.5-0.8B-Base (~800M params, bidirectionalized via BidirectionalQwen35)
# 24 layers: 18 Gated DeltaNet (dual-pass) + 6 full attention (unmasked)
bgkit:
  backbone_name: Qwen/Qwen3.5-0.8B-Base
  # backbone_revision: <pin after release stabilizes>
  hidden_dim: 1024
  # Total survivor budget across all files for a single repo
  total_survivor_budget: 3500
  # Level 0: within-file compression
  level0:
    # Static fallback ICE threshold (used before calibration)
    ice_threshold: 3.0
    # After calibration export, add:
    # target_ratio: 0.15
    # calibration_snapshot: { ... }
  # Level 1: cross-file compression
  level1:
    # Max positions for L1 input (Qwen3.5-0.8B supports 262K context)
    max_positions: 32768
    # Static fallback ICE threshold (used before calibration)
    ice_threshold: 3.0
    # After calibration export, add:
    # target_ratio: 0.15
    # calibration_snapshot: { ... }
