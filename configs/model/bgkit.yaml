# BgKIT compressor
# Based on Qwen3-Embedding-0.6B (~600M params)
bgkit:
  backbone_name: Qwen/Qwen3-Embedding-0.6B
  backbone_revision: c54f2e6e80b2d7b7de06f51cec4959f6b3e03418
  hidden_dim: 1024
  # Total survivor budget across all files for a single repo
  total_survivor_budget: 3500
  # Level 0: within-file compression
  level0:
    # Static fallback ICE threshold (used before calibration)
    ice_threshold: 3.0
    # After calibration export, add:
    # target_ratio: 0.15
    # calibration_snapshot: { ... }
  # Level 1: cross-file compression
  level1:
    # Max positions for L1 input (Qwen3-0.6B context limit)
    max_positions: 32768
    # Static fallback ICE threshold (used before calibration)
    ice_threshold: 3.0
    # After calibration export, add:
    # target_ratio: 0.15
    # calibration_snapshot: { ... }
