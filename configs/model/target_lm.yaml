# Target LLM: Qwen3.5-35B
# 35B total / ~3B active MoE, hidden dim 2560
# 64-layer hybrid: 16x(3x Gated DeltaNet-MoE + 1x gated attention-MoE)
# 262K context, same architecture family as our 0.8B encoder/decoder
target_lm:
  model_name: Qwen/Qwen3.5-35B  # instruct variant (no -Instruct suffix)
  hidden_dim: 2560
  num_layers: 64
  num_attention_layers: 16  # gated attention layers (rest are gated DeltaNet)
  context_length: 262144
  # Quantization for memory-constrained training
  quantization:
    load_in_4bit: true
    bnb_4bit_compute_dtype: bfloat16
    bnb_4bit_quant_type: nf4
    bnb_4bit_use_double_quant: true
  # LoRA configuration
  lora:
    rank: 64
    alpha: 128
    dropout: 0.05
    # Start with attention layers only; experiment with +DeltaNet layers
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    # Experimental: DeltaNet projection matrices
    # target_modules_extended: ["q_proj", "k_proj", "v_proj", "o_proj", "delta_proj"]
