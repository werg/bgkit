# Projection block: BgKIT compressor output -> decoder embedding space.
# Repurposed from the encoder's last transformer block (layer 27).
# Both encoder and decoder are Qwen3.5-0.8B (1024 dim), so source and target
# dims match and no dimensional extension is needed.
projection:
  source_dim: 1024   # BgKIT compressor output dim (Qwen3.5-0.8B layer 22)
  target_dim: 1024   # decoder hidden dim (Qwen3.5-0.8B)
  # The block itself is initialized from the base model's last layer.
