survivorship_head:
  inner_dim: 256               # head MLP hidden dim
  tap_layer: 7                 # layer index for head tap (pruned: block 1)
  # ratio_inject_layer REMOVED — ratio embedding intentionally deleted in
  # the survivorship-head pivot. target_ratio is consumed by the operator
  # (DualThresholdController), not by a learned embedding. Phase 2 KB with
  # per-query ratios needs separate design (see docs/survivorship_design.md
  # §Phase 2 KB regression).

threshold_controller:
  # θ operates on tanh-bounded head output (in (-1, 1)). For a roughly
  # symmetric head distribution, θ = 1 - 2·target_ratio yields
  # target_ratio initial keep-rate. The trainer computes this from
  # target_ratio_start at setup and overrides the value below.
  init_theta: -0.9            # default for target_ratio_start=0.95
  # lr raised 0.02 → 0.05 on 2026-04-21: the 0.02 value was under-damped
  # for active-ramp tracking (docs/theta_controller_investigation_2026_04_21.md).
  # Steady-state tracking lag was |target_rate|/(lr·k) ≈ 0.1 with k ≈ −0.25;
  # 2.5× gain reduces lag proportionally.
  lr: 0.05                    # tanh-space lr
  momentum: 0.0               # tune up if θ sawtooths
  # clamp raised 0.99 → 1.5 on 2026-04-21: at 0.99, θ pins on clamp when the
  # target is infeasible (bf16 tanh saturates hard at ±1, so positions at the
  # −1 floor can't survive any θ > −1). Allowing θ past ±1 lets the controller
  # saturate cleanly (θ ≫ 1 → nothing survives, θ ≪ −1 → all survive) instead
  # of pinning. The > comparison degrades gracefully outside tanh's range.
  clamp: 1.5                  # ±clamp past tanh's range to allow clean saturation
  min_per_sample_during_warmup: 1   # floor active during BCE warmup only
  min_per_sample_post_warmup: 0     # disabled; accept zero-survivor samples as
                                    # legitimate signal at full compression.

# Adapter + μ EMA architecture was removed 2026-04-16. Soft-attn now
# feeds gradient directly to the single head; tanh saturation at ±1
# is the sole structural guard against inflation. See bgkit_compressor.py
# module docstring and git log for the simplification rationale.
