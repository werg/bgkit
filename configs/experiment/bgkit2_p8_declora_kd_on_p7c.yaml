# @package _global_
# P8 (planned, not launched): decoder LoRA + KD on top of the best encoder
# checkpoint, encoder backbone + LoRA frozen. init_encoder_from must point
# at the chosen checkpoint dir (P7c best, or P1 step 2000 if P7c never
# beats it). NOTE: a P7c checkpoint carries LoRA-injected keys; loading it
# requires encoder_lora.enabled with the same rank so the keys match.
defaults:
  - /config
  - /training/bgkit2
  - _self_

run_name: bgkit2_p8_declora_kd

training:
  max_steps: 20000
  bgkit2:
    model:
      init_encoder_from: /workspace/checkpoints/bgkit2_step8000_20260905_093200_376262_run-bgkit2_p1_prompted
      train_backbone_layers: []
      encoder_lora:
        enabled: false
      # P1's interface settings: the hard row-norm + diversity terms moved P1's
      # SQuAD reps arm 2.20 -> 2.87 (P7b@1000) before any LoRA step ran, and
      # with the encoder frozen the EMA cannot be outrun (P1 had no NaN).
      interface_momentum: 0.1
      interface_row_norm: false
      interface_prenorm: true
      lora:
        enabled: true
        rank: 32
        alpha: 64
        layers: [0, 1, 2, 3, 4, 5, 6, 7]
    data:
      task_stores:
        - /workspace/bgkit2_data/tasks/qa_squad.parquet
        - /workspace/bgkit2_data/tasks/qa_hotpotqa.parquet
        - /workspace/bgkit2_data/tasks/qa_triviaqa.parquet
        - /workspace/bgkit2_data/tasks/file_overview.parquet
        - /workspace/bgkit2_data/tasks/compaction_v2.parquet
      task_weights: [0.2, 0.2, 0.15, 0.3, 0.15]
      task_mix: 0.5
      task_max_ctx_tokens: 2048
      task_max_prefix_tokens: 1536
      batch_size: 12
    ratio:
      r_max_start: 0.5
      ceiling_steps: 1000
    anchor:
      # P1 improved after its anchor decayed to 0 (steps 4000-8000, prenorm
      # on); do not re-introduce a term the warm-started projection outgrew.
      weight: 0.0
      floor: 0.0
      steps: 1
      decorrelation_weight: 0.0
      within_doc_diversity_weight: 0.0
    kd:
      weight: 1.0
      temperature: 1.0
      ce_weight: 1.0
    optim:
      lr_head: 5.0e-5
      lr_projection: 1.0e-4
      lr_lora: 2.0e-5
