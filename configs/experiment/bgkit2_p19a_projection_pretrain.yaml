# @package _global_
# P19a (2026-09-07): STAGE A of the ported Phase-1 recipe — projection
# pretraining at ZERO compression (the Step 2.5 analogue). Encoder backbone
# frozen, decoder frozen, ratio pinned at 1.0 (one rep per token, nothing
# selected), no task loss: the only gradient is the embed-anchor (MSE +
# cosine of each projected rep to the decoder's embedding of its own token).
# The frozen decoder's loss on the spliced reps is logged as the readability
# monitor. GATE for stage B (decoder adaptation at ratio 1.0, Step 1
# analogue): rep/cos_to_token high and eval/x1/reconstruct/loss close to
# eval/full_text/reconstruct/loss. Every bgkit2 rep run before this one
# sampled 4x compression from step 0 and never passed x1 == full.
defaults:
  - /config
  - /training/bgkit2
  - _self_

run_name: bgkit2_p19a_projection_pretrain

training:
  max_steps: 8000
  eval_every: 500
  save_every: 500
  checkpoint_pruning:
    metric: eval/x1/reconstruct/loss
  bgkit2:
    model:
      train_backbone_layers: []
      encoder_lora:
        enabled: false
      interface_momentum: 0.1
      interface_row_norm: false
      interface_prenorm: true
      interface_match_moments: true
      rep_token_residual: false
      rep_token_residual_only: false
      lora:
        enabled: false
    data:
      task_stores:
        - /workspace/bgkit2_data/tasks/qa_squad.parquet
        - /workspace/bgkit2_data/tasks/qa_hotpotqa.parquet
        - /workspace/bgkit2_data/tasks/qa_triviaqa.parquet
        - /workspace/bgkit2_data/tasks/file_overview.parquet
        - /workspace/bgkit2_data/tasks/compaction_v2.parquet
      task_weights: [0.2, 0.2, 0.15, 0.3, 0.15]
      task_mix: 0.5
      task_max_ctx_tokens: 2048
      task_max_prefix_tokens: 1536
      batch_size: 12
    ratio:
      r_max_start: 1.0
      r_max: 1.0
      r_start: 1.0
      r_end: 1.0
      descent_steps: 0
      ceiling_steps: 0
      hold_steps: 0
      p_random_selection: 0.0
    anchor:
      weight: 1.0
      floor: 1.0
      steps: 1
      decorrelation_weight: 0.0
      within_doc_diversity_weight: 0.0
    kd:
      weight: 0.0
      ce_weight: 0.0
      selection_weight: 0.0
      teacher_checkpoint: null
    optim:
      lr_projection: 3.0e-4
