# @package _global_
# P10 (prepared 2026-09-05, launch only if P9 fails to move the reconstruct
# gain by step 3000): FULL training of the top 4 backbone layers under the
# bounded interface. P3/P4 opened backbone layers without it and collapsed /
# diverged (P4 NaN at 1240) — with the reference bounded that verdict is
# void, as P9 showed for LoRA. Decoder FROZEN, KD, anchor off, warm from P1
# step 8000. Metric: eval/x4/reconstruct/rep_gain_nats (P1 0.69, ceiling 3.1).
defaults:
  - /config
  - /training/bgkit2
  - _self_

run_name: bgkit2_p10_toplayers_prenorm

training:
  max_steps: 20000
  bgkit2:
    model:
      init_encoder_from: /workspace/checkpoints/bgkit2_step8000_20260905_093200_376262_run-bgkit2_p1_prompted
      train_backbone_layers: [12, 13, 14, 15]
      encoder_lora:
        enabled: false
      interface_momentum: 0.1
      interface_row_norm: false
      interface_prenorm: true
      lora:
        enabled: false
    data:
      task_stores:
        - /workspace/bgkit2_data/tasks/qa_squad.parquet
        - /workspace/bgkit2_data/tasks/qa_hotpotqa.parquet
        - /workspace/bgkit2_data/tasks/qa_triviaqa.parquet
        - /workspace/bgkit2_data/tasks/file_overview.parquet
        - /workspace/bgkit2_data/tasks/compaction_v2.parquet
      task_weights: [0.2, 0.2, 0.15, 0.3, 0.15]
      task_mix: 0.5
      task_max_ctx_tokens: 2048
      task_max_prefix_tokens: 1536
      batch_size: 12
    ratio:
      r_max_start: 0.5
      ceiling_steps: 1000
    anchor:
      weight: 0.0
      floor: 0.0
      steps: 1
      decorrelation_weight: 0.0
      within_doc_diversity_weight: 0.0
    kd:
      weight: 1.0
      temperature: 1.0
      ce_weight: 1.0
    optim:
      lr_backbone: 2.0e-5
      lr_head: 5.0e-5
      lr_projection: 1.0e-4
