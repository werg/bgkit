# @package _global_
# P9 (prepared 2026-09-05, launch only if P8 confirms floor collapse at 2000):
# re-test encoder-side capacity under the BOUNDED interface. P7c (encoder
# LoRA, row-norm, diversity) degraded while its interface reference ran
# 578→2883 — the same defect that spiked P1 — so its verdict on encoder LoRA
# is void. P9 = encoder LoRA r32 (all layers) + prenorm, decoder FROZEN (the
# ladder stays readable), KD from the full-text teacher, anchor off, no
# diversity/decorrelation, warm from P1 step 8000. The metric that must move
# is eval/x4/reconstruct/rep_gain_nats (P1 plateau 0.69, ceiling 3.1).
defaults:
  - /config
  - /training/bgkit2
  - _self_

run_name: bgkit2_p9_enclora_prenorm

training:
  max_steps: 20000
  bgkit2:
    model:
      init_encoder_from: /workspace/checkpoints/bgkit2_step8000_20260905_093200_376262_run-bgkit2_p1_prompted
      train_backbone_layers: []
      encoder_lora:
        enabled: true
        rank: 32
        alpha: 64
        dropout: 0.0
        layers: []
      interface_momentum: 0.1
      interface_row_norm: false
      interface_prenorm: true
      lora:
        enabled: false
    data:
      task_stores:
        - /workspace/bgkit2_data/tasks/qa_squad.parquet
        - /workspace/bgkit2_data/tasks/qa_hotpotqa.parquet
        - /workspace/bgkit2_data/tasks/qa_triviaqa.parquet
        - /workspace/bgkit2_data/tasks/file_overview.parquet
        - /workspace/bgkit2_data/tasks/compaction_v2.parquet
      task_weights: [0.2, 0.2, 0.15, 0.3, 0.15]
      task_mix: 0.5
      task_max_ctx_tokens: 2048
      task_max_prefix_tokens: 1536
      batch_size: 12
    ratio:
      r_max_start: 0.5
      ceiling_steps: 1000
    anchor:
      weight: 0.0
      floor: 0.0
      steps: 1
      decorrelation_weight: 0.0
      within_doc_diversity_weight: 0.0
    kd:
      weight: 1.0
      temperature: 1.0
      ce_weight: 1.0
    optim:
      lr_head: 5.0e-5
      lr_projection: 1.0e-4
      lr_lora: 5.0e-5
