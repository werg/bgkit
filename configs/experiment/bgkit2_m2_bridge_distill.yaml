# @package _global_
# M2 — Stage B of the multi-level encoder (plans/multilevel_encoder_2026_09_16.md).
#
# The encoder's backbone was trained on token embeddings. Stage A taught the
# repro head to land survivors in that distribution (cos_to_token 0.02 -> 0.70,
# and on repo navigation the pre-warmed bridge is worth +2.69 nats over a zeroed
# floor against +1.37 for a random projection). Stage B now adapts the ENCODER
# itself to read those bridged inputs, by distilling the two-level student onto
# a frozen single-level teacher's projection output on the same survivor set.
#
# Trains the repro head AND the projection + head (the parts that have to change
# for a second level to be read), with the backbone frozen — the optimizer must
# stay small, since the end state keeps the encoder tree out of it entirely.
defaults:
  - /config
  - /training/bgkit2
  - _self_

run_name: bgkit2_m2_bridge_distill

training:
  max_steps: 1500   # Path B cosine went 0.82 -> 0.92 in 16 steps; this converges fast
  gradient_checkpointing_encoder: true    # Path B runs the backbone TWICE with grad; recompute is far cheaper than the activations
  gradient_checkpointing_decoder: false
  eval_every: 500
  save_every: 500
  checkpoint_pruning:
    metric: eval/loss
    lower_is_better: true
  bgkit2:
    model:
      # M1's checkpoint: the encoder with a PRE-WARMED repro head.
      init_encoder_from: /workspace/checkpoints/bgkit2_step2999_20260916_151729_086214_run-bgkit2_m1_repro_prewarm
      init_head_from: /workspace/checkpoints/bgkit2_step2999_20260916_151729_086214_run-bgkit2_m1_repro_prewarm
      repro_head: true
      train_backbone_layers: []        # backbone frozen; head + projection + repro learn
      interface_rms_only: true
      prompt_separator: true
      projection_block: true
      projection_input_skip: false
      interface_momentum: 0.1
      interface_row_norm: false
      interface_prenorm: true
      interface_match_moments: true
    data:
      # Path B encodes level 0 AND level 1 with gradients, plus a teacher
      # forward — roughly 3x a single-level step. The first launch OOMed at the
      # inherited budget with 8.45 GiB free.
      max_batch_tokens: 6000   # 2500 gave ~9 rows/step at ctx_mean 279 and 50 s/step; peak was 36 GB against 47 GB free
    multilevel:
      enabled: true
      # The teacher is P26's encoder: the single-level behaviour we must not lose.
      teacher_checkpoint: /workspace/checkpoints/eval_keep/bgkit2_step23999_20260916_100251_611179_run-bgkit2_p26_agentic_distill
      teacher_ratio: 0.20
      path_a_prob: 0.5
      # 1.0 means level 0 keeps EVERY position, so level 1 re-encodes the full
      # document — that is what OOMed. Start at 0.5: level 1 still does most of
      # the compression, on half the input.
      frac_extras_start: 0.5
      frac_extras_end: 0.31
      curriculum_steps: 2500
    anchor:
      repro_weight: 0.2                # keep the bridge anchored while the encoder adapts
      weight: 0.0
      floor: 0.0
    kd:
      ce_weight: 0.0                   # encoder-only: no decoder objective
      weight: 0.0
      selection_weight: 0.0
