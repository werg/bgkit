# @package _global_
# P3: rung 1 done properly. P2 (cold rung 1, LoRA lr 1e-4) learned the tasks
# WITHOUT the reps: at step 1000 rep gain fell to ~0 or negative (SQuAD x4
# +0.04 vs P1's +2.30; HotpotQA -0.92), no-context loss halved, shared
# fraction 0.74 -- the decoder fitted priors while the reps collapsed. P3:
#   * warm-start encoder + projection + interface norm from P1 step 2000
#     (the reps a frozen decoder read at +2.3 nats),
#   * LoRA and encoder top layers open but SLOW (2e-5 / 1e-5), so the
#     encoder stays the fast learner,
#   * anti-collapse: anchor floor 0.3, decorrelation penalty 1.0, interface
#     momentum 0.3.
defaults:
  - /config
  - /training/bgkit2
  - _self_

run_name: bgkit2_p3_anticollapse

training:
  max_steps: 20000
  bgkit2:
    model:
      init_encoder_from: /workspace/checkpoints/bgkit2_step2000_20260904_022950_685175_run-bgkit2_p1_prompted
      train_backbone_layers: [12, 13, 14, 15]
      interface_momentum: 0.3
      lora:
        enabled: true
        rank: 32
        alpha: 64
        layers: [0, 1, 2, 3, 4, 5, 6, 7]
    data:
      task_stores:
        - /workspace/bgkit2_data/tasks/qa_squad.parquet
        - /workspace/bgkit2_data/tasks/qa_hotpotqa.parquet
        - /workspace/bgkit2_data/tasks/qa_triviaqa.parquet
        - /workspace/bgkit2_data/tasks/file_overview.parquet
        - /workspace/bgkit2_data/tasks/compaction_v2.parquet
      task_weights: [0.2, 0.2, 0.15, 0.3, 0.15]
      task_mix: 0.5
      task_max_ctx_tokens: 2048
      task_max_prefix_tokens: 1536
    ratio:
      r_max_start: 0.5     # the warm-started encoder already aligned at 1x; start half-way
      ceiling_steps: 1000
    anchor:
      weight: 0.5
      floor: 0.3
      steps: 2000
      decorrelation_weight: 1.0
    optim:
      lr_backbone: 1.0e-5
      lr_head: 5.0e-5
      lr_projection: 1.0e-4
      lr_lora: 2.0e-5
