# @package _global_
# P6: the configuration never run so far — encoder backbone FROZEN (the only
# regime whose reps held: P1), decoder LoRA open slowly, knowledge
# distillation from the full-text teacher, warm start from P1 step 2000.
#
# The confound is resolved by P4: with a FROZEN decoder and the full backbone
# trainable, rep gains collapsed (SQuAD +2.30 -> +0.45, shared 0.89) exactly
# as in P2/P3/P5, all of which also trained backbone layers. Training the
# encoder backbone under this objective is what collapses the reps; the
# decoder was never isolated. Here only head + projection + decoder LoRA
# learn; anti-collapse terms keep the projection honest.
defaults:
  - /config
  - /training/bgkit2
  - _self_

run_name: bgkit2_p6_frozenenc_lora_kd

training:
  max_steps: 20000
  bgkit2:
    model:
      init_encoder_from: /workspace/checkpoints/bgkit2_step2000_20260904_022950_685175_run-bgkit2_p1_prompted
      train_backbone_layers: []
      interface_momentum: 0.3
      lora:
        enabled: true
        rank: 32
        alpha: 64
        layers: [0, 1, 2, 3, 4, 5, 6, 7]
    data:
      task_stores:
        - /workspace/bgkit2_data/tasks/qa_squad.parquet
        - /workspace/bgkit2_data/tasks/qa_hotpotqa.parquet
        - /workspace/bgkit2_data/tasks/qa_triviaqa.parquet
        - /workspace/bgkit2_data/tasks/file_overview.parquet
        - /workspace/bgkit2_data/tasks/compaction_v2.parquet
      task_weights: [0.2, 0.2, 0.15, 0.3, 0.15]
      task_mix: 0.5
      task_max_ctx_tokens: 2048
      task_max_prefix_tokens: 1536
      batch_size: 12
    ratio:
      r_max_start: 0.5
      ceiling_steps: 1000
    anchor:
      weight: 0.5
      floor: 0.3
      steps: 2000
      decorrelation_weight: 1.0
    kd:
      weight: 1.0
      temperature: 1.0
      ce_weight: 1.0
    optim:
      lr_head: 5.0e-5
      lr_projection: 1.0e-4
      lr_lora: 2.0e-5
