# @package _global_
# S2 SHOWCASE (drafted 2026-09-22; NOT launched): S1b's recipe (encoder adapter on, conservative)
# + the three strengthened gaps — agentic (LFM2.5-8B trajectories WITH the repo overview), web research
# (six public web-research SFT sources on our offline web tools; long trajectories as compaction
# spines), memory (v2 stores with LongMemEval's asked-on date, the two-stage memory agent, all eight
# question types). PENDING stores are marked; the launch script runs the store validator
# (scripts/bgkit2_validate_stores.py --from-experiment) and refuses on a missing store.
# S1b — S1 (bgkit2_s1_showcase.yaml) with the ENCODER BACK IN TRAINING (user 2026-09-22: "definitely
# we want to bring the encoder back"; plans/rep_recipe_port_2026_09_07.md 11:05Z). Since P28 every run
# froze the whole encoder (optim.freeze_encoder) because the repo-tree cache required it; tool results,
# QA documents, memory and compaction had no large-tree cost and were frozen with it (S1@5000: rep
# gains 0.01-0.28 nats on tool digests / compaction / agent rows vs 1.7-2.5 on QA).
# optim.encoder_mode: adapter = ONE encoder adapter (peft LoRA "slots" on the TOP 4 backbone layers,
# rank 16, + trainable copies of head / survive embedding / prompt separator / projection block /
# projection / interface) active for every ordinary slot and the compaction spine; the BASE encoder
# stays frozen and out of the optimizer and serves the cached-tree path (browse / overview slots and
# every tree above multilevel.live_tree_max_files), so the node cache stays exactly its output.
# Memory (user: "careful about memory ... but we do want the improving promptability and gradient
# flow"): upper layers only, encoder gradient checkpointing ON, a per-microbatch encoder gradient
# budget (optim.encoder_grad_token_budget: slots beyond it are still encoded live, under no_grad),
# live trees only up to 64 files with grad_levels 2. Measure first: scripts/bgkit2_probe_s1b_memory.py.
# Everything else is S1's (same data, mix, curriculum, teacher, inits).
defaults:
  - /config
  - /training/bgkit2
  - _self_

run_name: bgkit2_s2_showcase
# Never auto-resume (the resolver falls back to the HDD archive by run_name).
# PLACEHOLDER: fill at launch. To continue from S1@N instead of from S1's inits, point
# init_encoder_from / init_head_from AND init_decoder_from at S1's checkpoint (fresh optimizer; the
# adapter starts at zero delta and its part copies at the loaded weights); a `resume_checkpoint` of an
# S1 checkpoint also loads (the encoder state is remapped) but carries S1's optimizer groups.
resume_checkpoint: /workspace/checkpoints_fast/bgkit2_step17000_20260925_035852_175969_run-bgkit2_s2_showcase   # 2026-09-25: resume after the step-17630 OOM at CUDA fraction 0.32

training:
  max_steps: 20000   # S2 horizon (re-plan 2026-09-22: ~20k steps)
  gradient_checkpointing_encoder: true    # S1b: the encoder trains again (adapter); recompute instead of holding encoder activations (S1 had it off because the encoder was frozen)
  gradient_checkpointing_decoder: false   # user 2026-09-08: peaks of 50-67 GB against the 73 GB cap are accepted
  eval_every: 5000
  save_every: 1000
  checkpoint_pruning:
    metric: eval/task/qa_multineedle/gen_x64/exact_match
    lower_is_better: false
  bgkit2:
    model:
      repro_head: true
      init_encoder_from: /workspace/checkpoints/bgkit2_step11999_20260923_140518_602592_run-bgkit2_s1b_showcase_encoder   # filled at launch: S1b final
      init_head_from: /workspace/checkpoints/bgkit2_step11999_20260923_140518_602592_run-bgkit2_s1b_showcase_encoder   # filled at launch: S1b final
      init_decoder_from: /workspace/checkpoints/bgkit2_step11999_20260923_140518_602592_run-bgkit2_s1b_showcase_encoder   # filled at launch: S1b final
      train_backbone_layers: []          # the BASE encoder stays frozen: it is the tree-cache encoder
      encoder_adapter:                   # optim.encoder_mode adapter (see the header)
        rank: 16
        alpha: 32
        dropout: 0.0
        top_layers: 4                    # layers 12-15 of 16 (P29/W3's trainable set)
        lr: 5.0e-5                       # the stable encoder-LoRA rate (P7b/P7c; 1e-4 exploded in P7)
        train_parts: true                # head / survive embedding / projection copies at optim.lr_*
      interface_rms_only: true
      prompt_separator: true
      projection_block: true
      projection_input_skip: false
      encoder_lora:
        enabled: false
      interface_momentum: 0.1
      interface_row_norm: false
      interface_prenorm: true
      interface_match_moments: true
      rep_token_residual: false
      rep_token_residual_only: false
      lora:
        enabled: true
        rank: 32
        alpha: 64
        layers: [0, 1, 2, 3, 4, 5, 6, 7]
        rep_gated: false   # OPEN decoder: the delta applies everywhere; the replay stream (kd.replay_*) holds the base
    data:
      train_stores:
        - /workspace/bgkit2_data/corpus/fineweb_train
        - /workspace/bgkit2_data/corpus/code_train
        - /workspace/bgkit2_data/corpus/books_v2_train   # PG-19 chunks (data revision)
        - /workspace/bgkit2_data/corpus/dialogue_v2_train   # the replay conversations as plain transcripts (data revision)
      train_weights: [0.45, 0.30, 0.15, 0.10]
      eval_stores:
        - /workspace/bgkit2_data/corpus/fineweb_eval
        - /workspace/bgkit2_data/corpus/code_eval
        - /workspace/bgkit2_data/corpus/books_v2_eval
        - /workspace/bgkit2_data/corpus/dialogue_v2_eval
      task_stores:
        - /workspace/bgkit2_data/tasks/agent_tool_slots_v8.arrow   # browse walks + overview dropout; v8 = v7 re-rendered (2026-09-22): inline zoom results -> encoded zoom slots, current tool specs / system prompt, tool list in chat rows (scripts/bgkit2_rerender_agent_zoom.py)
        - /workspace/bgkit2_data/tasks/agent_swe_lfm_v1b.arrow   # S2: LFM2.5-8B teacher in OUR harness, WITH the repo overview, rejection-sampled on gold files (PENDING: s2_trees_then_generate.sh)
        - /workspace/bgkit2_data/tasks/tool_slots_synth_v3_mapped.arrow   # external agent trajectories, hindsight focus prompts; v3 (2026-09-22): EVERY view_range read is an ENCODED zoom slot (prompt "zoom <path> lines a-b: <purpose>", 4x), incl. before edits -- no `exact` in S2 rows
        - /workspace/bgkit2_data/tasks/tool_digest_ext_v3.arrow   # promptable summaries
        - /workspace/bgkit2_data/tasks/tool_digest_v2.arrow
        - /workspace/bgkit2_data/tasks/web_search_r1_v2.arrow   # S2 web: Search-R1-SFT (Qwen3-4B/7B teachers), web_search slots
        - /workspace/bgkit2_data/tasks/web_sds_v2.arrow   # S2 web: SimpleDeepSearcher
        - /workspace/bgkit2_data/tasks/web_webshaper_v2.arrow   # S2 web: WebShaper gpt-oss-120b rollouts; v2: web_find = whole-page slot prompted "find <pattern> in <title>: <focus>" (PENDING: web_sft_build_find_v1.log)
        - /workspace/bgkit2_data/tasks/web_openseeker_v2.arrow   # S2 web: OpenSeeker (whole trajectories, compaction spine)
        - /workspace/bgkit2_data/tasks/web_openresearcher_v2.arrow   # S2 web: OpenResearcher (whole trajectories, compaction spine; MiroVerse-derived questions: non-commercial); v2: web_find = whole-page slot (PENDING: web_sft_build_find_v1.log)
        - /workspace/bgkit2_data/tasks/web_miroverse_nc_v2.arrow   # S2 web: MiroVerse (CC-BY-NC)
        - /workspace/bgkit2_data/tasks/memory_recall_v2.arrow   # v2 = LongMemEval (asked on DATE) prefix
        - /workspace/bgkit2_data/tasks/memory_qa_v2_pairs.arrow
        - /workspace/bgkit2_data/tasks/memory_qa_v2_user_assistant.arrow
        - /workspace/bgkit2_data/tasks/memory_agent_v2.arrow   # S2: two-stage memory (index slots + memory_search / memory_read with focus); built 2026-09-22 (35,828 rows, c0ac5ac/b6b1305), priced per slot via meta.slot_reps
        - /workspace/bgkit2_data/tasks/memory_qa_s2_ua.arrow   # S2: all eight LongMemEval-style types incl. assistant / preference / temporal_relative (PENDING: gen_memory_qa_s2.sh, teacher window)
        - /workspace/bgkit2_data/tasks/chatqa2_narrativeqa.arrow
        - /workspace/bgkit2_data/tasks/chatqa2_long_sft.arrow
        - /workspace/bgkit2_data/tasks/qa_squad.arrow
        - /workspace/bgkit2_data/tasks/qa_hotpotqa.arrow
        - /workspace/bgkit2_data/tasks/qa_triviaqa.arrow
        - /workspace/bgkit2_data/tasks/qa_hotpotqa_distractor.arrow
        - /workspace/bgkit2_data/tasks/qa_multineedle.arrow
        - /workspace/bgkit2_data/tasks/qa_multineedle_long_fam.arrow
        - /workspace/bgkit2_data/tasks/qa_squad_article_v2.arrow
        - /workspace/bgkit2_data/tasks/qa_quality_mcq.arrow
        - /workspace/bgkit2_data/tasks/qa_narrativeqa.arrow
        - /workspace/bgkit2_data/tasks/babi_filler_v3.arrow
        - /workspace/bgkit2_data/tasks/compaction_v2.arrow
        - /workspace/bgkit2_data/tasks/compaction_chunks_5src_100k.arrow
        - /workspace/bgkit2_data/tasks/compaction_chunks_long_5src_fam.arrow
        - /workspace/bgkit2_data/tasks/repo_qa_file_v3.arrow
        - /workspace/bgkit2_data/tasks/repo_localisation_v3.arrow
        - /workspace/bgkit2_data/tasks/repo_overview_v1.arrow
        - /workspace/bgkit2_data/tasks/file_overview.arrow
        - /workspace/bgkit2_data/tasks/chat_replay_v2.arrow   # REPLAY chat
        - /workspace/bgkit2_data/tasks/read_replay_v2.arrow   # REPLAY raw reading <=7k
        - /workspace/bgkit2_data/tasks/read_replay_long_v1.arrow   # REPLAY raw reading 4k-16k
      task_weights: [0.0900, 0.0800, 0.0500, 0.0400, 0.0100, 0.0400, 0.0100, 0.0200, 0.0300, 0.0300, 0.0300, 0.0300, 0.0300, 0.0400, 0.0400, 0.0400, 0.0300, 0.0300, 0.0200, 0.0100, 0.0100, 0.0150, 0.0150, 0.0150, 0.0150, 0.0100, 0.0100, 0.0100, 0.0100, 0.0150, 0.0150, 0.0100, 0.0100, 0.0050, 0.0050, 0.0600, 0.0300, 0.0400]   # S2 mix (sums to 1): agentic 0.27, web 0.16, memory 0.18, KB/QA 0.20, compaction 0.04, repo 0.03, replay 0.13
      task_mix: 0.5
      task_max_target_tokens: 1024   # S2: web answers + OpenSeeker turns (27% of its targets > 640; p95 2264)
      framing_diversity: true
      framing_p_system: 0.3
      framing_p_no_prompt: 0.1
      task_eval_heldout_samples: 64
      heldout_stores: [qa_squad, qa_multineedle, compaction_chunks_5src_100k]
      task_gen_factors: [64]   # 16x generation at the pauses
      task_gen_families: [qa_squad, qa_hotpotqa, qa_triviaqa, qa_multineedle, qa_multineedle_long, babi_filler, qa_squad_article, qa_quality, qa_narrativeqa, qa_hotpotqa_distractor]   # no generation on free-form stores in the trainer eval
      train_eval_skip_stores: [babilong, qa_squad_heldout, qa_multineedle_heldout, compaction_chunks_5src_100k_heldout, memory_recall_v2, memory_qa_v2_pairs, memory_qa_v2_user_assistant, memory_agent_v2, memory_qa_s2_ua, web_openseeker_v2, web_openresearcher_v2, chatqa2_narrativeqa, chatqa2_long_sft, read_replay_long_v1]   # S1: the long families (100k-token histories, 16-slot books) drove the host to 4.3 GB in the eval (full-text arm); the showcase benchmarks measure them   # scored at the pauses instead
      eval_batch_max_tokens: 8000   # S1 shares the machine with the user's run (2026-09-22): smaller eval batches
      alt_prompt_stores: [qa_multineedle, qa_multineedle_long, qa_squad, qa_triviaqa, babi_filler_v3, qa_squad_article_v2, qa_quality_v2, qa_narrativeqa, repo_qa_file_v2]
      eval_only_stores:
        - /workspace/bgkit2_data/tasks/babilong.arrow   # external long-context needle benchmark (eval only)
      max_batch_tokens: 5000   # S1 co-exists with the user's run: smaller microbatches (was 7000)
      eval_batch_size: 1
      num_workers: 1   # each worker holds decoded rows of the long stores in RAM
      task_eval_factors: [16, 64]   # shortened 2026-09-22 (user: shorten the interstitial eval); no x1 arm at 8k (8k reps in the slot = the eval memory peak; host hit 3 GB available at 16:33Z)
      task_max_ctx_tokens: 8192
      task_max_prefix_tokens: 4096
      # Stage D: every 4th step is a batch of repo TREES (root encoding -> path)
      repo_tree_store: /workspace/bgkit2_data/tasks/repo_tree_v6.parquet
      repo_tree_max_files: 400
      repo_tree_file_tokens: 131072   # WHOLE files (user 2026-09-20): long files compress harder, none is cut
      repo_tree_every: -1   # EVAL-ONLY trees (0 would mean a tree-only run). No bare tree batches: they taught the agent to answer without tools (P31); the walk is trained INSIDE the agent episodes (browse slots)
      repo_tree_root_cache: /workspace/checkpoints/tree_caches/repo_tree_v6.nodes:/workspace/checkpoints/tree_caches/swe_rebench.nodes   # NodeCache union: + the SWE-rebench trees of agent_swe_lfm_v1   # <store>.roots.safetensors from bgkit2_cache_repo_trees.py
      task_max_prefix_tokens_by_store:
        # Built to 7000 tokens on purpose (p90 4,572): 11.2% of its rows exceed the
        # global 4096 cap, i.e. exactly the long reading anchors the store exists to
        # provide. Raising the global cap would lengthen every other store's decoder
        # sequences instead.
        read_replay_v2: 7168   # agentic prefixes p50 2.6k tokens (tool_slots); longer rows hop
        tool_slots_synth_v3_mapped: 6144   # retrofitted agent histories: 35% exceed 4096 (remap --max-prefix-tokens 6144 drops 5%)
        read_replay_long_v1: 9216   # co-existing with the user's run: the longest raw-reading rows (decoder + KD base pass) hop
        web_openseeker_v2: 12288      # post-compaction prefixes (context budget 6144 + spine slot); set from the converter's reported p95
        web_openresearcher_v2: 8192
        web_webshaper_v2: 6144
        agent_swe_lfm_v1b: 8192
        memory_agent_v2: 4608      # decoder-text prefix p95 3,785 / max 4,113 (~50 index labels); 4096 would hop <1%
      # Eval noise (2026-09-08): gen SQuAD EM moved 5/48 -> 0/48 between evals.
      # The eval rows are the FIRST N of each store's eval split, so a larger
      # N is a superset of the earlier set (comparable on the shared rows).
      eval_samples: 48   # shortened 2026-09-22
      task_eval_samples: 32   # shortened 2026-09-22 (per store; the benchmarks measure at scale)
      task_gen_samples: 32   # shortened 2026-09-22; (was 288) generation eval is the eval-time memory peak
      batch_size: 12
      length_bucket_window: 32   # user 2026-09-08: length-aware batching (sort 32-batch windows by length hint)
    ratio:
      r_max_start: 0.25   # band top stays at 4x
      r_max: 0.25   # no ceiling descent
      r_start: 0.01619485193348709   # := P19j floor at its handover (as P20)
      r_end: 0.0078125
      ceiling_steps: 0
      hold_steps: 0
      # ADAPTIVE floor (user, 2026-09-08): steps per doubling grow like
      # 1/sqrt(r) (first doubling ~670 steps, 64x->128x ~5200 if mastered on
      # time) and the rate is eased by clamp(target_gap / gap, 0.1, 1) with
      # gap = reconstruct loss at the CURRENT FLOOR minus full text, read at
      # every eval. Never stops, never rises. descent_steps is unused here.
      adaptive: true
      rate_log2_per_step: 2.0e-3
      rate_power: 0.5
      mult_min: 0.25   # ≥ 2000 steps per doubling at the hard end
      band_top_prob: 0.4   # 40% of steps at 4-8x: gen x4 EM fell to 0.03 under plain log-uniform (P19k@1000)
      band_top_lo: 0.125
      family_rep_budget:
        babi_filler: [32, 256]
        # These two keys name the long stores' OWN family, which they only have
        # since 2026-09-15: the stores used to carry the SHORT store's family
        # ("qa_multineedle" / "compaction_chunks"), so both budgets silently did
        # nothing in P20-P24. For the 8k chunk store that was not cosmetic — with
        # no band and no budget it took the global step ratio, which lands in
        # [0.125, 0.25] on 40% of steps (band_top_prob), i.e. 1,024-2,048 reps for
        # an 8,192-token document, the exact waste the budget was written to stop.
        # Fixed in the DATA (scripts/bgkit2_relabel_family.py -> *_fam files).
        qa_multineedle_long: [32, 256]
        compaction_chunks_long_5src: [64, 512]
        qa_squad_article: [32, 256]
        qa_quality: [32, 256]
        tool_slots: [16, 192]   # per slot (each tool result is its own encoder row)
        agent_tool_slots: [16, 192]
        repo_qa_file: [32, 256]
        repo_localisation: [32, 256]
        tool_digest: [16, 192]   # same regime as a tool slot: the row IS one tool result
        memory_recall: [8, 64]      # per SESSION slot (median 56 sessions/history -> ~1.7k decoder positions)
        memory_qa: [8, 64]
        memory_qa_ua: [8, 64]
        memory_agent_v2: [8, 64]    # only for UNPRICED slots: every memory_agent_v1 slot carries meta.slot_reps (slot_reps_mode below)
        chatqa2_narrativeqa: [32, 256]   # per 4k-token slot, up to 16 slots
        chatqa2_long_sft: [32, 256]
      family_bands:
        qa_multineedle: [0.0078125, 0.03125]   # 32-128x: the needle union exceeds the budget
        qa_multineedle_long: [0.0078125, 0.03125]
      mastery_family: reconstruct
      mastery_target_gap: 0.2   # user 2026-09-08: ease earlier (was 0.3)
      descent_steps: 8000
      p_random_selection: 0.1
      ratios_per_step: 1   # 2 doubled every decoder pass; multi-ratio coverage comes from sampling across steps
      # train == eval per SLOT (bgkit2.data.slot_pricing): rows with meta.slot_reps (memory_agent_v1: index 4-24,
      # memory_search 1/4, memory_read 1/8) encode each slot at the harness's price x log-uniform [0.5, 2];
      # every other row keeps its row ratio. "harness" would also price web_* / agent_tool_slots_v7 /
      # tool_slots_synth_* from their prompts (web_search 1/4: ~1.4k reps per openresearcher row vs today's
      # budget) -- a decoder-length increase to measure with scripts/bgkit2_probe_s1b_memory.py first.
      slot_reps_mode: harness   # train == eval pricing for EVERY priced slot (web_search 4, web_open 16, memory, read/bash/search): meta covers only memory_agent_v1; +~1.4k decoder positions on long web rows -> run scripts/bgkit2_probe_s1b_memory.py with this config before S2 launches
      slot_reps_jitter: [0.5, 2.0]
    multilevel:
      ratio_leaf: 0.125
      ratio_node: 0.25
      max_depth: 6
      leaf_chunk: 16
      leaf_window: 4096      # files longer than this are encoded in windows -> ONE leaf
      leaf_max_reps: 512     # = ratio_leaf x 4096: a leaf never exceeds what a cut file had; longer files compress harder
      walk: true             # tree eval = the PATH WALK (step + full-walk exact), held-out vs train slice
      grad_levels: 2                    # live trees (<= live_tree_max_files): root + one level train, leaves no_grad
      live_tree_max_files: 64           # larger trees (and every browse / overview slot) read the frozen node cache
      bridge: identity                  # ablation: identity +11.00 vs repro +11.05 at 3000 — a tie; the simpler pipeline wins
    anchor:
      weight: 0.0
      floor: 0.0
      phase_out_steps: 0   # P19f already phased the anchor out
      steps: 1
      decorrelation_weight: 0.0
      within_doc_diversity_weight: 0.0
    kd:
      weight: 1.0        # stage D: KD to the frozen base every step — the guard on the adapter
      kd_every: 1
      temperature: 1.0
      prompt_contrast_weight: 2.0
      prompt_contrast_margin: 1.0
      prompt_contrast_max_tokens: 4096   # (was 6144) two encoder + four decoder graphs in one pass
      prompt_contrast_paired: true
      ce_weight: 1.0       # P19e showed KD-only is capped at the base teacher (x4 rose 1.88 -> 2.58, gen EM 0.03): CE carries the gold signal
      selection_weight: 0.2   # a nudge (user 2026-09-10)
      selection_temperature: 1.0
      selection_signal: attention   # teacher attention (P18's signal), query-conditioned by construction
      teacher_gold_window: true   # oracle-window KD on babi_filler rows (their gold spans also become the selection target)
      per_row_ce: true   # every row weighs the same, however long its document or short its answer
      replay_family: chat_replay
      replay_kl_weight: 1.0
      replay_ce_weight: 0.2
      family_loss_weight:
        babi_filler: 1.5
        qa_multineedle_long: 1.5
        compaction_chunks_long_5src: 1.5
        qa_squad_article: 1.5
        qa_quality: 1.5
      selection_chunk: 1
      selection_max_ctx_tokens: 4096   # the eager (H, T, T) pass skips the 8k rows
      selection_every: 2
      head_scale_anchor_weight: 0.01   # old lineage: z-scored losses leave the raw scale gradient-free (129 -> 8431 in 30 steps)
      head_scale_target: 1.0
      teacher_checkpoint: /workspace/checkpoints/bgkit2_step4000_20260909_033056_638835_run-bgkit2_p19g_fulltext_lora   # matched full-text LoRA (rep-gated), the honest teacher
    optim:
      encoder_mode: adapter              # the base encoder (tree cache) frozen; the encoder adapter trains
      encoder_grad_token_budget: 8192    # slot tokens per microbatch encoded WITH gradient (primary first, then the most recent extra slots)
      lr_backbone: 2.0e-5   # the whole backbone (old lineage rate)
      lr_lora: 5.0e-5   # continuing P24's adapter
      encoder_freeze_steps: 0   # decoder-first: the fresh reader adapts to P22's reps before the encoder moves (user 2026-09-13: 'slight projection realignment')
      lr_head: 5.0e-5
      lr_projection: 1.0e-4
      lr_projection_block: 5.0e-5
