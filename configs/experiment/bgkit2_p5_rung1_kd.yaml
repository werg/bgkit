# @package _global_
# P5: rung 1 + knowledge distillation (BenchPress's objective). The student
# (LoRA decoder reading reps) matches the FULL-TEXT teacher (the same
# decoder, adapter off, the context tokens spliced in the rep slot); CE on
# the answer kept at weight 1. A student that ignores the reps cannot match
# a context-dependent teacher — the shortcut P2/P3 took is no longer a
# minimum. Warm start from P1 step 2000; slow LoRA; anti-collapse terms.
defaults:
  - /config
  - /training/bgkit2
  - _self_

run_name: bgkit2_p5_rung1_kd

training:
  max_steps: 20000
  bgkit2:
    model:
      init_encoder_from: /workspace/checkpoints/bgkit2_step2000_20260904_022950_685175_run-bgkit2_p1_prompted
      train_backbone_layers: [12, 13, 14, 15]
      interface_momentum: 0.3
      lora:
        enabled: true
        rank: 32
        alpha: 64
        layers: [0, 1, 2, 3, 4, 5, 6, 7]
    data:
      task_stores:
        - /workspace/bgkit2_data/tasks/qa_squad.parquet
        - /workspace/bgkit2_data/tasks/qa_hotpotqa.parquet
        - /workspace/bgkit2_data/tasks/qa_triviaqa.parquet
        - /workspace/bgkit2_data/tasks/file_overview.parquet
        - /workspace/bgkit2_data/tasks/compaction_v2.parquet
      task_weights: [0.2, 0.2, 0.15, 0.3, 0.15]
      task_mix: 0.5
      task_max_ctx_tokens: 2048
      task_max_prefix_tokens: 1536
      batch_size: 12          # teacher forward at full context length adds memory
    ratio:
      r_max_start: 0.5
      ceiling_steps: 1000
    anchor:
      weight: 0.5
      floor: 0.3
      steps: 2000
      decorrelation_weight: 1.0
    kd:
      weight: 1.0
      temperature: 1.0
      ce_weight: 1.0
    optim:
      lr_backbone: 1.0e-5
      lr_head: 5.0e-5
      lr_projection: 1.0e-4
      lr_lora: 2.0e-5
