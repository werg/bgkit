# @package _global_
# P19a3 (2026-09-08, user suggestion): stage A the way the old lineage did it —
# instead of a position-local MLP on frozen states (P19a, capped at cos ~0.6
# by the frozen MLM backbone) or the whole backbone open (P19a2), retrain only
# the LAST backbone block and give the projection a CONTEXTUAL block: a
# trainable copy of the last attention layer run over the survivor set
# (model.projection_block). Anchor-only, ratio 1.0, decoder frozen; MLP
# projection warm from P19a step 500. Compared with P19a2 at matched steps on
# x1 reconstruct / cos / within-doc eff-rank; the cheaper one that passes
# gate A becomes the stage-A recipe.
defaults:
  - /config
  - /training/bgkit2
  - _self_

run_name: bgkit2_p19a3_lastblock_projblock

training:
  max_steps: 8000
  eval_every: 500
  save_every: 500
  warmup_steps: 300
  checkpoint_pruning:
    metric: eval/x1/reconstruct/loss
  bgkit2:
    model:
      init_encoder_from: /workspace/checkpoints/bgkit2_step500_20260907_225709_666467_run-bgkit2_p19a_projection_pretrain
      train_backbone_layers: [15]
      projection_block: true
      encoder_lora:
        enabled: false
      interface_momentum: 0.1
      interface_row_norm: false
      interface_prenorm: true
      interface_match_moments: true
      rep_token_residual: false
      rep_token_residual_only: false
      lora:
        enabled: false
    data:
      task_stores:
        - /workspace/bgkit2_data/tasks/qa_squad.parquet
        - /workspace/bgkit2_data/tasks/qa_hotpotqa.parquet
        - /workspace/bgkit2_data/tasks/qa_triviaqa.parquet
        - /workspace/bgkit2_data/tasks/file_overview.parquet
        - /workspace/bgkit2_data/tasks/compaction_v2.parquet
      task_weights: [0.2, 0.2, 0.15, 0.3, 0.15]
      task_mix: 0.5
      task_max_ctx_tokens: 2048
      task_max_prefix_tokens: 1536
      batch_size: 12
    ratio:
      r_max_start: 1.0
      r_max: 1.0
      r_start: 1.0
      r_end: 1.0
      descent_steps: 0
      ceiling_steps: 0
      hold_steps: 0
      p_random_selection: 0.0
    anchor:
      weight: 1.0
      floor: 1.0
      steps: 1
      decorrelation_weight: 0.0
      within_doc_diversity_weight: 0.0
    kd:
      weight: 0.0
      ce_weight: 0.0
      selection_weight: 0.0
      teacher_checkpoint: null
    optim:
      lr_backbone: 5.0e-5
      lr_projection: 3.0e-4
      lr_projection_block: 1.0e-4
