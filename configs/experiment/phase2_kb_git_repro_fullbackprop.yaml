# @package _global_
# Experiment preset: Phase 2 git_commit_repro FULL-BACKPROP recursive-L1
# curriculum bootstrap. phase: phase2_kb -> KRKBTrainer with
# recursive_l1_tree.full_backprop: true (whole window subtree encoded LIVE;
# L0 cached/frozen; L1 + l1l1_bridge + tree trainable).
defaults:
  - /config
  - /training/phase2_kb_git_repro_fullbackprop
  - _self_

run_name: phase2_kb_git_repro_fullbackprop
# Auto-resume ENABLED (no resume_checkpoint key): on restart the trainer
# resolves the latest run-scoped checkpoint (resolve_latest_checkpoint, keyed on
# run_name above) and resumes; on the first launch — or if the latest checkpoint
# is incompatible — it gracefully cold-starts from the summarization base loaded
# by the training config. So restarts (instrumentation/tuning/crash) CONTINUE
# instead of re-starting from summarization and losing progress.
# (Was pinned "none" for the 2026-07-03 opaque-BIP-39-ID + child-ID-injection
# redesign that made prior checkpoints incompatible; that migration is done, and
# incompatible checkpoints now cold-start gracefully rather than crash.)
