# 2026-07-31 RE-ANCHOR (collapse fix): FRESH start from the CLEAN summarization
# base `phase1_summarization_round_robin_step51945_...` (training.phase1_checkpoint)
# — NOT the drifted 9164 encoder / hybrid, which IS the collapsed artifact we are
# repairing. The 51945 encoder+decoders are matched, load-bearing (rep_gain +2
# nats) and in-band. resume_checkpoint=none cold-starts from that base under the
# collapse fixes: projection norm-band regularizer (survivorship.projection_norm_reg),
# survivorship aux re-enabled, LR rebalanced so the encoder can't outrun the decoder,
# and the global spliced-rep-norm runtime guard. Content delivery fixes (quota,
# exact_topk leaf, query-cond drill, retention pins) are UNCHANGED — not the bug.
# 2026-08-01: switched "none" → null (AUTO-RESUME) after the step-235 OOM crash.
# Now SAFE + self-healing: the fresh run_name (phase2_kb_git_repro_reanchor51945)
# scopes resolve_latest_checkpoint to THIS run's own saves, so it can only ever
# resume a reanchor checkpoint — never the poisoned old-name step-9164. On THIS
# launch no reanchor checkpoint exists yet → auto-resolve returns None → clean
