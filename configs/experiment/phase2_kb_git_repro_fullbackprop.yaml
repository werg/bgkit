# the decode-batching GPU parity gate (scripts/test_decode_batching_parity.py).
# Result: multi-sample packing leaks across sample boundaries, so batching stays
# gated behind per_repo_sample_group_size>1 (default 1 = proven per-file path).
# RESUME from the exact stop step (user rule: a graceful stop resumes live from
