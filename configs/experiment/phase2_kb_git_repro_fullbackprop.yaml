# AR fallback while the tree was collapsed). To test whether the collapse fix +
# high-start retention let the reps become load-bearing, cold-start from the
# summarization base — a poisoned model won't un-learn the shortcut by resuming.
# RESUME the fixed-run step-975 checkpoint (2026-07-07 14:02, last save before the
# 2026-07-08 host reboot/kernel-upgrade killed the container). This is the latest
# GOOD post-collapse-fix checkpoint (fresh run reached 375 -> 975, reps confirmed
# load-bearing). Pinned explicitly (NOT "auto" — auto-resume picks highest step =
# the POISONED old-run step-4825, which learned the AR shortcut). Relaunched with a
