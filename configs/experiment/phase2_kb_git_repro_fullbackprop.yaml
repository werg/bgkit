# L0 cached/frozen; L1 + l1l1_bridge + tree trainable).
defaults:
  - /config
  - /training/phase2_kb_git_repro_fullbackprop
  - _self_

# 2026-07-31 RE-ANCHOR: fresh run_name isolates this run's checkpoints + wandb
# from the COLLAPSED old run (which shares the old name). CRITICAL: auto-resume
# (resolve_latest_checkpoint) is run_name-scoped AND picks the HIGHEST STEP — with
# the old name it would resolve the poisoned step-9164 over this run's early
# saves. A distinct name means, once we flip off resume_checkpoint:"none" for
# crash-recovery, auto-resume can only ever find THIS run's checkpoints.
run_name: phase2_kb_git_repro_reanchor51945
# FRESH cold-start (2026-07-06): the prior run is shortcut-poisoned (learned the
# AR fallback while the tree was collapsed). To test whether the collapse fix +
# high-start retention let the reps become load-bearing, cold-start from the
# summarization base — a poisoned model won't un-learn the shortcut by resuming.
# RESUME the fixed-run step-975 checkpoint (2026-07-07 14:02, last save before the
# 2026-07-08 host reboot/kernel-upgrade killed the container). This is the latest
# GOOD post-collapse-fix checkpoint (fresh run reached 375 -> 975, reps confirmed
# load-bearing). Pinned explicitly (NOT "auto" — auto-resume picks highest step =
# the POISONED old-run step-4825, which learned the AR shortcut). Relaunched with a
# raised BGKIT_STEP_TIMEOUT (host env) so a big-tree Option-A backward completes;
# the nest-fix (suspend inner backbone ckpt) also cuts big-node recompute ~1.5x.
# CONTAINER path (host /mnt/external/bgkit-checkpoints is mounted at
# /workspace/checkpoints inside the container — the host path FileNotFound'd).
# FRESH cold-start (2026-07-22): the sha="" commit-node-id collapse was fixed.
# Schema v2 now uses real git SHAs plus salted opaque model-facing IDs. New IDs mean
# the model must re-learn navigation from scratch, so cold-start from the
# summarization base rather than resuming the (id-collapsed) step-1075 run.
