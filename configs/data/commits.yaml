# Commit filtering rules
commits:
  exclude_merges: true
  max_files_changed: 50
  max_diff_lines: 5000
  min_diff_lines: 3
  exclude_patterns:
    - "*.lock"
    - "*.generated.*"
    - "__generated__/*"
    - "*.min.js"
    - "*.min.css"
    - "vendor/*"
    - "node_modules/*"
  prefer_cross_file: true
  # Commit reproduction data: serialize as standalone documents
  commit_reproduction:
    enabled: true
    max_diff_tokens: 4096
    output_dir: ${oc.env:DATA_DIR}/processed/commit_reproduction
    max_commits_per_repo: 200
    max_repos: null
    tokenizer_name: Qwen/Qwen3.5-0.8B
  # Commit encoding data: per-file diffs + full commit for two-level compression
  commit_encoding:
    enabled: true
    tokenizer_name: Qwen/Qwen3.5-0.8B
    output_dir: ${oc.env:DATA_DIR}/processed/commit_encoding
    max_diff_tokens_per_file: 4096
    max_diff_tokens: 8192
    max_commits_per_repo: 200
    max_repos: null
