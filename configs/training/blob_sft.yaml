# @package _global_
# Family-A blob compaction SFT (capability-packaging plan §4).
# Lean trainer: src/bgkit/training/blob_sft_trainer.py over BlobSFTDataset
# (SWE-Zero trajectory shards → compaction samples with <bgkit_blob> blocks).
# Starts from a Phase-2 wide-net checkpoint (encoder + Qwen decoder already
# co-trained on the splice contract).
training:
  phase: blob_sft
  stage: A
  # REQUIRED: Phase-2 checkpoint carrying encoder + qwen decoder state.
  init_checkpoint: ???
  data:
    train_shards: []
    # Legacy shard-level eval split; prefer repo_holdout_fraction.
    eval_shards: []
    # REPO-level holdout over train_shards (crc32 bucket of the row's repo):
    # train and eval are guaranteed repo-disjoint. Overrides eval_shards.
    repo_holdout_fraction: 0.0

  draws_per_trajectory: 4
  max_rows_per_shard: null
  min_blob_content_tokens: 64
  max_blob_content_tokens: 45000
  max_decode_tokens: 40000

  # Blob encode retention (query-free, exact_topk both levels). ~6× to start —
  # the semantic-compression operating point; ratio descent across stages
  # follows the continuous-descent doctrine once multi-stage runs exist.
  l0_ratio: 0.35
  l1_ratio: 0.5
  freeze_encoder: false

  lr: 5.0e-5
  max_steps: 2000
  warmup_steps: 100
  eval_every: 250
  save_every: 500
  gradient_accumulation_steps: 4
  max_eval_samples: 128
  eval_ablation_zeroed: true
  optimizer: muon
  num_workers: 2

  # Per-backbone-layer encoder GC + reentrant decoder GC (the proven forms).
  gradient_checkpointing: true
  decoder_gradient_checkpointing: "reentrant"
  # Held-out plain-text language health (2026-08-25). Mean next-token CE over a
  # fixed slice of ordinary text, no template and no task involved. This is the
  # ONLY eval metric that can see the decoder's general language ability
  # collapsing: the wide-net runs took it from PPL 33 to 2585 while eval loss,
  # token accuracy, exact match and the zeroed-rep ablation all looked merely
  # mediocre, because every one of those is measured on the distribution being
  # overfit. Watch DRIFT from the first eval's value, not an absolute number —
  # the healthy starting point is lineage-specific (stock 15, summ. base 33).
  # 0 disables. 16 x 1024 tokens is a rounding error against an eval pass.
  # DISABLED 2026-08-25: the in-run metric triggers a device-side assert
  # inside the patched packed decoder, which poisons the CUDA context and
  # KILLS the run (it took down the lrprobe twice). Token ids are in range,
  # so the fault is deeper in the packed/CE path and needs an isolated
  # repro with CUDA_LAUNCH_BLOCKING=1. Until then measure language health
  # OFFLINE from checkpoints with scripts/probe_decoder_language_health.py,
  # which works and is what produced the whole lineage table.
  lm_health_samples: 0
  lm_health_seq_len: 1024
  # Defaults to training.data.file_tokens_path when unset.
  lm_health_tokens_path: null
