# Commit encoding: two-level L0+L1 compression for commit reproduction
phase: phase1_step4
optimizer: muon
max_steps: 15000
lr: 3.0e-5
encoder_lr: 1.0e-5
decoder_lr: 5.0e-5
warmup_steps: 500
bidi_warmup_steps: 0       # already bidirectional from previous steps

# Ratio scheduling
target_ratio_start: 0.50
target_ratio_end: 0.20
target_ratio_ramp_steps: 30000

# Survivorship head auxiliary losses
survivorship:
  ratio_loss_weight: 0.1
  decisiveness_loss_weight: 0.05
  soft_attn_loss_weight: 0.05
  soft_attn_every_n_steps: 4

decoder_lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

freeze:
  bgkit: false
  decoder: false

data:
  commit_encoding_dir: ${oc.env:DATA_DIR}/processed/commit_encoding
  prompt_variants_dir: configs/prompt_variants
  max_diff_tokens_per_file: 4096
  max_files_per_commit: 16
  max_message_tokens: 256

max_batch_tokens: 65536
gradient_accumulation_steps: 1

eval_every: 1000
save_every: 5000
