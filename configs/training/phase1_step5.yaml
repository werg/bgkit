# Commit encoding (Phase 1 Step 5): split-L0/L1 + L0-freeze curriculum.
# See plans/step5-l0-freeze-curriculum.md for the full spec.
phase: phase1_step5
optimizer: muon
max_steps: 15000
lr: 3.0e-5
encoder_lr: 1.0e-5
decoder_lr: 5.0e-5
warmup_steps: 500
bidi_warmup_steps: 0           # already bidirectional from previous steps
gradient_checkpointing: megatron
# Keep the trainable encoder-side checkpointing default. 2026-05-18 fixed/static
# reruns showed disabling it is memory-safe but not a stable speed win on the
# Step 5 gate.
decoder_gradient_checkpointing: false
# Trainable Qwen3.5 packed decoder backward currently fails PyTorch checkpoint
# recompute checks; keep decoder activations explicit until the packed path is
# checkpoint-stable.
# cuda_empty_cache_every_step removed: the memory-driven scheduler
# (compute.memory.dynamic_ckpt) now does adaptive cache flushes only on
# observed memory pressure. Setting cuda_empty_cache_every_step to a
# positive value here re-enables the unconditional cadence as a fallback.

# Memory-driven dynamic gradient-checkpointing scheduler is default-on
# host-wide via ``configs/compute/dgx_spark.yaml`` → ``memory.dynamic_ckpt``.
# Override here only when a phase needs different thresholds or to disable
# (e.g. ``dynamic_ckpt: {enabled: false}``).

# ---- Three-phase curriculum (all live-tunable via control.json) ----
# Stage transitions (steps).
auto_repro_warmup_steps: 0      # Step 4.7 (BridgeDistillTrainer) re-anchors
                                # auto_repro_head and projection_block under a
                                # teacher-distillation curriculum at the actual
                                # operating compression regime, so this phase
                                # is no longer needed. Forcing ratios=1.0 here
                                # would actively un-train the bridge.
head_warmup_steps: 0            # Heads are unchanged from Step 4 and need no
                                # additional warmup; stage0 starts firing them.
stage0_end_step: 3000           # L0 ramp finishes here (also stage 0 → 1 transition)
stage1_l1_ramp_start_step: 3000 # L1 ratio ramp starts here
stage1_l1_ramp_end_step: 5000   # L1 ratio ramp finishes here

# L0 ratio curriculum (per-stage targets).
stage0_l0_ratio_start: 0.9      # stage 0 L0 ramp start
stage0_l0_ratio_end: 0.15       # stage 0 L0 ramp end
stage1_target_ratio_l0: 0.30    # stage 1 L0 steady state

# L1 ratio curriculum (per-stage targets).
# BgKIT compression (head + threshold) is already trained from Step 4 — both
# L0 and L1 heads fire at block 1 and produce per-position selection logits;
# the decoder Step-4 LoRA was trained on the post-projection compressed
# splice. What's NEW in Step 5 is L1's backbone seeing bridge-projected L0
# survivors instead of raw token embeddings. So L1 ratio fires its compression
# from step 0 (head fires only when ratio < 0.999); only L1's BACKBONE needs
# adaptation time. Held constant at the target so the decoder sees a stable
# effective compression scale throughout.
stage0_target_ratio_l1: 0.33
stage1_target_ratio_l1_start: 0.33
stage1_target_ratio_l1_end: 0.33

# Per-stage sample-length / batch-token budgets (live-tunable).
# Stage 0 uses a single primary dataloader.
stage0_max_sample_length: 1500  # tightened from 2000 after step 460 stall
stage0_max_batch_tokens: 4096

# Stage 1 dual-dataloader routing (frozen -> large floodgates, unfrozen -> tight).
stage1_l0_frozen_max_sample_length: 6000
stage1_l0_frozen_max_batch_tokens: 16384
stage1_l0_unfrozen_max_sample_length: 1500
stage1_l0_unfrozen_max_batch_tokens: 4096
stage1_l0_unfrozen_period: 8     # every 8th step is L0-unfrozen (~12.5%)

# ---- Compatibility — anchor sampling disabled per Step 4 lessons. ----
sample_target_ratio_during_training: false
target_ratio_anchor_sampling_prob: 0.0

# ---- Survivorship head losses (per-level) ----
survivorship:
  l0:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.0
    utility_grad_loss_weight: 0.3   # only effective on L0-unfrozen microbatches
    moment_match_weight: 0.05       # halved from Step 3; lighter anchor
    min_survivors_loss_weight: 0.05
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3
  l1:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.05  # symmetry-break — no BCE at L1
    decisiveness_warmup_weight: 0.20
    decisiveness_warmup_steps: 2000
    utility_grad_loss_weight: 0.3
    moment_match_weight: 0.0
    min_survivors_loss_weight: 0.05
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3

ice_distillation:
  l0:
    enabled: false
  l1:
    enabled: false

moment_match_reference:
  l0:
    path: ${oc.env:DATA_DIR}/diagnostics/ice_reference_moments.json
  l1:
    path: null

decoder_lora:
  enabled: false
  implementation: peft
  r: 32
  alpha: 64
  dropout: 0.0
  # LoRA baseline settings are retained for explicit A/B presets, but
  # the default Step 5 training contract is full-decoder/no-LoRA.
  peft_fused_backward: true
  peft_fuse_gate_up: true
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

freeze:
  bgkit: false
  decoder: false

decoder_layerwise_split:
  # Default Step 5 trains the full decoder, so keep the no-grad-prefix split
  # path off. Use an explicit A/B or frozen-decoder preset for split-schedule
  # diagnostics.
  mode: "0"
  min_ratio: 3.0
  min_prefix: 1536
  # Packed DeltaNet is still diagnostic-only because full-decoder survivor
  # gradients drift even when single-layer activations look close.
  packed_deltanet: false

frozen_decoder_kernels:
  # Opt-in while real Step 5 profiles are gathered. This keeps Qwen3.5
  # DeltaNet qkv causal conv channel-last and preserves the stock FLA GDR graph.
  deltanet_channel_last_conv: false
  # Sub-options for the stock-GDR channel-last path. These keep the normal FLA
  # GDR boundary but fuse qkv causal-conv + q/k L2Norm and push q/k L2Norm
  # backward into FLA's fused dq/kg/wy kernel. Split dX avoids materializing a
  # concatenated q/k/v gradient before the qkv causal-conv dX.
  deltanet_stock_fused_qkv_conv_l2norm: false
  deltanet_stock_fused_qkv_conv_l2norm_dx: false
  deltanet_stock_fused_qkv_conv_split_dx: false
  deltanet_fuse_qk_l2norm_bwd: false
  # Opt-in deeper frozen DeltaNet autograd boundary. This uses BgKIT's custom
  # GDR dproj/direct-input-gradient path and must be A/B profiled on real fixed
  # Step 5 batches before promotion.
  deltanet_core_bwd: false
  # Wider linear-attention layer boundary: input RMSNorm + DeltaNet + residual
  # dX-only autograd. The optional MLP flag also owns the post-attention
  # RMSNorm + MLP + residual tail for those same linear-attention layers. This
  # is the first production-config surface for the deeper block rewrite path;
  # keep default-off until parity plus fixed-step profiling beat stock.
  deltanet_residual_bwd: false
  deltanet_residual_mlp_bwd: false
  # Optional custom-core/residual sub-kernel: fuse input RMSNorm dX and residual
  # dX into one Triton launch. This only affects deltanet_core_bwd or
  # deltanet_residual_bwd and remains default-off until decoder timing wins.
  deltanet_input_rmsnorm_dx: false
  # Opt-in lower-level gate path. Stock Qwen keeps computing the Python gate
  # expression before BgKIT swaps in raw a-gates at the FLA call boundary; the
  # channel-last DeltaNet forward rewrite skips that Python gate work and lets
  # FLA compute raw a-gate decay/clamp directly. It remains mutually exclusive
  # with deltanet_core_bwd and must clear focused parity/real-step profiling.
  # BGKIT_FROZEN_DELTANET_CHANNEL_LAST_RESET_CONV=1 is an explicit diagnostic
  # mode only: stock Step 5 keeps qkv causal conv continuous across packed
  # segments and passes cu_seqlens only to GDR.
  deltanet_raw_gate_in_kernel: false
  # Stock FLA paired q/k L2Norm forward. A same-command fixed Step 5 A/B showed
  # a small positive signal but not enough to make it a default kernel path.
  deltanet_pair_qk_l2norm_fwd: false
  # Opt-in full-attention sibling projection fuse. This affects only the six
  # Qwen full-attention layers; keep default-off unless it improves real Step 5
  # when composed with wider decoder-kernel experiments.
  attention_qkv: false
  # Optional internal layout variant for deltanet_core_bwd. Synthetic decoder
  # runs like it, but the fixed Step 5 transfer is weak, so keep it explicit.
  deltanet_core_channel_last_conv: false
  deltanet_core_channel_last_conv_dx: false
  # Deeper custom-core forward boundary: fuse channel-last qkv causal conv,
  # q/k split, q/k L2Norm, and v split. Requires deltanet_core_channel_last_conv.
  deltanet_core_fused_qkv_conv_l2norm: false
  # Shape guards for deltanet_core_bwd. The custom core has only shown useful
  # signal on longer decoder rows, so the lower guard lets A/B runs skip short
  # microbatches without editing environment variables.
  deltanet_core_min_seq_len: 0
  deltanet_core_max_seq_len: 544
  # Opt-in long-sequence MLP activation boundary. Seq512 Step 5-shaped runs do
  # not justify this as a default, but seq2048 decoder benchmarks benefit when
  # the Triton forward helper is enabled.
  mlp_swiglu: false
  mlp_swiglu_triton_forward: false
  # Opt-in full frozen MLP autograd boundary. The adaptive dX mode uses the
  # direct fused SwiGLU+gate/up dX kernel only for small row counts where it
  # beats the cat+cuBLAS path, and falls back to cat+cuBLAS otherwise.
  mlp_base: false
  mlp_base_dx: adaptive
  mlp_base_direct_dx_max_rows: 256
  # Opt-in wider frozen RMSNorm+MLP residual autograd boundary. This owns more
  # of the decoder layer tail than mlp_swiglu but must beat real fixed-step
  # profiling before it is considered for training.
  mlp_residual: false
  # Opt-in long-shape CUTE/CUTLASS-backed full frozen-MLP wrapper. This is
  # guarded internally by BGKIT_DECODER_MLP_QUACK_MIN_ROWS and remains
  # default-off until repeated real-step profiles beat the stock path.
  mlp_quack: false

data:
  commit_encoding_dir: ${oc.env:DATA_DIR}/processed/commit_encoding
  prompt_variants_dir: configs/prompt_variants
  # Bound content size at the dataset level to avoid 2h+ singleton stalls
  # observed at step 460 (sample 10858 reached L^2=46M ≈ 6800 tokens despite
  # max_sample_length=2000; commit_encoding's token_length filter is
  # per-file, not summed across files).
  max_diff_tokens_per_file: 1024
  max_files_per_commit: 4
  max_message_tokens: 256

# Halved from 8192 to bound singleton-emission cost on oversized samples
# (sampler's quadratic budget = max_batch_tokens × reference_seq_len).
max_batch_tokens: 4096
gradient_accumulation_steps: 8
min_sample_length: 256
max_sample_length: 1500

eval_every: 1000
save_every: 5000

# Diagnostic-cadence gate for survivorship metrics (.item() syncs).
diagnostic_metrics_every_n_steps: 10
