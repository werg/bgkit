# Commit encoding: two-level L0+L1 compression for commit reproduction
phase: phase1_step5
optimizer: muon
max_steps: 15000
lr: 3.0e-5
encoder_lr: 1.0e-5
decoder_lr: 5.0e-5
warmup_steps: 500
bidi_warmup_steps: 0       # already bidirectional from previous steps

# Ratio scheduling — already at target from Step 3; Step 4 adds L1 on top.
target_ratio_start: 0.10
target_ratio_end: 0.10
target_ratio_ramp_steps: 1

# Survivorship head losses, per level. Step 4 is where L1 first activates.
# L0 head is trained from Step 3 (no BCE re-warmup); L1 cold-starts here
# via decisiveness + utility-gradient BCE distillation.
survivorship:
  l0:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.0
    utility_grad_loss_weight: 0.3
    moment_match_weight: 0.05        # halved from Step 3; lighter anchor
    min_survivors_loss_weight: 0.05
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3
  l1:
    ratio_loss_weight: 0.0
    # L1 cold-start: hold a 4× stronger decisiveness signal for the first
    # 2k steps (the window in which utility-grad BCE is weakest — decoder
    # needs meaningful L1 output to produce useful gradients, but L1 needs
    # decoder gradient to know what's useful; a strong bimodal push here
    # breaks the chicken-and-egg tie). Linearly anneals down to the
    # steady-state weight so it doesn't fight utility-grad BCE once that's
    # doing the work. See docs/survivorship_design.md for the collapse
    # mode this defends against.
    decisiveness_loss_weight: 0.05   # symmetry-break — no BCE at L1
    decisiveness_warmup_weight: 0.20
    decisiveness_warmup_steps: 2000
    utility_grad_loss_weight: 0.3    # primary signal at L1
    moment_match_weight: 0.0         # ICE shape doesn't apply at L1
    min_survivors_loss_weight: 0.05
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3

ice_distillation:
  l0:
    enabled: false                   # L0 head already trained from Step 3
  l1:
    enabled: false                   # never ICE at L1

moment_match_reference:
  l0:
    path: ${oc.env:DATA_DIR}/diagnostics/ice_reference_moments.json
  l1:
    path: null

decoder_lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

freeze:
  bgkit: false
  decoder: false

data:
  commit_encoding_dir: ${oc.env:DATA_DIR}/processed/commit_encoding
  prompt_variants_dir: configs/prompt_variants
  max_diff_tokens_per_file: 4096
  max_files_per_commit: 16
  max_message_tokens: 256

# Packed-attention migration (wall-clock investigation 2026-04-21):
# Same fix as Step 3 — 32768/grad_accum=2 keeps effective batch at 65k tokens
# while flattening right-tail latency from tail microbatches (8 samples × L≈4096
# → 35 s/step at 65536/grad_accum=1 due to decoder splice ≈ 2× content length).
# See docs/wall_clock_investigation_2026_04_21.md.
max_batch_tokens: 32768
gradient_accumulation_steps: 2

eval_every: 1000
save_every: 5000
