# Commit encoding (Phase 1 Step 5): split-L0/L1 + L0-freeze curriculum.
# See plans/step5-l0-freeze-curriculum.md for the full spec.
phase: phase1_step5
optimizer: muon
max_steps: 15000
lr: 3.0e-5
encoder_lr: 1.0e-5
decoder_lr: 5.0e-5
warmup_steps: 500
bidi_warmup_steps: 0           # already bidirectional from previous steps

# ---- Three-stage curriculum (all live-tunable via control.json) ----
# Stage transitions (steps).
head_warmup_steps: 500          # stage 0 ends here — heads warm at ratio=1.0
stage1_end_step: 3500           # stage 1 ends here (3000 steps of L0 ramp)
stage2_l1_ramp_start_step: 3500 # L1 ratio ramp starts here
stage2_l1_ramp_end_step: 5500   # L1 ratio ramp finishes here

# L0 ratio curriculum (per-stage targets).
stage0_target_ratio_l0: 1.0     # stage 0: no L0 compression
stage1_l0_ratio_start: 0.9      # stage 1 L0 ramp start
stage1_l0_ratio_end: 0.15       # stage 1 L0 ramp end
stage2_target_ratio_l0: 0.30    # stage 2 L0 steady state

# L1 ratio curriculum (per-stage targets).
stage0_target_ratio_l1: 1.0     # stage 0: no L1 compression
stage1_target_ratio_l1: 1.0     # stage 1: L1 just learns to consume L0
stage2_target_ratio_l1_start: 1.0   # stage 2 L1 ramp start
stage2_target_ratio_l1_end: 0.33    # stage 2 L1 ramp end

# Per-stage sample-length / batch-token budgets (live-tunable).
# Stage 0/1 use a single primary dataloader rebuilt at stage entry.
stage0_max_sample_length: 1500  # head warmup — small commits only
stage1_max_sample_length: 2000  # moderate; L0 still keeps high fraction early
stage0_max_batch_tokens: 8192
stage1_max_batch_tokens: 8192

# Stage 2 dual-dataloader routing (frozen → large floodgates, unfrozen → tight).
stage2_l0_frozen_max_sample_length: 6000
stage2_l0_frozen_max_batch_tokens: 16384
stage2_l0_unfrozen_max_sample_length: 1500
stage2_l0_unfrozen_max_batch_tokens: 4096
stage2_l0_unfrozen_period: 8     # every 8th step is L0-unfrozen (~12.5%)

# ---- Compatibility — anchor sampling disabled per Step 4 lessons. ----
sample_target_ratio_during_training: false
target_ratio_anchor_sampling_prob: 0.0

# ---- Survivorship head losses (per-level) ----
survivorship:
  l0:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.0
    utility_grad_loss_weight: 0.3   # only effective on L0-unfrozen microbatches
    moment_match_weight: 0.05       # halved from Step 3; lighter anchor
    min_survivors_loss_weight: 0.05
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3
  l1:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.05  # symmetry-break — no BCE at L1
    decisiveness_warmup_weight: 0.20
    decisiveness_warmup_steps: 2000
    utility_grad_loss_weight: 0.3
    moment_match_weight: 0.0
    min_survivors_loss_weight: 0.05
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3

ice_distillation:
  l0:
    enabled: false
  l1:
    enabled: false

moment_match_reference:
  l0:
    path: ${oc.env:DATA_DIR}/diagnostics/ice_reference_moments.json
  l1:
    path: null

decoder_lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

freeze:
  bgkit: false
  decoder: false

data:
  commit_encoding_dir: ${oc.env:DATA_DIR}/processed/commit_encoding
  prompt_variants_dir: configs/prompt_variants
  max_diff_tokens_per_file: 4096
  max_files_per_commit: 16
  max_message_tokens: 256

# Initial primary-loader budget (stage 0 default; live curriculum drives it
# from stage 1 onward via stage{0,1,2}_max_batch_tokens overrides).
max_batch_tokens: 8192
gradient_accumulation_steps: 8
min_sample_length: 256
# Initial max_sample_length for stage 0 (curriculum overrides per stage).
max_sample_length: 1500

eval_every: 1000
save_every: 5000

# Diagnostic-cadence gate for survivorship metrics (.item() syncs).
diagnostic_metrics_every_n_steps: 10
