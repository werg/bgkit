# Phase 2 Step 3: MS MARCO with precomputed L0 survivors
phase: phase2
step: step3
optimizer: adamw
max_steps: 50000
warmup_steps: 2000
lr: 5.0e-5
decoder_lr: 2.0e-5
max_batch_tokens: 16384
eval_every: 2000
save_every: 10000
datasets:
  - msmarco_passage
# Precomputed L0 from Step 2 checkpoint encoding
use_precomputed_l0: true
l0_cache_dir: ${oc.env:DATA_DIR}/l0_cache/msmarco
freeze:
  decoder: false
  l0_compressor: true
curriculum:
  target_ratio_start: 0.05
  target_ratio_end: 0.01
  target_ratio_ramp_steps: 30000
topic_embeddings:
  enabled: true
  taxonomy_path: ${oc.env:DATA_DIR}/taxonomy/taxonomy.json
  positions_per_tag: 8
