# Phase 2 Step 3: MS MARCO with precomputed L0, live query-conditioned L1
phase: phase2
step: step3
optimizer: adamw
max_steps: 50000
warmup_steps: 2000
lr: 5.0e-5
decoder_lr: 2.0e-5
max_batch_tokens: 16384
eval_every: 2000
save_every: 10000
datasets:
  - msmarco_passage
# Precomputed L0 from Step 2 checkpoint encoding
use_precomputed_l0: true
l0_cache_dir: ${oc.env:DATA_DIR}/l0_cache/msmarco
# Live L1: query-conditioned compression of precomputed L0 survivors
l1:
  enabled: true
  ratio_start: 0.50
  ratio_end: 0.30
  ratio_ramp_steps: 20000
  fallback_threshold: 3.0
  calibrator_warmup_batches: 50
  calibrator_fast_batches: 200
  calibrator_ema_decay: 0.99
# Encoder still needed for L1 forward pass (even with precomputed L0)
phase1_checkpoint: auto
freeze:
  decoder: false
  l0_compressor: true
curriculum:
  l0_ratio_start: 0.10
  l0_ratio_end: 0.05
  l0_ratio_ramp_steps: 20000
topic_embeddings:
  enabled: true
  taxonomy_path: ${oc.env:DATA_DIR}/taxonomy/taxonomy.json
  positions_per_tag: 8
