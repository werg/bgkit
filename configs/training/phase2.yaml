# Phase 2: Knowledge Retrieval training
phase: phase2

# --- Step 1: Single-document extreme compression ---
# PubMedQA + NewsQA, retention ramp 0.10 -> 0.01, QA + reconstruction
step1:
  max_steps: 30000
  warmup_steps: 1000
  lr: 1.0e-4
  decoder_lr: 5.0e-5
  # Compression curriculum: push to extreme retention
  curriculum:
    target_ratio_start: 0.10
    target_ratio_end: 0.01
    target_ratio_ramp_steps: 15000
    max_survivor_gap: 128  # Relaxed for QA (positional coverage less critical)
    calibrator_warmup_batches: 200
    calibrator_ema_decay: 0.95
  # Loss weighting: QA ramps up, reconstruction ramps down
  loss_weights:
    qa_start: 0.3
    qa_end: 0.7
    reconstruction_start: 0.7
    reconstruction_end: 0.3
    loss_anneal_steps: 20000
  datasets:
    - pubmedqa
    - newsqa
  eval_every: 1000
  save_every: 5000

# --- Step 2: Multi-document L1 compression ---
# SearchQA (~50 snippets per query), freeze L0, train L1 + decoder
step2:
  max_steps: 20000
  warmup_steps: 1000
  lr: 1.0e-4
  decoder_lr: 5.0e-5
  freeze:
    ice: true
    l0_compressor: true  # Freeze L0, train L1 only
    projection_block: false
    decoder: false
  l1:
    max_positions: 2048  # ~50 snippets * 1 survivor each + metadata
  datasets:
    - searchqa
  eval_every: 1000
  save_every: 5000

# --- Step 3: Shared corpus retrieval at scale ---
# MS MARCO Passage (8.8M passages), pre-computed L0, query-aware batching
step3:
  max_steps: 50000
  warmup_steps: 2000
  lr: 5.0e-5
  decoder_lr: 2.0e-5
  freeze:
    ice: true
    l0_compressor: true
    projection_block: false
    decoder: false
  # L1 context scaling curriculum
  l1:
    max_positions_start: 1024     # Start with 1K distractors
    max_positions_end: 131072     # Scale to 128K
    position_ramp_steps: 30000
  datasets:
    - msmarco_passage
  # Pre-computed L0 embeddings path (set via .env or override)
  l0_cache_dir: ${DATA_DIR}/l0_cache/msmarco
  eval_every: 2000
  save_every: 10000

# --- Step 4: Long-document + large-scale multi-task KR ---
# NarrativeQA (long docs) + KILT (Wikipedia, 11 tasks)
step4:
  max_steps: 100000
  warmup_steps: 5000
  lr: 3.0e-5
  decoder_lr: 1.0e-5
  freeze:
    ice: true
    l0_compressor: true
    projection_block: false
    decoder: false
  l1:
    max_positions_start: 131072   # Start at 128K
    max_positions_end: 262144     # Scale to 262K
    position_ramp_steps: 50000
  datasets:
    - narrativeqa
    - kilt  # Multi-task: FEVER, NQ, HotpotQA, TriviaQA, ELI5, WoW, T-REx, etc.
  # Multi-task loss weighting (live-tunable)
  task_weights:
    narrativeqa: 0.20
    kilt_nq: 0.15
    kilt_hotpotqa: 0.15
    kilt_triviaqa: 0.15
    kilt_fever: 0.10
    kilt_eli5: 0.10
    kilt_wow: 0.05
    kilt_other: 0.10
  l0_cache_dir: ${DATA_DIR}/l0_cache/kilt
  eval_every: 2000
  save_every: 10000

# --- Track B: Git history knowledge retrieval ---
# Compress repo commit chains, answer developer questions about past changes
# Runs parallel to Track A Steps 2-4
git_kr:
  max_steps: 50000
  warmup_steps: 2000
  lr: 5.0e-5
  decoder_lr: 2.0e-5
  freeze:
    ice: true
    l0_compressor: true  # Freeze L0 after initial commit encoding
    projection_block: false
    decoder: false
  l1:
    max_positions: 32768  # 5-50 commits per chain * ~5 survivors/commit
  # QA task construction: LLM-generated questions from commit metadata
  qa_generation:
    question_types:
      - factual_recall    # "When did we switch from X to Y?"
      - rationale         # "Why did we revert the eager loading?"
      - diff_grounded     # "How is rate limiting implemented?"
      - cross_commit      # "What changed in module X over the last 5 commits?"
      - temporal          # "Was auth added before or after CORS?"
      - state_recall      # "What did file Y look like before the refactor?"
  datasets:
    - git_history  # Our 10K+ repo collection
  eval_every: 2000
  save_every: 10000

# --- Track C: User memory from conversations ---
# Compress multi-session dialogues, recall persona/events/preferences
# Runs parallel to Track A Steps 3-4
user_memory:
  max_steps: 50000
  warmup_steps: 2000
  lr: 5.0e-5
  decoder_lr: 2.0e-5
  freeze:
    ice: true
    l0_compressor: true
    projection_block: false
    decoder: false
  l1:
    max_positions: 16384  # 5-35 past sessions
  datasets:
    - msc             # 237K training examples + 130K summaries
    - share           # 119K utterances, 80K+ annotations (Apache 2.0)
    - chronicles      # 200K episodes x 5 sessions
    - perltqa         # 8.6K QA with memory classification
    - laps            # 11.2K preference key-value pairs
  # Task type sampling weights (live-tunable)
  task_weights:
    persona_recall: 0.25
    event_recall: 0.20
    preference_tracking: 0.20
    temporal_reasoning: 0.15
    knowledge_update: 0.10
    shared_memory: 0.10
  # Evaluation benchmarks
  eval_benchmarks:
    - longmemeval     # 500 Qs, up to 500 sessions (MIT)
    - locomo          # 50 conversations, 5 QA types
    - beam            # 100 conversations, 10 memory dimensions
  eval_every: 2000
  save_every: 10000

# --- Step 5: Target LLM injection ---
# Qwen3.5-35B with QLoRA, projection block extended to 2560 dim
# Draws from all three tracks (A, B, C)
step5:
  max_steps: 100000
  warmup_steps: 5000
  lr:
    lora: 2.0e-4
    projection_block: 1.0e-4
    bgkit_compressor: 1.0e-5  # Only if unfrozen
  freeze:
    ice: true
    bgkit_compressor: true  # Start frozen; compare against unfrozen
    projection_block: false
    decoder: false  # Co-trains as regularizer
    target_lm_base: true  # Base weights frozen (4-bit)
    target_lm_lora: false  # LoRA adapters train
  # Data mix from all three tracks
  data_mix:
    track_a_ir_benchmarks: 0.40   # KILT, MS MARCO, PubMedQA, etc.
    track_b_git_kr: 0.15          # Git history QA
    track_c_user_memory: 0.15     # Conversational memory recall
    reconstruction_regularizer: 0.05
    no_injection_fraction: 0.25
  # Reconstruction decoder regularizer
  decoder_regularizer:
    enabled: true
    weight: 0.1
    subset_fraction: 0.2
  eval_every: 2000
  save_every: 10000
