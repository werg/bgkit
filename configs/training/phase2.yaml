# Phase 2: Distillation and end-to-end injection training
phase: phase2

# --- Phase 2a: Model ladder distillation ---
# Distill Qwen3.5 2B/4B/9B -> 0.8B student with BgKIT context
phase2a:
  max_steps: 50000
  warmup_steps: 2000
  lr: 1.0e-4
  # KL weight annealing: start high (match teacher), anneal toward CE
  kl_weight_start: 0.9
  kl_weight_end: 0.5
  kl_anneal_steps: 30000
  # Teacher models (logprobs pre-computed offline)
  teacher_models:
    - Qwen/Qwen3.5-2B
    - Qwen/Qwen3.5-4B
    - Qwen/Qwen3.5-9B
  data_mix:
    injection_fraction: 0.70  # Tasks with BgKIT encodings
    no_injection_fraction: 0.30
  eval_every: 2000
  save_every: 10000

# --- Phase 2b: Trajectory distillation ---
# Reproduce agentic trajectories from progressively stronger teachers.
# Same ladder principle as 2a: a student learns better from a moderately
# stronger teacher than from a vastly stronger one. Stop climbing when
# the with-BgKIT vs without-BgKIT gap stops growing.
phase2b:
  max_steps: 50000  # per teacher stage
  warmup_steps: 2000
  lr: 5.0e-5
  # Progressive teacher ladder (trajectories pre-generated per stage)
  teacher_models:
    - Qwen/Qwen3.5-2B    # closest capability gap
    - Qwen/Qwen3.5-4B    # moderate gap
    - Qwen/Qwen3.5-9B    # wider gap; only if still improving
    - Qwen/Qwen3.5-35B   # only if ladder shows continued gains
  data_mix:
    injection_fraction: 0.70
    no_injection_fraction: 0.30
  eval_every: 2000
  save_every: 10000

# --- Phase 2c: End-to-end injection with target LLM ---
phase2c:
  max_steps: 100000
  warmup_steps: 5000
  # Learning rates (asymmetric)
  lr:
    lora: 2.0e-4
    projection_block: 1.0e-4
    bgkit_compressor: 1.0e-5  # Only if unfrozen
  # Data mix
  data_mix:
    injection_fraction: 0.65  # Tasks with BgKIT encodings
    description_regularizer: 0.05
    no_injection_fraction: 0.30
  # Curriculum: Tier 1/2 -> Tier 3
  curriculum:
    warmup_steps: 5000
    transition_steps: 50000
  # Freeze config (key experiment: frozen vs unfrozen compressor)
  freeze:
    ice: true
    bgkit_compressor: true  # Start frozen; compare against unfrozen
    projection_block: false  # Projection block continues training
    decoder: false  # Co-trains as regularizer
    target_lm_base: true  # Base weights frozen (4-bit)
    target_lm_lora: false  # LoRA adapters train
  # Reconstruction decoder regularizer
  decoder_regularizer:
    enabled: true
    weight: 0.1
    subset_fraction: 0.2  # Run decoder on 20% of examples
  eval_every: 2000
  save_every: 10000
