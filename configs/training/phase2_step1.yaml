# Phase 2 Step 1: Single-document QA compression (live L0)
phase: phase2
step: step1
optimizer: adamw
max_steps: 30000
warmup_steps: 1000
lr: 1.0e-4
encoder_lr: 5.0e-5
decoder_lr: 5.0e-5
max_batch_tokens: 16384
eval_every: 1000
save_every: 5000
datasets:
  - pubmedqa
  - newsqa
# Phase 1 checkpoint for encoder + ICE
phase1_checkpoint: auto
# Live L0: encoder adapts to QA objective
use_precomputed_l0: false
freeze:
  decoder: false
  l0_compressor: false
  projection_block: false
  encoder: false
curriculum:
  target_ratio_start: 0.10
  target_ratio_end: 0.01
  target_ratio_ramp_steps: 15000
# Optional reconstruction regularizer (weighted loss)
reconstruction_weight: 0.3
topic_embeddings:
  enabled: false
