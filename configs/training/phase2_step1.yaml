# Phase 2 Step 1: Single-document QA compression (live L0, no L1)
phase: phase2
step: step1
optimizer: adamw
max_steps: 20000
warmup_steps: 1000
lr: 1.0e-4
encoder_lr: 5.0e-5
decoder_lr: 5.0e-5
max_batch_tokens: 16384
eval_every: 1000
save_every: 5000
datasets:
  - pubmedqa
  - pubmedqa_artificial
  - newsqa
# Phase 1 checkpoint for encoder + ICE
phase1_checkpoint: auto
# Live L0: encoder adapts to QA objective
use_precomputed_l0: false
# No L1 in Step 1 — single-document, no cross-document compression needed
l1:
  enabled: false
freeze:
  decoder: false
  l0_compressor: false
  projection_block: false
  encoder: false
curriculum:
  l0_ratio_start: 0.15
  l0_ratio_end: 0.05
  l0_ratio_ramp_steps: 15000
reconstruction_weight: 0.3
topic_embeddings:
  enabled: false
