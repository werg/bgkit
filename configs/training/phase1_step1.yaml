# Phase 1 Step 1: Decoder initialization on uncompressed output
phase: phase1_step1
max_steps: 5000
lr: 1.0e-4
warmup_steps: 200
# No compression -- full BgKIT output passed to decoder
compression: false
# Freeze topmost transformer layer + lm_head; differential LR rising toward top
freeze_top_layer: true
lr_scale_bottom: 0.1
# Budget is based on chat-formatted token counts (decoder input size).
# Chat template adds ~257 tokens of overhead per sample.
# 128 GB unified memory fits ~16K tokens with Qwen3-0.6B decoder (152K vocab).
max_batch_tokens: 16384
gradient_accumulation_steps: 4    # 16K × 4 = 64K effective tokens per step
max_eval_samples: 2000
eval_every: 200
save_every: 1000
# Train projection block alongside decoder (bridge between compressor and decoder)
train_projection_block: true
projection_only_steps: 200     # warmup: train only projection before unfreezing decoder
projection_lr: null             # defaults to main lr
checkpoint_pruning:
  enabled: true
  keep_best: 3
  keep_latest: 2
  metric: eval/loss
early_stopping:
  enabled: true
  patience: 3           # stop after 3 evals without improvement
  min_delta: 0.01       # minimum loss improvement to reset patience
  metric: eval/loss     # which eval metric to track
eval:
  generation_samples: 50      # examples for generation metrics (expensive)
  generation_eval_every: 4    # run generation metrics every Nth eval
