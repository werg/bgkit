# Phase 1 Step 1: Decoder initialization + encoder unfreeze + compression curriculum
#
# Training phases (all on data reconstruction / content reproduction only):
#   0-200:       Projection block warmup (decoder frozen)
#   200-2000:    Decoder + projection training (encoder frozen, no compression)
#   2000:        Encoder unfreezes, bidirectional warmup begins
#   4000:        Compression introduced (ICE survivor selection)
#   4000-44000:  Compression ratio ramps from 0.50 → 0.25
#   44000-50000: Hold at 0.25 compression ratio
phase: phase1_step1
optimizer: muon
max_steps: 50000
lr: 1.0e-4               # base LR (used for projection block)
decoder_lr: 5.0e-5        # decoder gets lower LR (already well-initialized)
warmup_steps: 1000
compression: false         # initial state; compression introduced at compression_introduction_step
# Freeze topmost transformer layer + lm_head; differential LR rising toward top
freeze_top_layer: true
lr_scale_bottom: 0.1
# Budget is based on chat-formatted token counts (decoder input size).
# Chat template adds ~257 tokens of overhead per sample.
# 128 GB unified memory fits ~16K tokens with Qwen3.5-0.8B decoder (248K vocab).
max_batch_tokens: 16384
gradient_accumulation_steps: 4    # 16K × 4 = 64K effective tokens per step
max_eval_samples: 2000
eval_every: 500
save_every: 2000
# Train projection block alongside decoder (bridge between compressor and decoder)
train_projection_block: true
projection_only_steps: 200     # warmup: train only projection before unfreezing decoder
projection_lr: null             # defaults to main lr

# --- Encoder unfreeze curriculum ---
encoder_unfreeze_step: 2000     # when to unfreeze encoder compressor backbone
encoder_lr: 1.0e-4              # encoder LR (higher than decoder — encoder needs to learn compression)
bidi_warmup_steps: 2000         # duration of bidi warmup after encoder unfreeze

# --- Compression curriculum ---
compression_introduction_step: 4000   # when to start ICE survivor selection
ice:
  checkpoint_path: auto
  input_dim: 1024
  hidden_dim: 192
  num_layers: 3
  kernel_size: 5

curriculum:
  target_ratio_start: 0.50       # start gentle (keep 50% of tokens)
  target_ratio_end: 0.25         # ramp down to 25% retention
  target_ratio_ramp_steps: 40000 # ramp over 40k steps from compression intro
  max_survivor_gap: 64           # max positions without survivors (gap-filling)
  fallback_threshold: 3.0        # ICE score threshold until calibrator warms up
  calibrator_ema_decay: 0.99
  calibrator_warmup_batches: 50

checkpoint_pruning:
  enabled: true
  keep_best: 3
  keep_latest: 2
  metric: eval/loss
early_stopping:
  enabled: true
  patience: 5           # more patience for longer training
  min_delta: 0.005       # finer minimum improvement
  metric: eval/loss
qa_ratio: 0.0   # fraction of QA samples (0.0 = disabled, 0.3 = recommended with QA data)
eval:
  generation_samples: 50      # examples for generation metrics (expensive)
  generation_eval_every: 4    # run generation metrics every Nth eval
