# Phase 1 Step 1: Decoder + encoder + compression training
#
# Resumes from step 800 checkpoint with encoder immediately unfrozen
# and compression active from the start. Each training sample gets a
# random compression ratio drawn uniformly between the current min
# target ratio (ramped) and 1.0 (no compression), training the network
# on diverse retention levels.
phase: phase1_step1
optimizer: muon
max_steps: 50000
lr: 1.0e-4               # base LR (used for projection block)
decoder_lr: 5.0e-5        # decoder gets lower LR (already well-initialized)
warmup_steps: 1000
compression: false         # initial state; compression introduced at compression_introduction_step
# Freeze topmost transformer layer + lm_head; differential LR rising toward top
freeze_top_layer: true
lr_scale_bottom: 0.1
# Budget is based on chat-formatted token counts (decoder input size).
# Chat template adds ~257 tokens of overhead per sample.
# 128 GB unified memory fits ~16K tokens with Qwen3.5-0.8B decoder (248K vocab).
max_batch_tokens: 16384
gradient_accumulation_steps: 4    # 16K × 4 = 64K effective tokens per step
max_eval_samples: 2000
eval_every: 500
save_every: 500
# Train projection block alongside decoder (bridge between compressor and decoder)
train_projection_block: true
projection_only_steps: 200     # warmup: train only projection before unfreezing decoder
projection_lr: null             # defaults to main lr

# --- Encoder unfreeze curriculum ---
encoder_unfreeze_step: 800      # unfreeze immediately on resume (aligned with checkpoint step)
encoder_lr: 1.0e-4              # encoder LR (higher than decoder — encoder needs to learn compression)
bidi_warmup_steps: 2000         # duration of bidi warmup after encoder unfreeze

# --- Compression curriculum ---
compression_introduction_step: 800   # aligned with checkpoint step so ramp starts at 0.75

# Ratio scheduling
target_ratio_start: 0.75       # min ratio starts here (actual ratio drawn randomly per sample)
target_ratio_end: 0.10         # ramp min ratio down to 10% retention
target_ratio_ramp_steps: 3000  # ramp over 3k steps from compression intro (runtime controllable)

# Survivorship head auxiliary losses, per level. Step 1 only consumes l0;
# l1 included for forward compatibility with later steps.
#
# Step 1 is the COLDEST start in the entire pipeline. BCE warmup is long
# (4000 steps to match the original encoder-unfreeze + bidi-warmup window)
# so the head has plenty of signal before it must operate alone.
survivorship:
  soft_attn_every_n_steps: 1
  l0:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.0
    soft_attn_loss_weight: 0.2
    moment_match_weight: 0.1
  l1:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.05
    soft_attn_loss_weight: 0.3
    moment_match_weight: 0.0

ice_distillation:
  checkpoint_path: /workspace/checkpoints/ice_step89999_20260306_213825
  input_dim: 1024
  hidden_dim: 192
  num_layers: 3
  kernel_size: 5
  l0:
    enabled: true
    bce_warmup_weight: 0.5
    bce_warmup_steps: 4000          # long warmup — coldest start in pipeline
    teacher_ratio: 0.10
  l1:
    enabled: false

moment_match_reference:
  l0:
    path: ${oc.env:DATA_DIR}/diagnostics/ice_reference_moments.json
  l1:
    path: null

# Fresh wandb run for new training regime
reset_wandb: true

checkpoint_pruning:
  enabled: true
  keep_best: 3
  keep_latest: 2
  metric: eval/loss
early_stopping:
  enabled: false          # disabled — random compression ratios make eval loss noisy
qa_ratio: 0.0   # fraction of QA samples (0.0 = disabled, 0.3 = recommended with QA data)
eval:
  generation_samples: 50      # examples for generation metrics (expensive)
  generation_eval_every: 4    # run generation metrics every Nth eval
