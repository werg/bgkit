# Phase 2 Step 2: SearchQA with frozen L0, query-conditioned L1 introduced
phase: phase2
step: step2
optimizer: adamw
max_steps: 20000
warmup_steps: 1000
lr: 1.0e-4
encoder_lr: 5.0e-5
decoder_lr: 5.0e-5
max_batch_tokens: 16384
eval_every: 1000
save_every: 5000
datasets:
  - searchqa
phase1_checkpoint: auto
use_precomputed_l0: false
# L1 introduced: L0 frozen, L1 compresses L0 survivors with query as prompt
l1:
  enabled: true
  ratio_start: 0.60
  ratio_end: 0.40
  ratio_ramp_steps: 10000
  fallback_threshold: 3.0
  calibrator_warmup_batches: 50
  calibrator_fast_batches: 200
  calibrator_ema_decay: 0.99
freeze:
  decoder: false
  l0_compressor: true  # L0 frozen for L1 stability
  projection_block: false
  encoder: false
curriculum:
  l0_ratio_start: 0.10
  l0_ratio_end: 0.05
  l0_ratio_ramp_steps: 10000
topic_embeddings:
  enabled: false
