phase: phase1_falcon_l0
optimizer: muon
# Phase D: slow compression ramp from no-compression (1.0) to the
# target retention ratio (0.10) over many thousands of steps.
# Resumes from phase1_falcon_l0_align where the decoder learned to
# reconstruct from the uncompressed projection output. The head was
# trained against the forced mask during forced_adapt; it has been
# dormant through l0_align (ratio=1.0 bypasses the head) and its
# weights still reflect the forced selection. As compression turns on
# the head's natural choice should approximate the forced mask, giving
# the decoder a smooth runway.
#
# The Falcon-H1 Tiny decoder is much smaller (90M) than Qwen3.5-0.8B,
# so the ramp is generous — 5k steps held at 1.0 → 0.50 (gentle
# introduction), then 10k more 0.50 → 0.10, then 5k holding at 0.10.
max_steps: 20000
lr: 5.0e-5
encoder_lr: 2.0e-5
decoder_lr: 6.0e-5
warmup_steps: 500
bidi_warmup_steps: 0
max_batch_tokens: 6144
gradient_accumulation_steps: 8
min_sample_length: 256
max_sample_length: 800
max_eval_samples: 1000
eval_every: 1000
save_every: 2000

# Head takes over here: encoder's natural selection is used (no
# forced-mask override). Head was BCE-trained to predict forced in
# Phase C, so its initial selection ≈ forced positions; the curriculum
# then tightens compression below that baseline. The continuing
# forced_survivor_bce_weight below keeps the head from drifting.
use_forced_survivor_mask_l0: false

sampler:
  cost_multiplier: 1.0
  eval_cost_multiplier: 1.0

objectives:
  data_reconstruction: 1.0

# Slow compression curriculum: linear ramp 1.0 → 0.10 over 15k steps.
# Combined with the held tail at 0.10 for the remaining 5k.
# Curriculum starts at the forced-mask baseline (~0.6 = typical fraction
# of well-aligned forced positions) so Phase D picks up where Phase C
# left off. The head selects naturally (use_forced_survivor_mask_l0=false
# below) — it was trained in Phase C to predict forced positions, so its
# initial selection should approximate the forced subset, and the
# curriculum tightens compression *beyond* that baseline.
target_ratio_start: 0.6
target_ratio_end: 0.10
target_ratio_ramp_steps: 15000
sample_target_ratio_during_training: true
target_ratio_sampling_mode: window
target_ratio_sampling_window_above: 0.05
target_ratio_anchor_sampling_prob: 0.0
l1_introduction_step: 999999999

survivorship:
  l0:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.05
    utility_grad_loss_weight: 0.3
    moment_match_weight: 0.05
    min_survivors_loss_weight: 0.05
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3
    # Head re-alignment during the compression ramp. The Falcon companion's
    # forced_survivor mask threads through CompressionDataset → collator
    # → trainer → compute_survivorship_losses, where it BCE-supervises
    # the head's base_raw against the forced selection. Keeps the head's
    # natural choice matched to the well-aligned tokenizer-pair positions
    # the projection/decoder were trained against, so the start of
    # compression is smooth for the decoder. Live-tunable via
    # ``forced_survivor_bce_weight_l0``; auto-gated by target_ratio /
    # ``forced_survivor_bce_anchor_ratio`` so the weight fades as the
    # curriculum tightens below the forced fraction.
    forced_survivor_bce_weight: 1.0
  l1:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.0
    utility_grad_loss_weight: 0.0
    moment_match_weight: 0.0
    min_survivors_loss_weight: 0.0

ice_distillation:
  l0:
    enabled: false
  l1:
    enabled: false

moment_match_reference:
  l0:
    path: ${oc.env:DATA_DIR}/diagnostics/ice_reference_moments.json
  l1:
    path: null

decoder_lora:
  # Falcon-H1 Tiny is small enough to full-finetune, and PEFT LoRA rejects
  # Falcon/Mamba targets such as out_proj. Keep decoder LoRA off for Falcon.
  enabled: false
  implementation: peft
  r: 16
  alpha: 32
  dropout: 0.0
  peft_fused_backward: true

freeze:
  bgkit: false
  decoder: false

data:
  file_tokens_path: ${oc.env:DATA_DIR}/processed/tokens
  falcon_companion_dir: ${oc.env:DATA_DIR}/processed/tokens_falcon_h1
  prompt_variants_dir: configs/prompt_variants
  tokens:
    max_seq_len: 8192

model:
  decoder:
    family: falcon_h1
    backbone_name: tiiuae/Falcon-H1-Tiny-90M-Instruct
    hidden_dim: 512
