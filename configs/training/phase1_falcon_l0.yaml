phase: phase1_falcon_l0
optimizer: muon
# Phase D: head-driven compression. Resumes from phase1_falcon_l0_align
# where the head learned asymmetric "doom-the-bogus" BCE (target=0 at
# non-forced positions only, no supervision at forced positions). The
# encoder no longer overrides selection (``use_forced_survivor_mask_l0:
# false``); the head selects organically. The companion's
# forced_survivor_mask is still threaded into the batch and consumed by
# the survivorship BCE — at any ratio ≤ forced fraction (~0.6) the head
# is mathematically guaranteed to keep dooming non-forced positions
# while utility-grad ranks within the forced set. The forced fraction
# therefore acts as a soft upper bound (ratio>0.6 would force the head
# to accept some bogus positions, which we do NOT do).
max_steps: 40000
lr: 5.0e-5
encoder_lr: 2.0e-5
decoder_lr: 6.0e-5
warmup_steps: 500
bidi_warmup_steps: 0
max_batch_tokens: 6144
gradient_accumulation_steps: 8
min_sample_length: 256
max_sample_length: 800
max_eval_samples: 1000
eval_every: 1000
save_every: 2000

# Head takes over here: encoder's natural selection is used (no
# forced-mask override). Head was BCE-trained to predict forced in
# Phase C, so its initial selection ≈ forced positions; the curriculum
# then tightens compression below that baseline. The continuing
# forced_survivor_bce_weight below keeps the head from drifting.
use_forced_survivor_mask_l0: false

sampler:
  cost_multiplier: 1.0
  eval_cost_multiplier: 1.0

objectives:
  data_reconstruction: 1.0

# Slow compression curriculum: ramp from the forced-fraction baseline
# (0.6) down to the final target retention (0.10) over 30k steps, then
# hold at 0.10 for the remaining 10k. The head's asymmetric BCE
# (carried forward from Phase C) guarantees the selection stays inside
# the forced set throughout; utility-grad BCE sub-selects within the
# forced set. The slow ramp gives the head time to adapt at each
# ratio so the decoder never sees a sudden distribution shift.
target_ratio_start: 0.6
target_ratio_end: 0.10
target_ratio_ramp_steps: 30000
sample_target_ratio_during_training: true
target_ratio_sampling_mode: window
target_ratio_sampling_window_above: 0.05
target_ratio_anchor_sampling_prob: 0.0
l1_introduction_step: 999999999

survivorship:
  l0:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.05
    utility_grad_loss_weight: 0.3
    moment_match_weight: 0.05
    min_survivors_loss_weight: 0.05
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3
    # Asymmetric "doom-the-bogus" head BCE (target=0 at non-forced
    # positions, no supervision at forced). Always-on — the signal is
    # ratio-independent. Live-tunable via ``forced_survivor_bce_weight_l0``.
    # Utility-grad BCE (above, weight=0.3) sub-selects within the forced
    # set: ranks forced positions by their downstream effect on decoder
    # loss, gives the head a learnable target as ratio tightens below
    # the forced fraction.
    forced_survivor_bce_weight: 1.0
  l1:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.0
    utility_grad_loss_weight: 0.0
    moment_match_weight: 0.0
    min_survivors_loss_weight: 0.0

ice_distillation:
  l0:
    enabled: false
  l1:
    enabled: false

moment_match_reference:
  l0:
    path: ${oc.env:DATA_DIR}/diagnostics/ice_reference_moments.json
  l1:
    path: null

decoder_lora:
  # Falcon-H1 Tiny is small enough to full-finetune, and PEFT LoRA rejects
  # Falcon/Mamba targets such as out_proj. Keep decoder LoRA off for Falcon.
  enabled: false
  implementation: peft
  r: 16
  alpha: 32
  dropout: 0.0
  peft_fused_backward: true

freeze:
  bgkit: false
  decoder: false

data:
  file_tokens_path: ${oc.env:DATA_DIR}/processed/tokens
  falcon_companion_dir: ${oc.env:DATA_DIR}/processed/tokens_falcon_h1
  prompt_variants_dir: configs/prompt_variants
  tokens:
    max_seq_len: 8192

model:
  decoder:
    family: falcon_h1
    backbone_name: tiiuae/Falcon-H1-Tiny-90M-Instruct
    hidden_dim: 512
