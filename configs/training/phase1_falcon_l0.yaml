phase: phase1_falcon_l0
optimizer: muon
muon_ns_steps: 1
# Phase D: joint Falcon/BgKIT training. Resumes from phase1_falcon_l0_align,
# where the head/projection learned the Falcon forced-alignment stream. The
# encoder no longer overrides selection (``use_forced_survivor_mask_l0:
# false``); the head selects organically while the decoder adapts to the
# Falcon splice stream.
max_steps: 40000
lr: 5.0e-5
encoder_lr: 2.0e-5
decoder_lr: 6.0e-5
warmup_steps: 500
bidi_warmup_steps: 0
max_batch_tokens: 6144
gradient_accumulation_steps: 8
decoder_only_fastpath: false
decoder_only_l0_prefix_cache: false
decoder_only_l0_prefix_cache_max_gb: 8.0
decoder_only_l0_prefix_cache_device: cuda
decoder_only_selection_mode: exact_topk
min_sample_length: 256
max_sample_length: 800
max_eval_samples: 1000
eval_every: 1000
save_every: 2000

# Symmetric BCE on `base_raw` produces large auxiliary gradients
# (forced_survivor_bce sits around 7 at initialization because head
# logits at forced positions are deeply negative from l0_align). The
# resulting grad_norm runs ~100, which the default clip=1.0 squashes
# to ~1% per step — head can't move. Raise clip to 10 so the BCE
# direction survives while still catching genuine spikes.
max_grad_norm: 10.0

# Transition mode (2026-05-26 fix): the previous l0 design assumed the
# asymmetric "doom-the-bogus" BCE in forced_adapt/l0_align had implicitly
# taught the head to predict forced positions positive. It did not — the
# asymmetric BCE only suppressed non-forced (target=0); forced positions
# were unsupervised and the head's `use_forced_survivor_mask=true` path
# bypassed the head's output entirely, so the head never actually learned
# the positive class. Starting l0 with the mask off resulted in a
# degenerate state (actual_ratio 0.6% vs target 60%, theta pinned at floor,
# undecided_fraction 1.0).
#
# Fix: keep the forced mask ON at the start of l0, but switch the BCE to
# SYMMETRIC (target=1 on forced AND target=0 on non-forced). The head now
# learns to organically reproduce the forced selection while the encoder
# safely runs with the correct mask. Once forced_survivor_bce drops near
# zero AND the head's organic ratio approaches the forced fraction
# (~0.55), flip `use_forced_survivor_mask_l0` to false via control.json
# to enter true compression mode.
use_forced_survivor_mask_l0: true

sampler:
  cost_multiplier: 1.0
  eval_cost_multiplier: 1.0

objectives:
  data_reconstruction: 1.0

# Slow compression curriculum: ramp from the forced-fraction baseline
# (0.6) down to the final target retention (0.10) over 30k steps, then
# hold at 0.10 for the remaining 10k. This keeps joint head/projection/
# decoder training from seeing a sudden distribution shift.
target_ratio_start: 0.6
target_ratio_end: 0.10
target_ratio_ramp_steps: 30000
sample_target_ratio_during_training: true
target_ratio_sampling_mode: window
target_ratio_sampling_window_above: 0.05
target_ratio_anchor_sampling_prob: 0.0
l1_introduction_step: 999999999

survivorship:
  l0:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.05
    utility_grad_loss_weight: 0.3
    moment_match_weight: 0.05
    min_survivors_loss_weight: 0.05
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3
    forced_survivor_bce_weight: 1.0
    # Symmetric BCE: target=1 at forced positions AND target=0 at
    # non-forced. Replaces the asymmetric "doom-the-bogus" supervision
    # — see use_forced_survivor_mask_l0 above for the rationale.
    forced_survivor_bce_symmetric: true
  l1:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.0
    utility_grad_loss_weight: 0.0
    moment_match_weight: 0.0
    min_survivors_loss_weight: 0.0

ice_distillation:
  l0:
    enabled: false
  l1:
    enabled: false

moment_match_reference:
  l0:
    path: ${oc.env:DATA_DIR}/diagnostics/ice_reference_moments.json
  l1:
    path: null

decoder_lora:
  # Falcon-H1 Tiny is small enough to full-finetune, and PEFT LoRA rejects
  # Falcon/Mamba targets such as out_proj. Keep decoder LoRA off for Falcon.
  enabled: false
  implementation: peft
  r: 16
  alpha: 32
  dropout: 0.0
  peft_fused_backward: true

freeze:
  bgkit: false
  decoder: false

data:
  # file_tokens_path + falcon_companion_dir come from training.data defaults
  # in configs/config.yaml (processed_v2/tokens + processed_v2/tokens_falcon_h1).
  prompt_variants_dir: configs/prompt_variants
  tokens:
    max_seq_len: 8192

model:
  decoder:
    family: falcon_h1
    backbone_name: tiiuae/Falcon-H1-Tiny-90M-Instruct
    hidden_dim: 512
  # Falcon-specific anchor grid: cap at 0.60. Survivor fractions above
  # ~60% are net-harmful for the Falcon-H1 Tiny decoder (more spurious
  # context inflates footprint and dilutes signal). The legacy
  # anchors at 0.64 / 0.95 were unreachable under the 0.6→0.1
  # curriculum and left untrained θ values that produced post-resume
  # keep-rate spikes whenever the curriculum interpolation reached
  # them. Migration of legacy 7-anchor checkpoints is automatic via
  # ``remap_threshold_controller_state`` in ``_restore_model_state``.
  threshold_controller:
    anchor_ratios: [0.02, 0.04, 0.08, 0.16, 0.32, 0.60]
