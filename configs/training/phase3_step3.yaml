# Phase 3 Step 3: Distillation on Qwen3.5-35B target (QLoRA)
phase: phase3
step: step3
optimizer: adamw
max_steps: 50000
warmup_steps: 3000
lr: 2.0e-4
max_batch_tokens: 16384
eval_every: 2000
save_every: 10000
# Teacher: Qwen3-Coder-480B trajectories
no_injection_fraction: 0.30
phase2_checkpoint: auto
bgkit_cache_dir: ${oc.env:DATA_DIR}/swe_embeddings
# Target LLM
target_lm:
  backbone_name: Qwen/Qwen3.5-35B
  quantization: 4bit
  lora_rank: 64
  lora_alpha: 128
