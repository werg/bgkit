phase: phase2_kb
stage: A
optimizer: adamw
warmup_steps: 500
lr: 1.0e-4
decoder_lr: 5.0e-5
l0_lr: 2.0e-4
l1_lr: 2.0e-4
eval_every: 500
save_every: 2000

# Run an extra eval pass at each cadence with survivors zeroed (no
# BgKIT knowledge reaches the decoder). The gap between
# ``eval/loss`` and ``eval/ablation/zeroed/loss`` (and EM, F1, etc.)
# is the BgKIT contribution. ``noise`` would tell us whether the
# decoder uses the actual signal vs just "context exists"; skipped
# here to keep eval wall-clock bounded.
eval_ablation_modes:
  - zeroed
max_steps: null
batch_size: 4

# OOM mitigation on the 79 GB cuda-mem-guard cap. Full Qwen-0.8B encoder +
# Falcon-H1-90M decoder + projection_block activations at batch_size=4 do
# not fit without gradient checkpointing on both stacks.
activation_checkpointing:
  encoder: true
  decoder: true

datasets:
  - pubmedqa
  - narrativeqa
  - memory
# git_history requires the vLLM-based generate_git_qa.py pipeline (10-20 GPU
# hours on 10k repos) — deferred to Stage B since the bootstrap mix already
# spans 247k (dataset, article) pairs across pubmedqa + narrativeqa + memory.

max_samples_per_dataset_default: 1500
live_l0: true

l0_retention:
  kilt_wikipedia: 0.05
  pubmedqa: 0.20
  narrativeqa: 0.20
  newsqa: 0.10
  git_history: 0.20
  memory: 0.40

l1_retention: 0.15

l0_retention_jitter:
  enabled: true
  mode: jitter
  jitter_abs: 0.01
  jitter_rel: 0.10
  anchor_sampling_prob: 0.30

l1_retention_jitter:
  enabled: true
  mode: jitter
  jitter_abs: 0.01
  jitter_rel: 0.10
  anchor_sampling_prob: 0.30

lora:
  # Falcon-family Phase 2 uses direct encoder training. Encoder LoRA adds
  # adapter indirection and checkpoint/cache provenance complexity without a
  # clear benefit on this path.
  enabled: false
  train_l1_direct: true
  l0_rank: 32
  l1_rank: 32
  alpha: 64
  dropout: 0.0

survivorship:
  # Phase 2 (KRKBTrainer): selection is the least-important signal (reps are
  # distributed; the pre-trained head already selects decent candidates), so
  # ALL survivorship aux is OFF — head frozen, no _pending retention, only the
  # main reconstruction loss + the (still-on) dual-ascent θ control. The
  # per-level weights below are inert under this flag (kept for re-enable).
  survivorship_aux: false
  relevance_loss_weight: 0.05
  relevance_gold_boost: 1.5
  relevance_distractor_damp: 0.5
  n_distractors: 3
  ratio_loss_weight: 0.1
  decisiveness_loss_weight: 0.05
  l0:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.0
    utility_grad_loss_weight: 0.3
    moment_match_weight: 0.05
    min_survivors_loss_weight: 0.05
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3
  l1:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.05
    utility_grad_loss_weight: 0.3
    moment_match_weight: 0.0
    min_survivors_loss_weight: 0.05
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3

ice_distillation:
  l0:
    enabled: false
  l1:
    enabled: false

moment_match_reference:
  l0:
    path: ${oc.env:DATA_DIR}/diagnostics/ice_reference_moments.json
  l1:
    path: null

# Explicit pin: registry "best by eval/loss" for phase1_falcon_l0 still
# resolves to the pre-rebuild step2000 (older training run with stale eval
# numbers), but the L0 cache was precomputed against step10000 — autoresolve
# would mismatch the cache_manifest and crash.
phase1_checkpoint: /workspace/checkpoints/phase1_falcon_l0_step10000_20260521_071410

model:
  decoder:
    family: falcon_h1
    backbone_name: tiiuae/Falcon-H1-Tiny-90M-Instruct
    hidden_dim: 512
  # Falcon-specific anchor cap (matches Phase 1 Falcon configs). Without
  # this, the encoder is built with the 7-anchor Qwen schedule and
  # state_dict load fails with size mismatch on l{0,1}.threshold.anchor_*.
  threshold_controller:
    anchor_ratios: [0.02, 0.04, 0.08, 0.16, 0.32, 0.60]
