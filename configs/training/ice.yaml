# ICE training configuration
phase: ice
max_steps: 30000
lr: 3.0e-4
warmup_steps: 1000
# Uniform-output regularizer on random embeddings: log-spacing loss
# rewards uniformly distributed scores on OOD inputs
uniform_output_reg_weight: 0.0005
eval_every: 2000
save_every: 2000
max_batch_tokens: 65536
max_eval_samples: 10000
checkpoint_pruning:
  enabled: true
  keep_best: 3
  keep_latest: 2
  metric: eval/mse
