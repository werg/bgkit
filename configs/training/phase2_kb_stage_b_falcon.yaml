phase: phase2_kb
stage: B
optimizer: adamw
max_steps: 60000
warmup_steps: 1000
lr: 1.0e-4
decoder_lr: 5.0e-5
l1_lr: 2.0e-4
eval_every: 1000
save_every: 5000
batch_size: 4
max_microbatch_l0_survivors: 8192
max_microbatch_samples: 8

datasets:
  - kilt_wikipedia
  - pubmedqa
  - narrativeqa
  - git_history
  - memory
  - newsqa
  - msmarco_passage
  - searchqa

live_l0: false
l0_cache_dir: ${oc.env:DATA_DIR}/l0_cache_kb

l0_retention:
  kilt_wikipedia: 0.05
  pubmedqa: 0.20
  narrativeqa: 0.20
  newsqa: 0.10
  msmarco_passage: 0.40
  searchqa: 0.40
  git_history: 0.20
  memory: 0.40

l1_retention: 0.15

l0_retention_jitter:
  enabled: false
  mode: jitter
  jitter_abs: 0.01
  jitter_rel: 0.10
  anchor_sampling_prob: 0.30

l1_retention_jitter:
  enabled: true
  mode: jitter
  jitter_abs: 0.01
  jitter_rel: 0.10
  anchor_sampling_prob: 0.30

lora:
  # Falcon-family Phase 2 uses direct encoder training. Stage B keeps L0
  # cached/frozen and trains L1 directly instead of through encoder LoRA.
  enabled: false
  train_l1_direct: true
  l0_rank: 32
  l1_rank: 32
  alpha: 64
  dropout: 0.0

survivorship:
  # Phase 2 (KRKBTrainer): selection is the least-important signal (reps are
  # distributed; the pre-trained head already selects decent candidates), so
  # ALL survivorship aux is OFF — head frozen, no _pending retention, only the
  # main reconstruction loss + the (still-on) dual-ascent θ control. The
  # per-level weights below are inert under this flag (kept for re-enable).
  survivorship_aux: false
  relevance_loss_weight: 0.05
  relevance_gold_boost: 1.5
  relevance_distractor_damp: 0.5
  n_distractors: 3
  ratio_loss_weight: 0.1
  decisiveness_loss_weight: 0.05
  l0:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.0
    utility_grad_loss_weight: 0.0
    moment_match_weight: 0.0
    min_survivors_loss_weight: 0.0
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3
  l1:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.05
    utility_grad_loss_weight: 0.3
    moment_match_weight: 0.0
    min_survivors_loss_weight: 0.05
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3

ice_distillation:
  l0:
    enabled: false
  l1:
    enabled: false

moment_match_reference:
  l0:
    path: null
  l1:
    path: null

# Must match phase2_kb_stage_a_falcon and cache precompute exactly.
phase1_checkpoint: /workspace/checkpoints/phase1_falcon_l0_step10000_20260521_071410
stage_a_checkpoint: auto

model:
  decoder:
    family: falcon_h1
    backbone_name: tiiuae/Falcon-H1-Tiny-90M-Instruct
    hidden_dim: 512
