phase: phase1_falcon_forced_adapt
optimizer: adamw
max_steps: 2500
lr: 1.0e-4
projection_lr: 1.0e-4
encoder_lr: 2.0e-5
warmup_steps: 100
# Matches phase1_step5's quadratic budget. The original 16384 was 16x
# Step 5's effective work per batch with no measured justification.
max_batch_tokens: 4096
# Eval batches were 2x train (8192); under the 3-layer projection memory
# pressure they push past the CUDA cap right before the next train step
# OOMs. Match eval to train so eval doesn't move the memory ceiling.
max_batch_tokens_eval: 4096
gradient_accumulation_steps: 2
max_eval_samples: 1000
eval_every: 100
save_every: 500

adapt_encoder: true

# Cap content length so the full Qwen3.5 bidi encoder backbone (now trainable
# with autograd retained) doesn't blow the 65% per-process CUDA budget on
# long-tail chunks. With the 3-layer projection_block adding ~37M params
# plus Adam state, 4096 OOMs; 3072 still OOMs intermittently on solo
# long-chunk batches; 2048 leaves clear headroom.
max_sample_length: 2048
min_sample_length: 32

data:
  falcon_companion_dir: ${oc.env:DATA_DIR}/processed/tokens_falcon_h1
  # The Falcon companion was built at max_seq_len=8192; the base
  # MmapTokenDataset must mirror that so per-chunk indices align.
  tokens:
    max_seq_len: 8192

anchor_weight: 1.0
cos_weight: 0.5
norm_weight: 0.2
survivor_bce_weight: 0.2

checkpoint_pruning:
  enabled: true
  keep_best: 3
  keep_latest: 2
  metric: eval/loss

model:
  decoder:
    family: falcon_h1
    backbone_name: tiiuae/Falcon-H1-Tiny-90M-Instruct
    hidden_dim: 512
