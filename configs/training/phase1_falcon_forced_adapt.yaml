phase: phase1_falcon_forced_adapt
optimizer: adamw
max_steps: 1500
lr: 1.0e-4
projection_lr: 1.0e-4
encoder_lr: 2.0e-5
warmup_steps: 100
max_batch_tokens: 16384
gradient_accumulation_steps: 2
max_eval_samples: 1000
eval_every: 100
save_every: 500

adapt_encoder: true

data:
  falcon_companion_dir: ${oc.env:DATA_DIR}/processed/tokens_falcon_h1

anchor_weight: 1.0
cos_weight: 0.5
norm_weight: 0.2
survivor_bce_weight: 0.2

checkpoint_pruning:
  enabled: true
  keep_best: 3
  keep_latest: 2
  metric: eval/loss

model:
  decoder:
    family: falcon_h1
    backbone_name: tiiuae/Falcon-H1-Tiny-90M-Instruct
    hidden_dim: 512
