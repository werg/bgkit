# Phase 2 KB-scale Stage B: full-corpus training (merged with the
# old Stage C — we no longer ship a separate Stage C config).
#
# L0 LoRA frozen (the Stage A result); L1 LoRA + decoder train. L0
# survivors come from a pre-computed cache built by
# scripts/precompute_l0_subset.py with --stage-a-checkpoint pointing at
# the trained Stage A checkpoint.
#
# Memory safety: container runs with mem_limit: 80g + memswap_limit: 80g
# (docker/docker-compose.yaml gpu-common anchor), and the peer-CUDA
# safety check in BaseTrainer refuses to start if total CUDA usage
# would exceed 90% of BGKIT_CUDA_MEM_FRACTION (default 0.65 = 83 GB).
# Together these prevent host OOM on the 128 GB unified-memory DGX Spark.
phase: phase2_kb
stage: B
optimizer: adamw
max_steps: 60000
warmup_steps: 1000
lr: 1.0e-4
decoder_lr: 5.0e-5
l1_lr: 2.0e-4
eval_every: 1000
save_every: 5000

# Phase 2 trajectory batches are far heavier per sample than Phase 1
# packed-token batches: each KBSample triggers 3-4 encoder bucket
# forwards + a per-sample decoder forward. The root config.yaml default
# of 32 is designed for Phase 1 token-budget samplers and will OOM here.
# Stage B has a larger corpus and cached L0 (no live encoder forward for
# L0) — slightly cheaper per step than Stage A — but the L1 encoder
# forward + decoder forward profile is similar.
# batch_size=4 is a conservative baseline pending a profiler run with
# the profile-phase2-kb-stage-b compose service (mem_limit: 80g).
# Raise to 8 once Stage A profiler confirms headroom.
batch_size: 4

datasets:
  - kilt_wikipedia
  - pubmedqa
  - narrativeqa
  - git_history
  - memory
  - newsqa
  - msmarco_passage
  - searchqa

# No top_tag_whitelist — Stage B is the full-scale stage. If you want
# to run a smaller subset for debugging, add a whitelist here.

live_l0: false
l0_cache_dir: ${oc.env:DATA_DIR}/l0_cache_kb

l0_retention:
  kilt_wikipedia: 0.05
  pubmedqa: 0.20
  narrativeqa: 0.20
  newsqa: 0.10
  msmarco_passage: 0.40
  searchqa: 0.40
  git_history: 0.20
  memory: 0.40

# L1 retention drives how much *additional* compression L1 applies on
# top of the per-article L0 survivors. Pinned article-ID tokens always
# survive; this controls non-pinned positions. 0.10-0.20 keeps L1 doing
# real compression. Tightened from 0.50 historical default.
l1_retention: 0.15

lora:
  l0_rank: 32
  l1_rank: 32
  alpha: 64
  dropout: 0.0

# Survivorship head auxiliary losses. Stage B: L0 is cached + L0 LoRA
# frozen, so L0 survivorship losses are zeroed and the trainer skips L0
# θ/μ updates in post-step. L1 continues from Stage A's cold-start.
survivorship:
  relevance_loss_weight: 0.05
  relevance_gold_boost: 1.5
  relevance_distractor_damp: 0.5
  n_distractors: 3
  ratio_loss_weight: 0.1
  decisiveness_loss_weight: 0.05

  # L0 frozen — all weights zero; trainer skips L0 θ/μ updates.
  l0:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.0
    utility_grad_loss_weight: 0.0
    moment_match_weight: 0.0
    min_survivors_loss_weight: 0.0          # L0 frozen — no gradient to push
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3
  l1:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.05
    utility_grad_loss_weight: 0.3
    moment_match_weight: 0.0
    min_survivors_loss_weight: 0.05
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3

ice_distillation:
  l0:
    enabled: false            # L0 frozen (Stage A baked LoRA into cache)
  l1:
    enabled: false

moment_match_reference:
  l0:
    path: null
  l1:
    path: null

phase1_checkpoint: auto
# stage_a_checkpoint: auto  # uncomment once Stage A has produced a
# best-checkpoint registry entry; the precompute script needs this to
# bake Stage A's L0 LoRA into the cache.
