# Phase 1 Step 2: Compression training (4 objectives, curriculum)
phase: phase1_step2
max_steps: 200000
lr: 5.0e-5
warmup_steps: 5000

objectives:
  data_reconstruction: 0.40
  description_generation: 0.20
  structural_relational: 0.15
  commit_reproduction: 0.25

ice:
  checkpoint_path: null  # must be set to a retrained ICE checkpoint
  input_dim: 1024
  hidden_dim: 128
  num_layers: 2
  kernel_size: 5

curriculum:
  l1_introduction_step: 20000
  # Ratio targeting (replaces ice_threshold_start/end/ramp_steps)
  target_ratio_start: 0.30
  target_ratio_end: 0.15
  target_ratio_ramp_steps: 100000
  max_survivor_gap: 64
  fallback_threshold: 3.0       # used before calibrator warms up
  calibrator_ema_decay: 0.99
  calibrator_warmup_batches: 50
  l1_calibrator_fast_batches: 200

decoder:
  drift_threshold: 0.5
  drift_check_every: 5000

freeze:
  bgkit: false
  decoder: false

data:
  file_tokens_path: data/mmap/tokens/
  commit_tokens_path: data/mmap/commits/
  description_tokens_path: data/mmap/descriptions/
  structural_tokens_path: data/mmap/structural/
  prompt_variants_dir: data/prompt_variants/

eval:
  generation_samples: 8
  generation_every_n_evals: 4

eval_every: 2000
save_every: 10000
