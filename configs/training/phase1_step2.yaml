# Phase 1 Step 2: DeltaNet pruning distillation
#
# Distills the full encoder into a pruned version with DeltaNet layers
# removed. Uses staged unfreezing with boundary MSE, auto-repro,
# projection, and cosine losses.
phase: phase1_step2
optimizer: muon
max_steps: 40000
lr: 5.0e-5
warmup_steps: 500
max_batch_tokens: 16384
gradient_accumulation_steps: 4
max_eval_samples: 2000
eval_every: 500
save_every: 500

# Conv1d kernel size for local mixing
conv_kernel_size: 16

# Bidirectional warmup (0 = immediate bidi, teacher already warmed up)
bidi_warmup_steps: 0

# Local warmup steps for newly added param groups at stage transitions
local_warmup_steps: 500

# Compression ratio distribution. Post-survivorship-pivot (2026-04-15) the
# survivorship head is part of the encoder but Step 2 does not train it
# (no BCE/moment-match/soft-attn losses applied). Pinning target_ratio to
# 1.0 short-circuits the operator (`compression_off` in BgKITCompressor),
# so teacher and student both bypass the head and produce identical-shape
# tensors for the distillation losses (boundary, repro, projection,
# cosine). Without this pin, teacher and student would each run their
# (different, randomly-initialized) heads, producing mismatched survivor
# masks that break the distillation.
compression:
  target_ratio_min: 1.0     # pinned 1.0 — see comment above
  target_ratio_max: 1.0     # pinned 1.0 — see comment above
  eval_ratio: 1.0           # pinned 1.0 — see comment above

# Staged unfreezing thresholds (step numbers, live-tunable via control.json)
stages:
  stage_0_steps: 0       # conv1d only
  stage_1_steps: 10000   # + retrained MLPs
  stage_2_steps: 20000   # + frozen MLPs (now unfrozen)
  stage_3_steps: 30000   # + everything (FullAttn, embeddings, norms)

# Loss weights (all live-tunable via control.json)
loss_weights:
  boundary: 1.0
  repro: 2.0
  proj: 1.0
  cosine: 0.2

# Fresh wandb run
reset_wandb: true

checkpoint_pruning:
  enabled: true
  keep_best: 3
  keep_latest: 2
  metric: eval/loss
early_stopping:
  enabled: false
