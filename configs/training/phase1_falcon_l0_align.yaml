phase: phase1_falcon_l0_align
optimizer: muon
# Phase C: end-to-end alignment at the *minimum-necessary* compression.
#
# Falcon's projection_block.output_split_factor=2 means every Qwen
# survivor produces 2 Falcon-space embeddings; at non-forced positions
# (where Qwen→Falcon tokenizer alignment is heuristic) those 2-token
# expansions are bogus. Feeding the decoder ratio=1.0 (compression off,
# all positions survive) would teach the decoder to either decode bogus
# stream-noise or learn to ignore it — neither is useful. So instead we
# run "compression effectively off" as "*forced* compression only" —
# the encoder uses the companion's forced_survivor_mask to filter out
# the non-aligned positions, and the decoder sees a clean ~60% subset
# (the well-aligned tokenizer-pair positions the projection was actually
# trained against in dense_seed/forced_adapt). The survivor head fires
# for diagnostic + BCE supervision so it learns to predict the forced
# mask under the live encoder.l0 representation — that's the
# starting-point the Phase D ramp inherits.
max_steps: 8000
lr: 4.0e-5
encoder_lr: 1.5e-5
decoder_lr: 6.0e-5
warmup_steps: 500
bidi_warmup_steps: 0
# Profiled 2026-05-15 against max_batch_tokens=12288 / accum=4: per-step
# went from 44 s to 53 s and peak 43.8→72.2 GB. Doubling the microbatch
# does not reduce per-step time because per-microbatch fwd_backward
# overhead scales super-linearly (attention quadratic, Mamba state
# growth, dispatch on bigger tensors). The Python overhead lives in
# the per-LAYER op count, not the per-microbatch loop count. Keep
# 6144/8.
max_batch_tokens: 6144
gradient_accumulation_steps: 8
min_sample_length: 256
max_sample_length: 800
max_eval_samples: 1000
eval_every: 500
save_every: 1000

# Engage the forced-mask path: encoder uses batch["forced_survivor_mask_l0"]
# as the survivor selector (overrides head). Decoder receives only the
# well-aligned subset of projected embeddings.
use_forced_survivor_mask_l0: true

sampler:
  cost_multiplier: 1.0
  eval_cost_multiplier: 1.0

objectives:
  data_reconstruction: 1.0

# target_ratio is mostly cosmetic when forced_mask is provided (head
# selection is overridden). It still configures the DualThresholdController
# init and the curriculum bookkeeping. ~0.6 matches the typical forced
# survivor fraction so the head's threshold sits near the natural data
# distribution.
target_ratio_start: 0.6
target_ratio_end: 0.6
target_ratio_ramp_steps: 1
sample_target_ratio_during_training: false
l1_introduction_step: 999999999

# Survivorship aux losses + forced-mask head supervision. The forced
# BCE is the load-bearing one in this phase: it keeps the head matched
# to the forced selection under the live encoder, so Phase D can drop
# the forced-mask override and the head still picks approximately the
# right positions.
survivorship:
  l0:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.0
    utility_grad_loss_weight: 0.0
    moment_match_weight: 0.0
    min_survivors_loss_weight: 0.0
    # Bumped from 0.2: at 0.2 the supervised gradient was being swamped
    # by the dominant decoder-reconstruction loss and the head's
    # base_raw wasn't moving. 1.0 is strong enough to shape the head
    # in parallel with reconstruction. Live-tunable now via
    # ``forced_survivor_bce_weight_l0``.
    forced_survivor_bce_weight: 1.0
  l1:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.0
    utility_grad_loss_weight: 0.0
    moment_match_weight: 0.0
    min_survivors_loss_weight: 0.0

ice_distillation:
  l0:
    enabled: false
  l1:
    enabled: false

moment_match_reference:
  l0:
    path: ${oc.env:DATA_DIR}/diagnostics/ice_reference_moments.json
  l1:
    path: null

decoder_lora:
  enabled: false
  implementation: peft
  r: 16
  alpha: 32
  dropout: 0.0
  peft_fused_backward: true

freeze:
  bgkit: false
  decoder: false

# Pace optimization (2026-05-15): the default ``flush_when_free_below_gb=20``
# from compute/dgx_spark.yaml fires every step in Phase C — peak allocated
# is only ~28-30 GB but per-process cap is 97 GB (under
# BGKIT_CUDA_MEM_FRACTION=0.80), so free dips into the [5,15] GB band
# every step and triggers an expensive allocator-flush (~OS-mmap under
# expandable_segments). Phase C has plenty of headroom; only flush
# under real pressure. Lower the threshold so flush fires only when
# we're genuinely tight, not just because the pool is healthily full.
dynamic_ckpt:
  flush_when_free_below_gb: 6.0

data:
  # file_tokens_path + falcon_companion_dir come from training.data defaults
  # in configs/config.yaml (processed_v2 fast-mode companion). The
  # containment variant is intentionally NOT used here — Phase C wants the
  # full corpus for decoder LM CE diversity.
  prompt_variants_dir: configs/prompt_variants
  tokens:
    max_seq_len: 8192

model:
  decoder:
    family: falcon_h1
    backbone_name: tiiuae/Falcon-H1-Tiny-90M-Instruct
  # Falcon-specific anchor cap (see phase1_falcon_l0.yaml for rationale).
  threshold_controller:
    anchor_ratios: [0.02, 0.04, 0.08, 0.16, 0.32, 0.60]

    hidden_dim: 512
