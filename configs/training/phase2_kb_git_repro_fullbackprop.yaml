# Phase 2 KB — git_commit_repro PER-REPO full-backprop recursive-L1 curriculum.
#
# WHAT THIS RUNS
#   Dataset: git_commit_repro ONLY (file-state reconstruction). Per
#   (file, target_commit) the model browse-navigates a window of commits and
#   reconstructs the WHOLE FILE content (gold = the file blob in gold_answer).
#   Compression is MEANINGFUL here: the gold is produced by APPLYING the
#   retrieved diffs, not by copying a single passage, so we can push real
#   L0 + L1 compression.
#
# PER-REPO FULL-BACKPROP (recursive_l1_tree.full_backprop_per_repo: true)
#   A training batch is ONE (repo, history-window)'s file-samples (grouped by
#   RepoGroupedBatchSampler on the shared-subtree root = the window node id).
#   For each group the WHOLE window subtree is encoded ONCE — L0 LIVE on every
#   diff leaf -> L1 up the tree -> node reps — with a GENERAL query-agnostic
#   prompt (general_prompt below). Query-conditioned drill nodes reuse that
#   tree's child states but are encoded live for the file/commit task; the final
#   evidence drill encodes the relevant diff chain. The file-samples' losses are
#   backpropped through the SHARED tree (retain_graph across the repo's
#   file-samples; released by the final aux backward), so one optimizer step
#   updates L0 (live) + L1 + encoder.l1l1_bridge + tree reps + decoder.
#
#   This replaces the earlier PER-SAMPLE full-backprop (which re-encoded each
#   file's whole walk per sample, query-conditioned). Encoding the shared tree
#   once per repo amortizes the dominant cost across all of a repo's files.
#
# DISPATCH: phase: phase2_kb -> KRKBTrainer (scripts/train.py). Per-repo
#   full-backprop is a flag inside KRKBTrainer, not a new trainer.
#
# MEMORY: peak per step = the gradient-checkpointed shared tree (retained) +
#   ONE file-sample's drill encode + decoder forward at a time. Each
#   file-sample's decoder/drill graph is dropped (and collected) after its
#   backward; only the memo-referenced shared tree persists. With both
#   round-robin decoders resident (only one active per step), per-layer encoder
#   GC, and reentrant decoder GC this fits a batch-1-repo step. The .env
#   BGKIT_CUDA_MEM_FRACTION=0.80 guard (~97 GB cap on the 121 GB unified host)
#   makes a host FREEZE impossible (worst case = recoverable CUDA OOM).
phase: phase2_kb
stage: A                       # live-L0 semantics (live_l0 below)
optimizer: adamw

# Training horizon — bootstrap sizing; TUNABLE once git_commit_repro size known.
max_steps: 18000
warmup_steps: 300
# LR REBALANCE (2026-07-31 collapse fix). Root cause of the 9164 rep-collapse:
# the encoder LR (lr=1e-4 → l0/projection; l1_lr=2e-4 → l1/l1l1_bridge) OUTRAN
# the decoder LR (5e-5), so under full-backprop reconstruction the under-
# constrained encoder reps ran away (readable norm 4x → 12-320x embed-norm)
# while the decoder couldn't keep its readable code co-trained. Pin ALL of
# encoder (lr), L1 (l1_lr) and decoder (decoder_lr) to 5e-5 so the encoder can
# no longer outpace the decoder that has to read its reps. Requirement:
# encoder LR ≤ decoder LR and L1 LR ≤ decoder LR (here: equal). Still live-
# tunable — the base `lr` control.json handler scales all groups proportionally.
lr: 5.0e-5              # was 1.0e-4 — drives l0 + projection_blocks (via lr fallback)
decoder_lr: 5.0e-5     # unchanged — the ceiling the encoder must not exceed
l1_lr: 5.0e-5          # was 2.0e-4 — drives encoder.l1 backbone + l1l1_bridge
eval_every: 500
# Comprehensive ablation matrix run at every eval: re-runs the eval set under
# each mode and logs eval/ablation/{mode}/{loss,exact_match,token_f1,kb/tool_call_id_accuracy/bgkit}.
# zeroed=survivors→0, noise=survivors→gaussian, neither=survivors+topics→0.
# Baseline-vs-ablated GAP on exact_match/token_f1 = reconstruction dependence on reps;
# on bgkit tool-call-ID accuracy = navigation dependence. Plus eval/recon_gap + eval/nav_gap
# (CE split) below. Catches the decorative-reps shortcut (recon_gap→0) instead of hiding it.
eval_ablation_modes: [zeroed, noise, neither]
eval_gap_probe: true          # emit eval/recon_gap + eval/nav_gap (CE split, present-vs-zeroed)
# Small autonomous slice at every checkpoint evaluation. These metrics cannot
# be inflated by future teacher calls or the gold answer appearing in context.
# Use scripts/eval_phase2_kb.py for the larger final evaluation.
eval_free_running_samples: 4
eval_free_running_max_tool_calls: 16
eval_free_running_max_new_tokens: 8192
# Each entry owns a whole window's GPU survivor tensors; never scale this with
# eval-set size. Consecutive samples already reuse the currently installed tree.
eval_tree_cache_max_groups: 1
save_every: 500
reset_wandb: true
                    # was true for the 2026-07-21 fresh-run bringup (now run gfb9j36x)

# PROFILING (temporary): per-repo per-component timing. When true,
# _forward_backward_per_repo logs a `per_repo_timing` event per repo with synced
# perf_counter splits (shared_tree_encode / pass1_count / prep / drill_encode /
# assemble / decode_fwd / sample_backward / final_tree_backward + gpu_op_s vs
# cpu_op_s). The synchronize() is taken ONLY under this flag, so the real run
# keeps full CPU/GPU overlap. Flip back to false after profiling.
profile_timing: false

# batch_size is IGNORED in per-repo mode. gradient_accumulation_steps MUST be 1:
# the inner-loop (Model B) makes ONE subset-batch == ONE optimizer step (so each
# inner step is a real global step with its own LR/eval/save). accum>1 would
# fold multiple subsets into one step and break the inner-loop semantics. The
# warmup (one-step) path also runs one repo per optimizer step at accum=1.
batch_size: 1
gradient_accumulation_steps: 1

# Gradient checkpointing — REQUIRED + NON-REENTRANT. The per-repo path uses
# detach-and-reaccumulate (shared-tree backward runs ONCE, no retain_graph
# across the per-sample loop), so reentrant checkpointing — which holds extra
# state and interacts badly with repeated retain_graph backward — is no longer
# needed and is dropped: `gradient_checkpointing: true` is HF-default
# non-reentrant (use_reentrant=False) for the encoder, and the decoder uses the
# same via `true` (was "reentrant"). Turning GC off on this host has frozen the
# machine (see Stage A notes). Keep ON.
activation_checkpointing:
  encoder: false
  decoder: false
gradient_checkpointing: true
decoder_gradient_checkpointing: true

datasets:
  - git_commit_repro
# Fail setup if an ablation artifact overwrote the production trajectory path.
git_repro_allowed_drill_modes: [full]

# LIVE L0 — gradient trains the L0 backbone/head/auto_repro_head on the diff
# leaves of the shared tree. No L0 precompute / l0_cache needed (the earlier
# per-sample config froze L0 + read a cache; the per-repo redesign drops that).
live_l0: true
mmap_dir: ${oc.env:DATA_DIR}/mmap/phase2

# ── Recursive-L1 PER-REPO full-backprop ─────────────────────────────────────
recursive_l1_tree:
  enabled: true
  full_backprop_per_repo: true   # implies full_backprop
  # GENERAL (query-agnostic) compression prompt fed to BOTH L0 and L1 of the
  # shared repo tree. The drill-down bgkit turn uses the SPECIFIC per-turn
  # query (commit message + filename) instead.
  general_prompt: "compress this repository's commit history"

  # Exact top-k makes the requested compression rate deterministic. The
  # selection head is still trained by survivorship relevance/utility losses;
  # only the count controller is bypassed, so L1 theta updates are skipped.
  selection_mode_l1: exact_topk
  # Step-interpolated retention ramps (start -> end over ramp_steps, by
  # global_step). Recursive L0 (shared-tree diff leaves) 0.30 -> 0.05;
  # recursive L1 (up the tree) 0.30 -> 0.05.
  # HIGHER START (2026-07-06): begin content-RICHER (2x the old 0.15) so the reps
  # carry the diff content and we can see whether the model USES it (recon_gap),
  # THEN ramp to 0.05 to test compression. Was 0.15/0.30. History: 0.50 ballooned
  # the whole-tree decode to ~66k tokens → host OOM risk; 0.35 was memory-OK but
  # its biggest-repo Option-A backwards ran >300s → step-watchdog kills. 0.30
  # keeps ~50GB headroom + faster backwards. Live-tunable (pinned 0.30 via
  # control.json on the running job).
  # LESS-COMPRESSION TEST (2026-07-30): hold BOTH levels at 0.30 (constant, no
  # ramp-down) instead of ramping to 0.05. Rationale: the recon bug was two-layer
  # — (1) the exact_ratio_topk quota starvation (pinned IDs ate the content quota
  # → 0 diff survivors; FIXED in selection.py) and (2) query-agnostic drill under
  # a frozen selection policy so tight retention kept the WRONG survivors. With
  # the leaf now L0-exact_topk + query-conditioned (see _prepare_sample_for_decode
  # / _prepare_l1_turn), 0.30/0.30 delivers ~9% net leaf content (the intended
  # ~0.08 regime) so the decoder can actually reconstruct from it. 0.30 is the
  # memory-validated ceiling (0.35 tripped the step-watchdog, 0.50 host-OOM'd).
  # Revisit toward 0.08 once the selection is trained (relevance loss / STE).
  l0_retention:
    start: 0.30
    end: 0.30
    ramp_steps: 4000
  l1_retention:
    start: 0.30
    end: 0.30
    ramp_steps: 4000

  # ── QUERY-CONDITIONED DRILL NODES (2026-07-31 redesign) ───────────────────
  # EVERY trajectory drill turn — the head, the on-path interior nodes
  # (c16/c4/commit), the wrong-sibling DISTRACTOR node drills (content-driven
  # rejection needs them encoded under the same query), and the retrieve
  # leaf — is encoded LIVE per sample, conditioned on the sample's TASK QUERY,
  # instead of splicing the static general-prompt shared-tree rep (which made
  # navigation reps query-independent replays). Node turns route through the
  # generalized _shared_tree_head_survivor → _encode_tree_node_live (the
  # PROVEN head machinery: shared-tree child l1outs via detach-reaccumulate,
  # l1_auto_reproduce bridge, one L1 node forward under _head_query_emb) with
  # a FORCED per-node activation checkpoint, so activations free after each
  # forward and peak memory does NOT scale with path length. The SHARED TREE
  # ENCODE IS UNCHANGED (general prompt, ramps above at 0.30) — it remains the
  # child-survivor source and the single deferred tree backward; its static
  # proj reps are simply no longer spliced (the `used` list goes empty;
  # `child_used` carries all nodes). Flag OFF = exact legacy behavior.
  # LIVE-TUNABLE: {"phase2_kb": {"query_conditioned_drill_nodes": bool,
  # "drill_node_retention": r, "drill_leaf_l0_retention": r,
  # "drill_leaf_l1_retention": r}} (null clears an override).
  query_conditioned_drill_nodes: true
  # Retention of the per-sample query-conditioned node forwards (head +
  # interior + distractor node turns). Uniform 0.4 (vs the tree's 0.30).
  drill_node_retention: 0.4
  # Retrieve-leaf drill retention — NET 0.4 over the two leaf stages
  # (L0 × L1 = 0.63 × 0.63 ≈ 0.397): the leaf is the recon evidence, so the
  # net is what matters. Overrides l0_retention.git_commit_repro (leaf L0)
  # and the recursive-ramp coupling (leaf L1) for the drill ONLY; ALSO applied
  # by the single-sample EVAL path (_run_l1_batch None-default), so
  # recon_gap/decode are measured at the training regime instead of the old
  # eval quirk (sampled base l1_retention = 0.05).
  drill_leaf_retention:
    l0: 0.63
    l1: 0.63
  # Per-repo file-sample cap. REFRAMED to a COMPUTE knob, not a memory knob:
  # _forward_backward_per_repo is now count-then-stream (Pass 1 counts cheaply
  # with NO encode; Pass 2 encodes+decodes+backwards ONE sample at a time and
  # frees its graph each iteration), so per-sample graph memory is O(1)
  # regardless of repo size — a monster repo (e.g. simple-icons, thousands of
  # SVG file-samples) no longer holds thousands of live encode graphs / freezes
  # the host. What K still bounds: per-step COMPUTE — each contributing sample's
  # backward re-runs the GC'd shared-tree forward once (Nx recompute per repo) —
  # plus per-repo data balance (one monster repo shouldn't dominate a step). 32
  # caps that recompute/balance while keeping plenty of coverage; an int K
  # subsamples up to K file-samples per repo-batch (re-seeded per epoch so
  # coverage rotates), null = every file-sample.
  # LIVE-TUNABLE: write {"phase2_kb": {"max_file_samples_per_repo": <K-or-null>}}
  # to ${CHECKPOINT_DIR}/control.json to clamp down OR open back up mid-run
  # (takes effect on the next repo-batch, no restart).
  max_file_samples_per_repo: null

  # PASS-2 group-batch size G. The contributing samples are processed in groups
  # of G: per group ONE packed (FA4-varlen) L1 drill encode + per-sample decode
  # summed into ONE group backward — recovers GPU occupancy vs the previous
  # one-at-a-time (~32 tiny ops at ~38% occupancy) WITHOUT dropping samples and
  # WITHOUT re-running the shared tree (browse splices read the detached R_d;
  # the single FINAL detach-reaccumulate backward handles the tree once). Memory
  # stays bounded by G (+ gradient checkpointing of the group's forwards), not
  # by N. Gradient is invariant to G. LIVE-TUNABLE via control.json
  # {"phase2_kb": {"per_repo_sample_group_size": <G>}} to trade occupancy↔memory
  # mid-run (next repo, no restart). 8 is a safe start; raise if memory allows.
  per_repo_sample_group_size: 1

  # --- Per-repo SIZE FILTERS (DROP whole repos at grouping; null = off) ------
  # These DROP an over-threshold repo entirely (its window-0 tree is never
  # encoded), unlike max_file_samples_per_repo which only SUBSAMPLES a kept
  # repo. Logged as `phase2_kb_per_repo_size_filter` (n_repos/n_samples
  # before+after).
  #
  # EMPIRICAL NOTE (measured over the real git_commit_repro browse tree +
  # trajectories, 13342 repos / 1.868M samples — see the relaunch report):
  # window-0 is TOKEN-BUDGET-bounded, so leaf size is uniform, NOT heavy-tailed:
  #   leaf-diff TOKENS/window: p50 74k, p99 85k, MAX 90k (no outliers)
  #   leaf-diff COUNT/window:  p50 147, p99 389, max 1643
  #   file-SAMPLES/window:     p50 135, p99 374, MAX 1539 (the only real tail)
  # simple-icons/w000 is MID-PACK on all three (76k tok / 112 leaves / 104
  # samples), so it is NOT a size outlier — the earlier OOM hit a normal-sized
  # window. The only genuinely heavy-tailed metric is file-SAMPLES.
  #
  # max_repo_leaf_tokens: total L0-encoded leaf-diff tokens in window-0 (the
  #   shared-tree-encode memory driver). null here: windows are token-capped
  #   (~90k max) so no value both keeps the bulk AND drops monsters. Setting it
  #   scans the token store once at setup.
  max_repo_leaf_tokens: null
  # max_repo_file_samples: drop repos with more than this many (file,target)
  # reconstruction samples — the genuine outlier tail (mega doc/generated repos)
  # + a low-signal proxy. 500 drops 13 repos (0.1%, ~9.6k samples, e.g.
  # HackTricks 1539, yaml-test-suite 1126), keeping 99.5%.
  max_repo_file_samples: 500
  # max_repo_tree_nodes: drop repos whose window-0 SUBTREE has more than this
  # many nodes (interior + leaf-tag). This is the RETAINED-GRAPH memory driver
  # (one L0/L1 forward per node, held live by the final reaccumulate / across K
  # inner steps) and — unlike leaf-tokens — is HEAVY-TAILED, so it isolates the
  # OOM tail. Measured node-count/window: p50 68, p90 162, p95 203, p98 257,
  # max 673; an n_nodes=187 repo OOM'd at the 0.86 CUDA cap. 160 drops ~12.5%
  # (~1.67k repos), keeping windows below the n187 OOM point with margin. Raise
  # live (control.json) if the profile shows headroom; lower if it still OOMs.
  # 2026-08-01: 160 → 130. At the host-safe 0.80 CUDA cap (97 GB) a ~157-node
  # TRAINING repo (eval forward 53 GB × ~1.8 for backward ≈ 95-100 GB) tipped 78
  # MiB over the cap and crashed (falcon decode _swiglu_forward_packed). The 160
  # cap was sized for the old 0.86 fraction; we can't raise the fraction (0.80 is
  # host-calibrated — peak system_used already ~114 GB = the abort). So bound the
  # big-repo tail instead: 130 nodes ≈ 80 GB training peak (~17 GB margin) and
  # keeps drill retention (the recon_gap signal knob) at 0.4. Drops the ~p88+
  # node tail. Raise back toward 160 if the profile shows headroom.
  max_repo_tree_nodes: 130

  # --- INNER-LOOP per-repo mode (Model B; ENABLED for this run) -------------
  # Encode the tree ONCE per repo, then do K optimizer steps each on a
  # file-subset (S files), REUSING the progressively-stale retained LIVE tree
  # (delayed gradient — a deliberate choice; staleness bounded by K). Wiring
  # (no base_trainer.train() change): RepoGroupedBatchSampler emits each repo's
  # files as K consecutive subset-batches; the trainer encodes+caches the live
  # tree on a repo's first subset and reuses it for the rest, freeing on
  # repo-change (window-node id change). Each subset-batch flows through the
  # NORMAL outer step (optimizer.step/scheduler/eval/save/global-step), so each
  # inner step is a real global step. Requires gradient_accumulation_steps: 1.
  # WARMUP: the first inner_loop_warmup_steps global steps use the exact
  # one-step detach-reaccumulate path (clean gradient); at the boundary the
  # sampler is rebuilt into subset mode (a repo-boundary switch — no half-repo).
  # All four knobs are live-tunable via control.json.
  per_repo_inner_loop: false
  per_repo_inner_subset_size: 16     # S — files per inner step
  per_repo_max_inner_steps: 12       # K cap — bounds staleness + retained graph
  inner_loop_warmup_steps: 0       # first N global steps use the exact
                                     # one-step (clean-gradient) path

  # One coherent update per repository. The removed Option-A schedule updated
  # the decoder several times against a stale detached tree and only then
  # updated the encoder, so its gradients did not describe any single joint
  # model state.
  per_repo_option_a: false
  # 0 = UNLIMITED (process ALL files across ceil(n_contrib/S) subsets — the
  # user's core motivation: no file cap). Optional safety cap only.
  option_a_max_subsets: 0
  # DRILL CHECKPOINT (Option A retained-drill OOM fix): the deferred encoder
  # backward holds the per-file drill (live L1 encode) activations; without
  # this they accumulate O(files) → OOM. When the drill's flat content seqlen
  # exceeds this, the per-group run_l1_and_project forward is checkpointed so
  # its activations free after the forward and recompute (bit-exact) during the
  # encoder backward → peak bounded to ~one file's drill. 0 = off; parallel to
  # decode_gc_min_seqlen.
  drill_checkpoint_min_seqlen: 4096

  # --- SINGLE-FORWARD ACTIVATION-PEAK bounds (0 = off; live-tunable) ---------
  #   max_l0_encode_tokens: 0 = OFF = FULL TREE (no truncation). We WANT the
  #     full repo context — truncating the per-leaf L0 buffer (the old 16384)
  #     chopped the big initial-import commit to a 16k prefix, defeating the
  #     purpose. The full window is already budget-bounded at build time
  #     (~75-90k tokens). The full-tree L0 encode is now LARGE + RETAINED (R is
  #     held for the deferred encoder backward), so the tree-encode checkpoint
  #     (checkpoint_tree_encode + tree_checkpoint_min_tokens below) is now
  #     LOAD-BEARING to bound both the encode forward AND retained R to ~one
  #     node/chunk.
  #   max_decode_tokens: 0 keeps the complete file-state target. Prefix-only
  #     supervision is not equivalent to the task and made evaluation on the
  #     configured 8192-token gold cap partly out of distribution.
  max_l0_encode_tokens: 0
  max_decode_tokens: 0

  # FIX 2 (encode-chunking): checkpoint each tree node's L1 forward so its
  # activations are recomputed (one node at a time) on the final backward
  # instead of all being retained at once. Bounds the BIG-tree ENCODE peak
  # (measured ~0.7GB/node → ~78.5GB at 116 nodes, ~109GB at the 160-node cap)
  # to ~one node, regardless of tree size. Gradient is exact (checkpoint
  # recompute reaches every node); θ is accumulated once outside the checkpoint.
  checkpoint_tree_encode: true

  # SPEED (conditional checkpoint/GC): the checkpoint above + the interleaved
  # decode GC recompute in the backward, so they slow down EVERY step even
  # though only the rare large step needs them. Make both CONDITIONAL on size:
  #   tree_checkpoint_min_nodes — encode is only checkpointed when the repo's
  #     window-0 subtree has MORE than this many nodes. Small trees (the
  #     majority) encode un-checkpointed (~0.38GB/node → e.g. 64 nodes ≈ 24GB,
  #     fits) and skip recompute → fast; large trees checkpoint → bounded peak.
  #     Tune so (min_nodes * ~0.38GB) + baseline stays ≤ ~40GB.
  #   decode_gc_min_seqlen — decoder GC in the interleaved decode only engages
  #     when the decode seqlen exceeds this. Short decodes (~7-10GB/1000 tok,
  #     so S≤4096 ≈ ≤40GB) run un-GC'd → fast; long decodes GC → bounded.
  # Both are live-tunable via control.json (KRKBTrainer LIVE_CONFIG_HANDLERS).
  tree_checkpoint_min_nodes: 64
  #   tree_checkpoint_min_tokens — LOAD-BEARING for the FULL (uncapped-L0) tree:
  #     a LOW-node repo can still hold a huge initial-import leaf (~75-90k
  #     tokens); the node gate alone would skip it and retain the unbounded L0
  #     forward. This forces the per-node checkpoint when total L0 leaf tokens
  #     exceed it, bounding BOTH the encode forward AND the retained R to ~one
  #     node/chunk regardless of tree shape. (OR'd with the node gate.)
  tree_checkpoint_min_tokens: 16384
  decode_gc_min_seqlen: 4096

# L0 retention for the DRILL-DOWN bgkit encode (the file-diff at the target
# commit, with the specific query). Matched to the recursive L0 ramp for a
# coherent within-document compression curriculum (higher start 0.30 -> 0.05,
# 2026-07-06 — keep the drill's retrieval-leaf content richer early too; 0.50
# ballooned the decode + host RAM, see recursive_l1_tree note above).
# 2026-07-30: end 0.05 -> 0.30. This is the key that actually pins the DRILL/
# retrieve-leaf L0 (NOT recursive_l1_tree.l0_retention, which only governs the
# shared-tree nav nodes). At 0.05 the retrieve leaf delivered ~1.5% net, so the
# earlier "0.30 test" never reached the leaf. Hold at 0.30 (matches the recursive
# ramp pin) so the trajectory sees content-rich leaf reps while the channel is
# (re)built from the 51945 re-anchor.
# 2026-07-31: SUPERSEDED for the leaf by recursive_l1_tree.drill_leaf_retention
# (l0: 0.63) while that override is set — this map is now the FALLBACK (and
# still governs any non-drill live L0 encode for this dataset).
l0_retention:
  git_commit_repro:
    start: 0.30
    end: 0.30
    ramp_steps: 4000

# Top-level L1 retention. NOTE: this does NOT pin the drill-down retrieval —
# with drill_leaf_retention.l1 set (above) the leaf drill uses that override
# (training drivers AND the single-sample eval path); without it the drill
# shares the recursive L1 ramp (recursive_l1_tree.l1_retention) at runtime.
# This scalar only sizes the dual-ascent anchor grid + serves as the last
# fallback for non-recursive runs.
l1_retention: 0.05

# Jitter off — the recursive ramps drive retention deterministically.
l0_retention_jitter:
  enabled: false
l1_retention_jitter:
  enabled: false

# NOTE (2026-07-31): the splice-reconstruction aux + rep_gain canary were
# REMOVED. They decoded a raw [reps | prompt | text] framing WITHOUT the
# chat/tool template — garbage input for Falcon and a supervision signal on
# the wrong channel — so the whole block (aux hook, canary, config, live
# handler) was ripped out rather than fixed. The correct-template
# eval/recon_gap + eval/nav_gap metrics (eval_gap_probe above) remain the
# rep-dependence signal.

# Direct training (no LoRA): L1's LoRA was the only thing that broke GC
# recompute (LoRARouter thread-local state). L0 trains directly (live).
# l1l1_bridge + L1 backbone train directly. Round-robin projection blocks
# train too (they track the decoders).
lora:
  enabled: false
  train_l1_direct: true
  l0_rank: 32
  l1_rank: 32
  alpha: 64
  dropout: 0.0

# Train the selection heads on the actual git-history retrieval distribution.
# Hard top-k controls the count, while the relevance and utility losses below
# teach which states and distractors should occupy that count.
survivorship:
  survivorship_aux: true
  # --- Projection-output norm-band regularizer (2026-07-31, THE novel collapse
  # fix). Keeps every projected/spliced survivor-rep's L2 norm inside the
  # decoder's READABLE band and penalizes the inflation runaway that killed the
  # 9164 encoder (readable ~4x embed-norm → 12-35x → 320x, + content loss).
  # NOTE the reps are a CO-TRAINED code, NOT the embed_tokens manifold: even the
  # good 51945 reps sit at cos≈0 and norm ≈ 4.2x (qwen) / ~0.9x (falcon) of the
  # decoder embed_tokens row-norm — so we anchor the NORM band only (per family),
  # never the direction. target[fam] = target_ratio[fam] * mean(embed_tokens
  # row-L2-norm). Hinge-band (permissive inside [target/tol, target*tol]):
  #   loss = mean( relu( |log(rep_norm / target)| - log(tolerance) )^2 )
  # folded into the per-group reconstruction loss so its gradient flows through
  # projection_blocks[family] into the L1/L0 backbones (that is the point — it
  # constrains what the encoder PRODUCES). weight is live-tunable via
  # control.json ({"phase2_kb": {"projection_norm_reg_weight": w}}).
  projection_norm_reg:
    enabled: true
    # weight 0.1 -> 0.3 (2026-08-01): firmer pull on the qwen drift. Harmless
    # to the in-band falcon — its hinge penalty is exactly 0 inside the band.
    weight: 0.3
    # Per-family tolerance (scalar still accepted = one band width for all).
    # qwen35 rep norm drifted 6.5x -> 8.5x embed-norm (observed 2026-08-01)
    # against target 4.2 — at tol 2.0 the band ceiling was 8.4, so the drift
    # was barely penalized. Tighten qwen to 1.4 (ceiling 4.2*1.4 = 5.9)
    # WITHOUT tightening falcon_h1: falcon is stable in-band at ~0.62x
    # (target 0.9, band [0.45, 1.8]) and a shared tighten would start
    # penalizing it.
    tolerance:
      qwen35: 1.4           # tighter leash — only penalize outside [3.0, 5.9]
      falcon_h1: 2.0        # unchanged — only penalize outside [0.45, 1.8]
    target_ratio:
      qwen35: 4.2            # measured 51945 readable band (qwen embed-norm x)
      falcon_h1: 0.9        # measured 51945 readable band (falcon embed-norm x)
  relevance_loss_weight: 0.05
  relevance_gold_boost: 1.5
  relevance_distractor_damp: 0.5
  # Within-drill relevance distractors OFF — the drill-down redesign authors
  # NAVIGATION distractors into the trajectory data (wrong-sibling drills,
  # loss=False), a distinct mechanism. Avoid stacking within-drill distractors.
  n_distractors: 0
  ratio_loss_weight: 0.1
  decisiveness_loss_weight: 0.05
  l0:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.0
    utility_grad_loss_weight: 0.3
    moment_match_weight: 0.0
    min_survivors_loss_weight: 0.05
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3
  l1:
    ratio_loss_weight: 0.0
    decisiveness_loss_weight: 0.05
    utility_grad_loss_weight: 0.3
    moment_match_weight: 0.0
    min_survivors_loss_weight: 0.05
    min_survivors_floor_ratio: 0.02
    min_survivors_absolute_min: 1
    min_survivors_tau: 0.3

# L1 already distilled-bridge-warm; L0 inherits the summarization-trained head.
# No ICE warmup.
ice_distillation:
  l0:
    enabled: false
  l1:
    enabled: false

moment_match_reference:
  l0:
    path: null
  l1:
    path: null

# ── Encoder source: the CLEAN summarization round-robin checkpoint ──────────
# Drill-down redesign (2026-07-03): restart from the summarization checkpoint,
# discarding the misguided git-repro work. step51945 is self-contained — it
# already holds encoder.pt + decoder_qwen.pt + decoder_falcon.pt (both decoders
# co-trained), so NO decoder staging/copy is needed. It predates the l1l1_bridge
# distillation, so l1l1_bridge.* is ABSENT — from_pretrained_with_state_dict
# (strict=False) + _clone_l1l1_bridge_if_absent auto-clones it from
# l0.auto_repro_head, then _set_trainability unfreezes it. Full-backprop through
# the whole tree (the central goal) trains the bridge end-to-end from there.
# 2026-07-31 RE-ANCHOR to the CLEAN summarization base (collapse fix). The 9164
# encoder is the drifted/collapsed artifact we are repairing — starting from the
# hybrid (enc9164) re-anchors onto the OFF-manifold reps we are trying to escape.
# Restart instead from the matched summarization round-robin step-51945 checkpoint
# whose reps are strongly load-bearing (rep_gain +2 nats) and sit in the readable
# band (norm ≈ 4.2x qwen / 0.9x falcon embed-norm — the target_ratio above). It is
# self-contained (encoder.pt + decoder_qwen.pt + decoder_falcon.pt, both decoders
# co-trained), so NO decoder staging/copy is needed. It PREDATES the l1l1_bridge
# distillation, so l1l1_bridge.* is ABSENT: from_pretrained_with_state_dict
# (strict=False) + _clone_l1l1_bridge_if_absent auto-clone l1l1_bridge from the
# trained l0.auto_repro_head (L0->L1 bridge), then _set_trainability unfreezes it.
# Full-backprop through the whole tree trains the bridge end-to-end from that
# clone-init (the design intent — no separate re-distillation step; see report for
# the clone-init verdict + the trade-off vs the hybrid's specialized bridge).
phase1_checkpoint: /workspace/checkpoints/phase1_summarization_round_robin_step51945_20260624_060459

# ── Decoder: ROUND-ROBIN both families (Qwen-0.8B + Falcon-H1-90M) ──────────
# Both decoders resident; one family picked per repo-batch. Use a balanced
# distribution so the reported round-robin evaluation measures the same
# objective that training optimizes.
round_robin: true
qwen_decoder_prob: 0.5
decoder_qwen:
  family: qwen35
  backbone_name: Qwen/Qwen3.5-0.8B
decoder_falcon:
  family: falcon_h1
  backbone_name: tiiuae/Falcon-H1-Tiny-90M-Instruct

# Checkpoint pruning — keep a few best + latest.
checkpoint_pruning:
  enabled: true
  keep_best: 3
  keep_latest: 2
  metric: eval/loss
  lower_is_better: true
