# BgKIT top-level Hydra config
defaults:
  - model/bgkit
  - model/ice
  - model/decoder
  - model/projection
  - model/target_lm
  - data/repos
  - data/commits
  - data/tasks
  - data/corpus
  - data/tokens
  - data/ice_labels
  - compute/dgx_spark
  - _self_

seed: 42
project_name: bgkit
run_name: null  # auto-generated if null
batch_size: 32
checkpoint_dir: ${oc.env:CHECKPOINT_DIR,./checkpoints}
resume_checkpoint: null  # path to checkpoint dir for resume

control_file: null  # optional path to live HP control JSON

retry:
  enabled: false
  max_retries: 3
  base_delay: 30.0
  max_delay: 300.0

wandb:
  enabled: true
  project: bgkit
  entity: null
  tags: []
