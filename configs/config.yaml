# BgKIT top-level Hydra config
defaults:
  - model/bgkit
  - model/decoder
  - model/projection
  - model/survivorship_head
  - data/repos
  - data/commits
  - data/tasks
  - data/corpus
  - data/tokens
  - compute/dgx_spark
  - _self_
  - override hydra/job_logging: default

# Write Hydra outputs to /tmp so scripts work in read-only containers
hydra:
  run:
    dir: /tmp/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: /tmp/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}

seed: 42
project_name: bgkit
run_name: null  # auto-generated if null
batch_size: 32
checkpoint_dir: ${oc.env:CHECKPOINT_DIR}
resume_checkpoint: null  # null = auto-resume latest; "none" = fresh start; or explicit path

control_file: null  # optional path to live HP control JSON

training:
  # Shared decoder-training contract. Phases may override this only for named
  # diagnostics or legacy baselines.
  decoder_lora:
    enabled: false
    implementation: peft
    r: 16
    alpha: 32
    dropout: 0.0
    peft_fused_backward: true
    peft_fuse_gate_up: false
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  freeze:
    bgkit: false
    decoder: false
  decoder_gradient_checkpointing: false
  decoder_layerwise_split:
    mode: "0"
    min_ratio: 3.0
    min_prefix: 1536
    packed_deltanet: false
  decoder_ce_strict: true

retry:
  enabled: false
  max_retries: 3
  base_delay: 30.0
  max_delay: 300.0

wandb:
  enabled: true
  project: bgkit
  entity: null
  tags: []
